<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON CASES</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');

        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #0a0a0f;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Минималистичный дизайн */
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .neon-border {
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .neon-text {
            color: #a78bfa;
            text-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
        }

        /* Анимации кейсов */
        .case-shake {
            animation: shake 0.8s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10% { transform: translateX(-10px) rotate(-5deg); }
            20% { transform: translateX(10px) rotate(5deg); }
            30% { transform: translateX(-10px) rotate(-5deg); }
            40% { transform: translateX(10px) rotate(5deg); }
            50% { transform: translateX(-5px) rotate(-3deg); }
            60% { transform: translateX(5px) rotate(3deg); }
            70% { transform: translateX(-3px) rotate(-2deg); }
            80% { transform: translateX(3px) rotate(2deg); }
            90% { transform: translateX(-1px) rotate(-1deg); }
        }

        .case-spin {
            animation: caseSpin 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes caseSpin {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.3) rotate(180deg); }
            100% { transform: scale(1) rotate(360deg); }
        }

        /* Анимации свечения для разных редкостей */
        .glow-common {
            animation: glowCommon 2s ease-in-out infinite;
            box-shadow: 0 0 30px rgba(156, 163, 175, 0.3),
                       0 0 60px rgba(156, 163, 175, 0.1);
        }

        @keyframes glowCommon {
            0%, 100% {
                box-shadow: 0 0 30px rgba(156, 163, 175, 0.3),
                           0 0 60px rgba(156, 163, 175, 0.1);
                filter: brightness(1);
            }
            50% {
                box-shadow: 0 0 50px rgba(156, 163, 175, 0.5),
                           0 0 100px rgba(156, 163, 175, 0.2);
                filter: brightness(1.2);
            }
        }

        .glow-rare {
            animation: glowRare 2s ease-in-out infinite;
            box-shadow: 0 0 30px rgba(96, 165, 250, 0.4),
                       0 0 60px rgba(96, 165, 250, 0.2);
        }

        @keyframes glowRare {
            0%, 100% {
                box-shadow: 0 0 30px rgba(96, 165, 250, 0.4),
                           0 0 60px rgba(96, 165, 250, 0.2);
                filter: brightness(1);
            }
            50% {
                box-shadow: 0 0 60px rgba(96, 165, 250, 0.6),
                           0 0 120px rgba(96, 165, 250, 0.3);
                filter: brightness(1.3);
            }
        }

        .glow-epic {
            animation: glowEpic 1.5s ease-in-out infinite;
            box-shadow: 0 0 40px rgba(167, 139, 250, 0.5),
                       0 0 80px rgba(167, 139, 250, 0.3);
        }

        @keyframes glowEpic {
            0%, 100% {
                box-shadow: 0 0 40px rgba(167, 139, 250, 0.5),
                           0 0 80px rgba(167, 139, 250, 0.3);
                filter: brightness(1);
            }
            50% {
                box-shadow: 0 0 70px rgba(167, 139, 250, 0.7),
                           0 0 140px rgba(167, 139, 250, 0.4);
                filter: brightness(1.4);
            }
        }

        .glow-legendary {
            animation: glowLegendary 1s ease-in-out infinite;
            box-shadow: 0 0 50px rgba(251, 191, 36, 0.6),
                       0 0 100px rgba(251, 191, 36, 0.4),
                       0 0 150px rgba(251, 191, 36, 0.2);
        }

        @keyframes glowLegendary {
            0%, 100% {
                box-shadow: 0 0 50px rgba(251, 191, 36, 0.6),
                           0 0 100px rgba(251, 191, 36, 0.4),
                           0 0 150px rgba(251, 191, 36, 0.2);
                filter: brightness(1);
                transform: scale(1);
            }
            25% {
                box-shadow: 0 0 80px rgba(251, 191, 36, 0.8),
                           0 0 160px rgba(251, 191, 36, 0.5),
                           0 0 240px rgba(251, 191, 36, 0.3);
                filter: brightness(1.5);
                transform: scale(1.1);
            }
            50% {
                box-shadow: 0 0 100px rgba(251, 191, 36, 1),
                           0 0 200px rgba(251, 191, 36, 0.6),
                           0 0 300px rgba(251, 191, 36, 0.4);
                filter: brightness(1.8);
                transform: scale(1.15);
            }
            75% {
                box-shadow: 0 0 80px rgba(251, 191, 36, 0.8),
                           0 0 160px rgba(251, 191, 36, 0.5),
                           0 0 240px rgba(251, 191, 36, 0.3);
                filter: brightness(1.5);
                transform: scale(1.1);
            }
        }

        /* Появление предмета */
        .item-reveal {
            animation: itemReveal 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes itemReveal {
            0% { transform: scale(0) rotate(360deg); opacity: 0; }
            60% { transform: scale(1.2) rotate(-20deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); }
        }

        /* Частицы */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            pointer-events: none;
            animation: particleFly 1s ease-out forwards;
        }

        @keyframes particleFly {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        /* Лучи света для легендарок */
        .light-rays {
            position: absolute;
            inset: -50%;
            background: conic-gradient(from 0deg, transparent 0deg, rgba(251, 191, 36, 0.2) 10deg, transparent 20deg, transparent 40deg, rgba(251, 191, 36, 0.2) 50deg, transparent 60deg);
            animation: raysRotate 3s linear infinite;
            pointer-events: none;
        }

        @keyframes raysRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Rarity colors */
        .rarity-common { color: #9ca3af; }
        .rarity-rare { color: #60a5fa; }
        .rarity-epic { color: #a78bfa; }
        .rarity-legendary { color: #fbbf24; }

        .rarity-border-common { border-color: #9ca3af; }
        .rarity-border-rare { border-color: #60a5fa; }
        .rarity-border-epic { border-color: #a78bfa; }
        .rarity-border-legendary { border-color: #fbbf24; }

        .rarity-bg-common { background: rgba(156, 163, 175, 0.05); }
        .rarity-bg-rare { background: rgba(96, 165, 250, 0.05); }
        .rarity-bg-epic { background: rgba(167, 139, 250, 0.05); }
        .rarity-bg-legendary { background: rgba(251, 191, 36, 0.05); }

        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .slide-up {
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="pb-20">
    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 z-50 glass">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div>
                <h1 class="text-xl font-black tracking-tight">
                    <span class="neon-text">NEON</span> CASES
                </h1>
            </div>
            <div class="glass rounded-full px-4 py-2 flex items-center space-x-2">
                <span class="text-yellow-400">⚡</span>
                <span class="font-bold" id="balance">∞</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto px-4 pt-24">
        <!-- Tab: Cases -->
        <div id="tab-cases" class="tab-content">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-black mb-2">ОТКРЫВАЙ КЕЙСЫ</h2>
                <p class="text-gray-400 text-sm">Испытай удачу прямо сейчас</p>
            </div>

            <!-- Cases Grid -->
            <div class="space-y-4">
                <!-- Common Case -->
                <div class="glass rounded-2xl p-6 cursor-pointer hover:scale-105 transition-transform duration-300" onclick="openCase('common')">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-4">
                            <div class="text-6xl">📦</div>
                            <div>
                                <h3 class="text-xl font-bold">СТАНДАРТ</h3>
                                <p class="text-sm text-gray-400">Обычные предметы</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-sm text-gray-400">Шанс legendary</p>
                            <p class="text-2xl font-black text-yellow-400">2%</p>
                        </div>
                    </div>
                </div>

                <!-- VIP Case -->
                <div class="glass rounded-2xl p-6 cursor-pointer hover:scale-105 transition-transform duration-300 neon-border" onclick="openCase('vip')">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-4">
                            <div class="text-6xl">🎁</div>
                            <div>
                                <h3 class="text-xl font-bold neon-text">VIP</h3>
                                <p class="text-sm text-gray-400">Редкие предметы</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-sm text-gray-400">Шанс legendary</p>
                            <p class="text-2xl font-black text-yellow-400">5%</p>
                        </div>
                    </div>
                </div>

                <!-- Ultra Case -->
                <div class="glass rounded-2xl p-6 cursor-pointer hover:scale-105 transition-transform duration-300" onclick="openCase('ultra')">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-4">
                            <div class="text-6xl glow-pulse rounded-full">🔮</div>
                            <div>
                                <h3 class="text-xl font-bold text-yellow-400">ULTRA</h3>
                                <p class="text-sm text-gray-400">Легендарные предметы</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-sm text-gray-400">Шанс legendary</p>
                            <p class="text-2xl font-black text-yellow-400">15%</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Case Opening Animation -->
        <div id="case-animation" class="hidden fixed inset-0 bg-black/95 z-50 flex items-center justify-center">
            <div class="text-center relative">
                <!-- Light rays for legendary -->
                <div id="light-rays" class="light-rays hidden"></div>

                <div id="animation-content" class="mb-8 relative z-10">
                    <!-- Particles container -->
                    <div id="particles" class="absolute inset-0 pointer-events-none"></div>

                    <div class="relative">
                        <div class="text-9xl mb-8" id="case-icon">📦</div>
                        <div id="revealed-item" class="hidden">
                            <div id="item-glow" class="rounded-2xl p-8 inline-block">
                                <div class="text-9xl mb-4" id="item-icon">🗡️</div>
                                <h3 class="text-3xl font-black mb-2" id="item-name">Item Name</h3>
                                <p class="text-gray-400 mb-2" id="item-type">Type</p>
                                <p class="text-xl font-bold" id="item-rarity-text">Rarity</p>
                            </div>
                        </div>
                    </div>
                </div>
                <button id="continue-btn" class="hidden glass rounded-xl px-8 py-3 font-bold hover:scale-105 transition-transform relative z-10">
                    ПРОДОЛЖИТЬ
                </button>
            </div>
        </div>

        <!-- Tab: Inventory -->
        <div id="tab-inventory" class="tab-content hidden">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-black mb-2">ИНВЕНТАРЬ</h2>
                <p class="text-gray-400 text-sm">Твои предметы</p>
            </div>

            <!-- Inventory Items -->
            <div id="inventory-items" class="space-y-3">
                <!-- Items will be loaded here -->
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 glass">
        <div class="max-w-md mx-auto grid grid-cols-2">
            <button class="nav-btn py-4 flex flex-col items-center space-y-1 text-purple-400" data-tab="cases" onclick="switchTab('cases', this)">
                <span class="text-2xl">🎮</span>
                <span class="text-xs font-bold">КЕЙСЫ</span>
            </button>
            <button class="nav-btn py-4 flex flex-col items-center space-y-1 text-gray-400" data-tab="inventory" onclick="switchTab('inventory', this)">
                <span class="text-2xl">🎒</span>
                <span class="text-xs font-bold">ИНВЕНТАРЬ</span>
            </button>
        </div>
    </nav>

    <!-- Toast notification -->
    <div id="toast" class="hidden fixed top-20 left-1/2 transform -translate-x-1/2 glass rounded-xl px-6 py-3 z-50 slide-up"></div>

    <script>
        // Тестовые данные
        const testData = {
            items: [
                // Common items
                { id: 1, name: 'P250', type: 'weapon', rarity: 'common', base_price: 50 },
                { id: 2, name: 'Glock-18', type: 'weapon', rarity: 'common', base_price: 75 },
                { id: 3, name: 'MP9', type: 'weapon', rarity: 'common', base_price: 100 },
                { id: 4, name: 'Nova', type: 'weapon', rarity: 'common', base_price: 90 },
                { id: 5, name: 'UMP-45', type: 'weapon', rarity: 'common', base_price: 110 },
                { id: 6, name: 'PP-Bizon', type: 'weapon', rarity: 'common', base_price: 120 },

                // Rare items
                { id: 7, name: 'AK-47', type: 'weapon', rarity: 'rare', base_price: 500 },
                { id: 8, name: 'M4A4', type: 'weapon', rarity: 'rare', base_price: 550 },
                { id: 9, name: 'AWP', type: 'weapon', rarity: 'rare', base_price: 800 },
                { id: 10, name: 'Desert Eagle', type: 'weapon', rarity: 'rare', base_price: 400 },
                { id: 11, name: 'USP-S', type: 'weapon', rarity: 'rare', base_price: 450 },
                { id: 12, name: 'FAMAS', type: 'weapon', rarity: 'rare', base_price: 350 },

                // Epic items
                { id: 13, name: 'M9 Bayonet', type: 'knife', rarity: 'epic', base_price: 2000 },
                { id: 14, name: 'Karambit', type: 'knife', rarity: 'epic', base_price: 2500 },
                { id: 15, name: 'Butterfly Knife', type: 'knife', rarity: 'epic', base_price: 3000 },
                { id: 16, name: 'Sport Gloves', type: 'glove', rarity: 'epic', base_price: 1500 },

                // Legendary items
                { id: 17, name: 'Dragon Lore', type: 'weapon', rarity: 'legendary', base_price: 10000 },
                { id: 18, name: 'Howl', type: 'weapon', rarity: 'legendary', base_price: 12000 },
                { id: 19, name: 'Fire Serpent', type: 'weapon', rarity: 'legendary', base_price: 15000 },
                { id: 20, name: 'Golden Karambit', type: 'knife', rarity: 'legendary', base_price: 20000 },
            ],
            inventory: [],
            inventoryItemId: 1
        };

        // Состояние приложения
        const state = {
            currentTab: 'cases',
            isOpening: false
        };

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            console.log('NEON CASES initialized');
            loadInventory();
        });

        // Переключение вкладок
        function switchTab(tab, btn) {
            state.currentTab = tab;

            // Обновляем навигацию
            document.querySelectorAll('.nav-btn').forEach(b => {
                b.classList.remove('text-purple-400');
                b.classList.add('text-gray-400');
            });
            if (btn) {
                btn.classList.remove('text-gray-400');
                btn.classList.add('text-purple-400');
            }

            // Показываем нужную вкладку
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.add('hidden');
            });
            document.getElementById(`tab-${tab}`).classList.remove('hidden');

            // Обновляем данные
            if (tab === 'inventory') loadInventory();
        }

        // Открытие кейса
        function openCase(caseType) {
            if (state.isOpening) return;
            state.isOpening = true;

            // Показываем анимацию
            showCaseAnimation(caseType);

            // Выбираем случайный предмет
            setTimeout(() => {
                const item = getRandomItem(caseType);
                testData.inventory.push({
                    ...item,
                    inventoryId: testData.inventoryItemId++,
                    obtainedAt: new Date()
                });

                // Показываем выпавший предмет
                showRevealedItem(item);
                loadInventory();
            }, 2000);
        }

        // Показать анимацию кейса
        function showCaseAnimation(caseType) {
            const animation = document.getElementById('case-animation');
            const caseIcon = document.getElementById('case-icon');
            const revealedItem = document.getElementById('revealed-item');
            const continueBtn = document.getElementById('continue-btn');
            const lightRays = document.getElementById('light-rays');

            // Сбрасываем состояние
            revealedItem.classList.add('hidden');
            continueBtn.classList.add('hidden');
            lightRays.classList.add('hidden');

            // Настраиваем иконку
            caseIcon.textContent = caseType === 'vip' ? '🎁' : caseType === 'ultra' ? '🔮' : '📦';
            caseIcon.classList.remove('hidden');

            // Показываем анимацию
            animation.classList.remove('hidden');

            // Запускаем анимацию
            caseIcon.classList.add('case-shake');

            // Убираем анимацию
            setTimeout(() => {
                caseIcon.classList.remove('case-shake');
                caseIcon.classList.add('case-spin');
            }, 800);

            setTimeout(() => {
                caseIcon.classList.remove('case-spin');
            }, 1400);
        }

        // Создание частиц в зависимости от редкости
        function createParticles(rarity) {
            const container = document.getElementById('particles');
            container.innerHTML = '';

            const colors = {
                common: ['#9ca3af', '#d1d5db', '#e5e7eb', '#f3f4f6'],
                rare: ['#60a5fa', '#3b82f6', '#93c5fd', '#2563eb'],
                epic: ['#a78bfa', '#8b5cf6', '#c4b5fd', '#7c3aed'],
                legendary: ['#fbbf24', '#f59e0b', '#fcd34d', '#d97706', '#fde68a']
            };

            const particleColors = colors[rarity] || colors.common;
            const particleCount = rarity === 'legendary' ? 40 : rarity === 'epic' ? 30 : rarity === 'rare' ? 25 : 20;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.backgroundColor = particleColors[Math.floor(Math.random() * particleColors.length)];
                particle.style.left = '50%';
                particle.style.top = '50%';

                // Случайное направление
                const angle = (Math.PI * 2 * i) / particleCount;
                const distance = 100 + Math.random() * 200;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;

                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');

                // Случайная задержка
                particle.style.animationDelay = Math.random() * 0.5 + 's';

                container.appendChild(particle);
            }
        }

        // Показать выпавший предмет
        function showRevealedItem(item) {
            const caseIcon = document.getElementById('case-icon');
            const revealedItem = document.getElementById('revealed-item');
            const continueBtn = document.getElementById('continue-btn');
            const itemGlow = document.getElementById('item-glow');
            const lightRays = document.getElementById('light-rays');

            // Скрываем кейс
            caseIcon.classList.add('hidden');

            // Настраиваем предмет
            document.getElementById('item-icon').textContent = getItemIcon(item.type);
            document.getElementById('item-name').textContent = item.name;
            document.getElementById('item-type').textContent = getItemTypeText(item.type);

            const rarityText = document.getElementById('item-rarity-text');
            rarityText.textContent = getRarityText(item.rarity).toUpperCase();
            rarityText.className = 'text-xl font-bold rarity-' + item.rarity;

            // Настраиваем свечение в зависимости от редкости
            itemGlow.className = 'rounded-2xl p-8 inline-block glow-' + item.rarity;

            // Добавляем рамку
            itemGlow.classList.add('rarity-border-' + item.rarity, 'rarity-bg-' + item.rarity, 'border-2');

            // Показываем лучи света для легендарок
            if (item.rarity === 'legendary') {
                lightRays.classList.remove('hidden');
                lightRays.style.display = 'block';
            } else {
                lightRays.classList.add('hidden');
                lightRays.style.display = 'none';
            }

            // Показываем предмет с анимацией
            revealedItem.classList.remove('hidden');
            revealedItem.classList.add('item-reveal');

            // Создаем частицы
            createParticles(item.rarity);

            // Показываем кнопку
            setTimeout(() => {
                continueBtn.classList.remove('hidden');
                continueBtn.classList.add('fade-in');
            }, 1500);

            // Сбрасываем состояние
            state.isOpening = false;
        }

        // Закрыть анимацию
        function closeCaseAnimation() {
            document.getElementById('case-animation').classList.add('hidden');
            document.getElementById('particles').innerHTML = '';
            document.getElementById('light-rays').style.display = 'none';
        }

        // Получить случайный предмет
        function getRandomItem(caseType) {
            const weights = {
                'common': { common: 70, rare: 20, epic: 8, legendary: 2 },
                'vip': { common: 50, rare: 30, epic: 15, legendary: 5 },
                'ultra': { common: 30, rare: 35, epic: 20, legendary: 15 }
            };

            const rarity = weightedRandom(weights[caseType]);
            const items = testData.items.filter(i => i.rarity === rarity);

            if (items.length === 0) {
                return testData.items[Math.floor(Math.random() * testData.items.length)];
            }

            return items[Math.floor(Math.random() * items.length)];
        }

        // Взвешенный случайный выбор
        function weightedRandom(weights) {
            const total = Object.values(weights).reduce((a, b) => a + b, 0);
            let random = Math.random() * total;

            for (const [key, weight] of Object.entries(weights)) {
                random -= weight;
                if (random <= 0) return key;
            }

            return Object.keys(weights)[0];
        }

        // Загрузка инвентаря
        function loadInventory() {
            const container = document.getElementById('inventory-items');

            if (testData.inventory.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-gray-500">
                        <div class="text-6xl mb-4">🎒</div>
                        <p class="text-lg font-bold">ПУСТО</p>
                        <p class="text-sm">Открой кейсы, чтобы получить предметы</p>
                    </div>
                `;
                return;
            }

            // Группируем предметы
            const groupedItems = {};
            testData.inventory.forEach(item => {
                const key = item.name;
                if (!groupedItems[key]) {
                    groupedItems[key] = { ...item, count: 1 };
                } else {
                    groupedItems[key].count++;
                }
            });

            container.innerHTML = Object.values(groupedItems).map(item => `
                <div class="glass rounded-xl p-4 rarity-bg-${item.rarity} rarity-border-${item.rarity} border slide-up">
                    <div class="flex items-center space-x-3">
                        <div class="text-4xl">${getItemIcon(item.type)}</div>
                        <div class="flex-1">
                            <h4 class="font-bold rarity-${item.rarity}">${item.name}</h4>
                            <p class="text-xs text-gray-400">${getRarityText(item.rarity)}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-2xl font-black text-gray-400">x${item.count}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Вспомогательные функции
        function getItemIcon(type) {
            const icons = {
                'weapon': '🔫',
                'knife': '🗡️',
                'glove': '🧤'
            };
            return icons[type] || '📦';
        }

        function getItemTypeText(type) {
            const types = {
                'weapon': 'Оружие',
                'knife': 'Нож',
                'glove': 'Перчатки'
            };
            return types[type] || type;
        }

        function getRarityText(rarity) {
            const rarities = {
                'common': 'Обычный',
                'rare': 'Редкий',
                'epic': 'Эпический',
                'legendary': 'Легендарный'
            };
            return rarities[rarity] || rarity;
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('hidden');
            toast.classList.add('slide-up');

            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('slide-up');
            }, 2000);
        }

        // Обработчик для кнопки "Продолжить"
        document.getElementById('continue-btn').addEventListener('click', closeCaseAnimation);
    </script>
</body>
</html>
