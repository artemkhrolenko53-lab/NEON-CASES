<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STORM CASES</title>
    <style>
        /* (все стили остаются без изменений, как в исходном коде) */
        :root { --bg: #08080f; --bg2: #0e0e18; --card: rgba(255,255,255,0.04); --card-hover: rgba(255,255,255,0.08); --border: rgba(255,255,255,0.08); --glass: rgba(20,20,35,0.75); --text: #e8e8f0; --text2: #9a9ab0; --accent: #7c3aed; --accent2: #a855f7; --gold: #ffd700; --green: #22c55e; --red: #ef4444; --orange: #f97316; --c-common: #9e9e9e; --c-rare: #4fc3f7; --c-epic: #ab47bc; --c-legendary: #ffd700; --c-mythic: #ff4081; --radius: 14px; --maxw: 420px; --shadow: 0 8px 32px rgba(0,0,0,0.5); --transition: 0.25s cubic-bezier(0.4,0,0.2,1); }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html,body { height:100%; font-family:'Segoe UI',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
        body { display:flex; justify-content:center; align-items:center; background:radial-gradient(ellipse at 50% 0%, #1a1a2e 0%, #08080f 60%); }
        #app { width:100%; max-width:var(--maxw); height:100vh; max-height:100dvh; display:flex; flex-direction:column; position:relative; overflow:hidden; background:var(--bg); border-radius:0; box-shadow:var(--shadow); }
        @media(min-width:421px) { #app { border-radius:20px; height:90vh; max-height:780px; } }
        .screen { position:absolute; inset:0; display:none; flex-direction:column; overflow-y:auto; overflow-x:hidden; padding:16px; animation:fadeIn 0.3s ease; background:var(--bg); }
        .screen.active { display:flex; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(10px);} to { opacity:1; transform:translateY(0);} }
        @keyframes pulse { 0%,100% { transform:scale(1);} 50% { transform:scale(1.05);} }
        @keyframes shake { 0%,100% { transform:translateX(0);} 10%,30%,50%,70%,90% { transform:translateX(-8px);} 20%,40%,60%,80% { transform:translateX(8px);} }
        @keyframes spinReveal { 0% { transform:rotate(0deg) scale(0.5); opacity:0;} 50% { transform:rotate(180deg) scale(1.1); opacity:1;} 100% { transform:rotate(360deg) scale(1);} }
        @keyframes glow { 0%,100% { box-shadow:0 0 15px rgba(124,58,237,0.5);} 50% { box-shadow:0 0 35px rgba(168,85,247,0.8);} }
        .shake { animation:shake 0.5s ease; }
        .spin-reveal { animation:spinReveal 0.8s ease forwards; }
        .glass { background:var(--glass); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
        .card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; transition:var(--transition); cursor:pointer; }
        .card:hover { background:var(--card-hover); transform:translateY(-2px); }
        .card:active { transform:scale(0.97); }
        .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 20px; border-radius:10px; border:none; font-size:14px; font-weight:600; cursor:pointer; transition:var(--transition); letter-spacing:0.3px; background:var(--accent); color:#fff; width:100%; text-align:center; user-select:none; }
        .btn:hover { background:var(--accent2); transform:translateY(-1px); }
        .btn:active { transform:scale(0.96); }
        .btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
        .btn-secondary { background:rgba(255,255,255,0.08); color:var(--text); border:1px solid var(--border); }
        .btn-secondary:hover { background:rgba(255,255,255,0.15); }
        .btn-danger { background:var(--red); }
        .btn-danger:hover { background:#dc2626; }
        .btn-success { background:var(--green); }
        .btn-success:hover { background:#16a34a; }
        .btn-sm { padding:7px 12px; font-size:12px; width:auto; border-radius:7px; }
        .btn-xs { padding:5px 9px; font-size:11px; width:auto; border-radius:6px; }
        input,textarea,select { width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border); background:rgba(255,255,255,0.05); color:var(--text); font-size:14px; outline:none; transition:var(--transition); font-family:inherit; }
        input:focus,textarea:focus,select:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(124,58,237,0.2); }
        input::placeholder,textarea::placeholder { color:#555; }
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); display:none; align-items:center; justify-content:center; z-index:1000; padding:16px; animation:fadeIn 0.2s ease; }
        .modal-overlay.active { display:flex; }
        .modal { background:var(--glass); backdrop-filter:blur(25px); -webkit-backdrop-filter:blur(25px); border:1px solid var(--border); border-radius:var(--radius); padding:20px; width:100%; max-width:380px; max-height:85vh; overflow-y:auto; box-shadow:var(--shadow); animation:fadeIn 0.3s ease; }
        .modal h3 { margin-bottom:14px; font-size:18px; font-weight:700; text-align:center; color:var(--text); }
        .modal { position:relative; }
        .tab-bar { display:flex; gap:6px; padding:8px 0; border-bottom:1px solid var(--border); margin-bottom:12px; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; }
        .tab-btn { padding:9px 14px; border-radius:8px; border:none; background:transparent; color:var(--text2); font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; transition:var(--transition); flex-shrink:0; }
        .tab-btn.active { background:var(--accent); color:#fff; }
        .tab-btn:hover:not(.active) { background:rgba(255,255,255,0.06); }
        .rarity-common { color:var(--c-common); }
        .rarity-rare { color:var(--c-rare); }
        .rarity-epic { color:var(--c-epic); }
        .rarity-legendary { color:var(--c-legendary); }
        .rarity-mythic { color:var(--c-mythic); text-shadow:0 0 10px rgba(255,64,129,0.6); }
        .badge { display:inline-block; padding:3px 8px; border-radius:5px; font-size:11px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; }
        .badge-common { background:rgba(158,158,158,0.2); color:var(--c-common); }
        .badge-rare { background:rgba(79,195,247,0.2); color:var(--c-rare); }
        .badge-epic { background:rgba(171,71,188,0.25); color:var(--c-epic); }
        .badge-legendary { background:rgba(255,215,0,0.2); color:var(--c-legendary); }
        .badge-mythic { background:rgba(255,64,129,0.25); color:var(--c-mythic); animation:glow 2s infinite; }
        .item-row { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.05); margin-bottom:6px; transition:var(--transition); cursor:pointer; }
        .item-row:hover { background:rgba(255,255,255,0.06); }
        .item-icon { width:40px; height:40px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; background:rgba(255,255,255,0.05); }
        .chat-message { padding:8px 12px; border-radius:12px; margin-bottom:6px; max-width:80%; word-wrap:break-word; font-size:13px; line-height:1.4; }
        .chat-message.own { margin-left:auto; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
        .chat-message.other { margin-right:auto; background:rgba(255,255,255,0.1); color:var(--text); border-bottom-left-radius:4px; }
        .chat-message .sender { font-size:11px; font-weight:700; opacity:0.7; margin-bottom:2px; }
        .chat-message .time { font-size:10px; opacity:0.5; text-align:right; margin-top:3px; }
        .scroll-y { overflow-y:auto; flex:1; min-height:0; -webkit-overflow-scrolling:touch; }
        .flex-col { display:flex; flex-direction:column; gap:8px; }
        .flex-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
        .mt-8 { margin-top:8px; }
        .mt-12 { margin-top:12px; }
        .mt-16 { margin-top:16px; }
        .mb-8 { margin-bottom:8px; }
        .mb-12 { margin-bottom:12px; }
        .text-center { text-align:center; }
        .text-sm { font-size:12px; }
        .text-xs { font-size:11px; }
        .text-muted { color:var(--text2); }
        .fw-bold { font-weight:700; }
        .w-100 { width:100%; }
        .gap-6 { gap:6px; }
        .gap-8 { gap:8px; }
        .gap-10 { gap:10px; }
        .hidden { display:none !important; }
        .server-card { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; margin-bottom:8px; border-radius:var(--radius); background:var(--card); border:1px solid var(--border); cursor:pointer; transition:var(--transition); }
        .server-card:hover { background:var(--card-hover); transform:translateX(4px); }
        .server-online { display:flex; align-items:center; gap:5px; font-size:13px; color:var(--green); }
        .dot { width:8px; height:8px; border-radius:50%; background:var(--green); display:inline-block; }
        .dot-offline { background:var(--red); }
        .case-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .case-card { padding:14px; text-align:center; border-radius:var(--radius); background:var(--card); border:1px solid var(--border); cursor:pointer; transition:var(--transition); position:relative; overflow:hidden; }
        .case-card:hover { background:var(--card-hover); transform:translateY(-3px); }
        .case-card .case-icon { font-size:40px; margin-bottom:8px; animation:pulse 2s infinite; }
        .case-card .price { font-weight:700; color:var(--gold); font-size:14px; }
        .admin-badge { background:var(--accent); color:#fff; padding:2px 8px; border-radius:4px; font-size:10px; font-weight:700; letter-spacing:0.5px; }
        .warn-badge { background:var(--orange); color:#fff; padding:2px 6px; border-radius:4px; font-size:10px; }
        .filter-section { background:rgba(255,255,255,0.03); border-radius:10px; padding:12px; margin-bottom:10px; display:none; }
        .filter-section.active { display:block; animation:fadeIn 0.2s ease; }
        .market-row { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.05); margin-bottom:6px; }
        .case-animation-container { text-align:center; padding:30px 10px; position:relative; }
        .case-animation-container .case-box { font-size:80px; animation:shake 0.5s infinite; }
        .case-animation-container .reveal-item { font-size:60px; display:none; animation:spinReveal 0.8s ease forwards; }
        .stat-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.05); }
        .stat-row:last-child { border-bottom:none; }
        .toggle-switch { width:48px; height:26px; border-radius:13px; background:rgba(255,255,255,0.15); cursor:pointer; position:relative; transition:var(--transition); flex-shrink:0; }
        .toggle-switch.active { background:var(--accent); }
        .toggle-switch::after { content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:var(--transition); }
        .toggle-switch.active::after { left:25px; }
        .admin-tab-content { display:none; }
        .admin-tab-content.active { display:block; animation:fadeIn 0.2s ease; }
        ::-webkit-scrollbar { width:4px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.2); border-radius:2px; }
        .price-tag { color:var(--gold); font-weight:700; }
        .empty-state { text-align:center; padding:30px 15px; color:var(--text2); font-size:14px; }
        .empty-state .icon { font-size:48px; margin-bottom:10px; opacity:0.5; }
    </style>
</head>
<body>
    <div id="app">
        <!-- Servers Screen (выбор сервера) -->
        <div class="screen active" id="screen-servers">
            <div class="flex-col" style="height:100%;">
                <div class="text-center mb-12">
                    <h2 style="font-size:22px;font-weight:700;">Выбор сервера</h2>
                    <p class="text-muted text-sm mt-8" id="servers-greeting"></p>
                </div>
                <div class="scroll-y flex-col gap-8" style="flex:1;">
                    <div id="servers-list"></div>
                </div>
                <button class="btn btn-secondary mt-8" id="btn-logout">Выйти</button>
            </div>
        </div>

        <!-- Main Screen -->
        <div class="screen" id="screen-main">
            <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0 10px;border-bottom:1px solid var(--border);margin-bottom:10px;flex-wrap:wrap;gap:6px;">
                <div class="flex-row gap-8">
                    <span class="fw-bold" id="main-nick">Игрок</span>
                    <span class="badge badge-common" id="main-server-badge">Server</span>
                </div>
                <div class="flex-row gap-8">
                    <span class="price-tag" id="main-balance" style="cursor:pointer;">💰 0</span>
                </div>
            </div>
            <div class="tab-bar" id="main-tabs">
                <button class="tab-btn active" data-tab="cases">🎁 Кейсы</button>
                <button class="tab-btn" data-tab="inventory">🎒 Инвентарь</button>
                <button class="tab-btn" data-tab="market">📦 Рынок</button>
                <button class="tab-btn" data-tab="chat">💬 Чат</button>
                <button class="tab-btn" data-tab="settings">⚙️</button>
            </div>
            <div class="scroll-y" style="flex:1;" id="main-content"></div>
        </div>
    </div>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal-content"></div>
    </div>

    <script>
        (function() {
            // ========== API Configuration ==========
            const API_URL = 'https://evil-candies-peel.loca.lt';
            let initData = '';
            let currentState = null; // полное состояние с сервера
            let currentUser = null;
            let currentServer = null;
            let currentTab = 'cases';
            let caseOpeningInProgress = false;

            // Получение Telegram initData
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    const tg = window.Telegram.WebApp;
                    tg.ready();
                    tg.expand();
                    initData = tg.initData || '';
                } else {
                    // Для тестирования без Telegram
                    initData = 'user=%7B%22id%22%3A123456789%2C%22first_name%22%3A%22Test%22%7D';
                }
            } catch (e) {
                console.warn('Telegram WebApp not available');
                initData = 'user=%7B%22id%22%3A123456789%2C%22first_name%22%3A%22Test%22%7D';
            }

            // ========== API Functions ==========
            async function apiRequest(endpoint, method = 'GET', body = null) {
                const headers = {
                    'Content-Type': 'application/json',
                    'X-Telegram-Init-Data': initData,
                };
                const config = { method, headers };
                if (body) config.body = JSON.stringify(body);
                try {
                    const response = await fetch(`${API_URL}${endpoint}`, config);
                    if (!response.ok) {
                        let errorMsg = 'Ошибка сервера';
                        try {
                            const errData = await response.json();
                            errorMsg = errData.detail || errorMsg;
                        } catch (e) {}
                        throw new Error(errorMsg);
                    }
                    return await response.json();
                } catch (e) {
                    console.error('API Error:', e);
                    throw e;
                }
            }

            async function registerUser() {
                return await apiRequest('/api/register', 'POST');
            }

            async function loadState() {
                currentState = await apiRequest('/api/state', 'GET');
                currentUser = currentState.user;
                if (currentUser.server) {
                    currentServer = { name: currentUser.server }; // временно, полный объект сервера получим из state.server_settings
                }
                return currentState;
            }

            async function performAction(actionType, payload = {}) {
                const result = await apiRequest('/api/action', 'POST', { type: actionType, ...payload });
                // После действия перезагружаем полное состояние
                await loadState();
                return result;
            }

            // ========== UI Helpers ==========
            function showScreen(screenId) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(screenId).classList.add('active');
            }

            function closeModal() {
                document.getElementById('modal-overlay').classList.remove('active');
                document.getElementById('modal-content').innerHTML = '';
                caseOpeningInProgress = false;
            }

            function openModal(html) {
                document.getElementById('modal-content').innerHTML = html;
                document.getElementById('modal-overlay').classList.add('active');
            }

            function showError(message) {
                openModal(`<h3>❌ Ошибка</h3><p class="text-center text-muted">${message}</p><button class="btn mt-8" onclick="closeModal()">ОК</button>`);
            }

            function getItemInfo(itemId) {
                if (!currentState || !currentState.items) return { id: itemId, name: 'Неизвестно', icon: '❓', rarity: 'common' };
                for (const rarity in currentState.items) {
                    const item = currentState.items[rarity].find(i => i.id === itemId);
                    if (item) return item;
                }
                return { id: itemId, name: itemId, icon: '❓', rarity: 'common' };
            }

            function getRarityLabel(rarity) {
                return currentState?.rarity_labels?.[rarity] || rarity;
            }

            function estimateItemPrice(rarity) {
                const base = { common: 50, rare: 150, epic: 400, legendary: 1000, mythic: 3000 };
                return base[rarity] || 50;
            }

            function getSellPrice(rarity) {
                const multiplier = currentState?.server_settings?.sell_multiplier || 0.5;
                return Math.floor(estimateItemPrice(rarity) * multiplier);
            }

            // ========== Server Selection ==========
            async function loadServers() {
                try {
                    const data = await apiRequest('/api/servers', 'GET');
                    return data.servers || [];
                } catch (e) {
                    showError(e.message);
                    return [];
                }
            }

            async function renderServers() {
                const servers = await loadServers();
                const serverList = document.getElementById('servers-list');
                if (!currentState || !currentState.user) {
                    serverList.innerHTML = '<div class="empty-state"><div class="icon">🖥️</div>Загрузка...</div>';
                    return;
                }
                document.getElementById('servers-greeting').textContent = `Игрок: ${currentState.user.nickname}`;
                let html = '';
                servers.forEach(s => {
                    html += `
                        <div class="server-card" onclick="selectServer('${s.server_name}')">
                            <div>
                                <div class="fw-bold" style="font-size:16px;">${s.server_name}</div>
                                <div class="text-xs text-muted mt-8">Онлайн: ${s.online}</div>
                            </div>
                            <div class="server-online">
                                <span class="dot ${s.is_online ? '' : 'dot-offline'}"></span>
                                <span>${s.is_online ? 'Онлайн' : 'Оффлайн'}</span>
                            </div>
                        </div>
                    `;
                });
                serverList.innerHTML = html;
            }

            async function selectServer(serverName) {
                try {
                    // Отправляем действие смены сервера
                    await performAction('change_server', { server: serverName });
                    // После смены сервера загружаем состояние
                    await loadState();
                    showScreen('screen-main');
                    updateMainUI();
                    renderCases();
                } catch (e) {
                    showError(e.message);
                }
            }

            // ========== Main UI ==========
            function updateMainUI() {
                if (!currentState || !currentState.user) return;
                currentUser = currentState.user;
                document.getElementById('main-nick').textContent = currentUser.nickname;
                document.getElementById('main-server-badge').textContent = currentUser.server || 'No server';
                document.getElementById('main-balance').textContent = `💰 ${currentUser.balance.toLocaleString()}`;
            }

            function renderCases() {
                if (!currentState) return;
                const cases = currentState.cases || [];
                let html = '';
                cases.forEach(cs => {
                    const chancesStr = Object.keys(cs.chances || {}).filter(k => cs.chances[k] > 0)
                        .map(k => `${getRarityLabel(k)}: ${Math.round(cs.chances[k] * 100)}%`).join(' | ');
                    html += `
                        <div class="case-card" onclick="showCaseDetails('${cs.id}')">
                            <div class="case-icon">${cs.icon}</div>
                            <div class="fw-bold">${cs.name}</div>
                            <div class="price mt-8">${cs.price} монет</div>
                            <div class="text-xs text-muted mt-8">${chancesStr}</div>
                        </div>
                    `;
                });
                document.getElementById('main-content').innerHTML = `
                    <h3 class="mb-8">🎁 Кейсы</h3>
                    <div class="case-grid">${html}</div>
                `;
            }

            function showCaseDetails(caseId) {
                const cs = (currentState.cases || []).find(c => c.id === caseId);
                if (!cs) return;
                const itemsList = Object.keys(cs.chances || {}).filter(k => cs.chances[k] > 0)
                    .map(r => `<div class="text-sm ${r}">${getRarityLabel(r)}: ${Math.round(cs.chances[r]*100)}%</div>`).join('');
                openModal(`
                    <h3>${cs.icon} ${cs.name}</h3>
                    <p class="text-center price-tag">${cs.price} монет</p>
                    <div class="mt-8 text-sm">${itemsList}</div>
                    <button class="btn mt-16" onclick="openCaseById('${cs.id}')">🔓 Открыть за ${cs.price}</button>
                    <button class="btn btn-secondary mt-8" onclick="closeModal()">Закрыть</button>
                `);
            }

            function openCaseById(caseId) {
                const cs = (currentState.cases || []).find(c => c.id === caseId);
                if (!cs) return;
                closeModal();
                openCase(cs);
            }

            async function openCase(caseData) {
                if (!currentState || !currentState.user) return;
                if (currentState.user.balance < caseData.price) {
                    showError(`Недостаточно средств. Нужно ${caseData.price} монет.`);
                    return;
                }
                caseOpeningInProgress = true;
                try {
                    // Показываем анимацию
                    const caseIcon = caseData.icon || '📦';
                    openModal(`
                        <div class="case-animation-container">
                            <div class="case-box" style="font-size:80px;">${caseIcon}</div>
                            <p class="text-center text-muted mt-8">Открываем...</p>
                        </div>
                    `);
                    // Ждём немного для анимации
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    // Отправляем действие на сервер
                    const result = await performAction('open_case', { case_id: caseData.id });
                    // result.item содержит выпавший предмет
                    const item = result.item;
                    if (item) {
                        // Показываем выпавший предмет
                        openModal(`
                            <h3>🎉 Выпал предмет!</h3>
                            <div class="text-center mt-8">
                                <div style="font-size:60px;">${item.icon}</div>
                                <p class="fw-bold mt-8 ${item.rarity}">${item.name}</p>
                                <span class="badge badge-${item.rarity} mt-8">${getRarityLabel(item.rarity)}</span>
                            </div>
                            <button class="btn mt-16" onclick="closeModal()">Забрать</button>
                        `);
                    } else {
                        showError('Не удалось получить предмет');
                    }
                } catch (e) {
                    closeModal();
                    showError(e.message);
                } finally {
                    caseOpeningInProgress = false;
                    updateMainUI();
                    renderCases();
                }
            }

            // ========== Inventory ==========
            function renderInventory() {
                if (!currentState) return;
                const inv = currentState.user.inventory || [];
                let filtered = inv;
                const searchTerm = document.getElementById('inv-search')?.value?.toLowerCase() || '';
                if (searchTerm) {
                    filtered = filtered.filter(item => {
                        const info = getItemInfo(item.item_id);
                        return info.name.toLowerCase().includes(searchTerm);
                    });
                }
                // Применяем фильтры по редкости, если есть чекбоксы
                const activeFilters = [];
                document.querySelectorAll('.inv-filter-checkbox:checked').forEach(cb => activeFilters.push(cb.value));
                if (activeFilters.length > 0) {
                    filtered = filtered.filter(item => activeFilters.includes(item.rarity));
                }
                let itemsHtml = '';
                if (filtered.length === 0) {
                    itemsHtml = '<div class="empty-state"><div class="icon">🎒</div>Нет предметов</div>';
                } else {
                    filtered.forEach(invItem => {
                        const info = getItemInfo(invItem.item_id);
                        const sellPrice = getSellPrice(invItem.rarity);
                        itemsHtml += `
                            <div class="item-row">
                                <div class="item-icon">${info.icon}</div>
                                <div style="flex:1;">
                                    <div class="fw-bold text-sm ${invItem.rarity}">${info.name}</div>
                                    <span class="badge badge-${invItem.rarity}">${getRarityLabel(invItem.rarity)}</span>
                                    <div class="text-xs text-muted mt-8">UID: ${invItem.uid}</div>
                                </div>
                                <div class="flex-col gap-6">
                                    <button class="btn btn-sm btn-success" onclick="sellInvItem(${invItem.uid})">💰 ${sellPrice}</button>
                                    <button class="btn btn-sm btn-secondary" onclick="listInvItem(${invItem.uid})">📦 Рынок</button>
                                </div>
                            </div>
                        `;
                    });
                }
                document.getElementById('main-content').innerHTML = `
                    <h3 class="mb-8">🎒 Инвентарь</h3>
                    <div class="flex-row gap-8 mb-8">
                        <input type="text" id="inv-search" placeholder="Поиск..." oninput="renderInventory()" style="flex:1;">
                        <button class="btn btn-sm btn-secondary" onclick="toggleFilters()">🔍 Фильтры</button>
                    </div>
                    <div class="filter-section" id="inv-filters">
                        <div class="flex-row gap-6 mb-8">
                            <label class="text-sm"><input type="checkbox" class="inv-filter-checkbox" value="common"> Обычные</label>
                            <label class="text-sm"><input type="checkbox" class="inv-filter-checkbox" value="rare"> Редкие</label>
                            <label class="text-sm"><input type="checkbox" class="inv-filter-checkbox" value="epic"> Эпические</label>
                            <label class="text-sm"><input type="checkbox" class="inv-filter-checkbox" value="legendary"> Легендарные</label>
                            <label class="text-sm"><input type="checkbox" class="inv-filter-checkbox" value="mythic"> Мифические</label>
                        </div>
                    </div>
                    <div class="flex-row gap-8 mb-8">
                        <button class="btn btn-sm btn-secondary" onclick="showCrafts()">🔧 Крафты</button>
                    </div>
                    <div class="scroll-y" style="max-height:50vh;">${itemsHtml}</div>
                `;
                // Восстанавливаем состояние фильтров
                const filtersEl = document.getElementById('inv-filters');
                if (filtersEl && window._filterState) {
                    filtersEl.classList.add('active');
                }
            }

            function toggleFilters() {
                const el = document.getElementById('inv-filters');
                if (el) {
                    el.classList.toggle('active');
                    window._filterState = el.classList.contains('active');
                }
            }

            async function sellInvItem(uid) {
                if (!currentUser) return;
                const invItem = currentUser.inventory.find(i => i.uid === uid);
                if (!invItem) return;
                const info = getItemInfo(invItem.item_id);
                const sellPrice = getSellPrice(invItem.rarity);
                openModal(`
                    <h3>💰 Продажа</h3>
                    <p class="text-center mt-8">Продать <span class="fw-bold ${invItem.rarity}">${info.name}</span> за ${sellPrice} монет?</p>
                    <button class="btn btn-success mt-16" onclick="confirmSell(${uid})">Продать</button>
                    <button class="btn btn-secondary mt-8" onclick="closeModal()">Отмена</button>
                `);
            }

            async function confirmSell(uid) {
                closeModal();
                try {
                    await performAction('sell_item', { uid });
                    await loadState();
                    updateMainUI();
                    renderInventory();
                } catch (e) {
                    showError(e.message);
                }
            }

            function listInvItem(uid) {
                if (!currentUser) return;
                const invItem = currentUser.inventory.find(i => i.uid === uid);
                if (!invItem) return;
                const info = getItemInfo(invItem.item_id);
                const suggestedPrice = Math.floor(estimateItemPrice(invItem.rarity) * 1.5);
                openModal(`
                    <h3>📦 Выставить на рынок</h3>
                    <p class="text-center mt-8">${info.icon} <span class="fw-bold ${invItem.rarity}">${info.name}</span></p>
                    <input type="number" id="market-price" class="mt-8" placeholder="Цена" min="1" value="${suggestedPrice}">
                    <button class="btn mt-16" onclick="confirmList(${uid})">Выставить</button>
                    <button class="btn btn-secondary mt-8" onclick="closeModal()">Отмена</button>
                `);
            }

            async function confirmList(uid) {
                const priceInput = document.getElementById('market-price');
                const price = parseInt(priceInput?.value || '0');
                if (price < 1) return;
                closeModal();
                try {
                    await performAction('list_market', { uid, price });
                    await loadState();
                    updateMainUI();
                    renderInventory();
                    renderMarket();
                } catch (e) {
                    showError(e.message);
                }
            }

            // ========== Crafts ==========
            const CRAFT_RECIPES = [
                { id: 'craft_rare', name: 'Крафт: Редкий предмет', resultRarity: 'rare', cost: { common: 5 }, description: '5 обычных → 1 редкий' },
                { id: 'craft_legendary', name: 'Крафт: Легендарный предмет', resultRarity: 'legendary', cost: { epic: 3 }, description: '3 эпических → 1 легендарный' },
                { id: 'craft_mythic', name: 'Крафт: Мифический предмет', resultRarity: 'mythic', cost: { legendary: 3 }, description: '3 легендарных → 1 мифический' }
            ];

            function checkCraftAvailability(recipe) {
                if (!currentUser) return false;
                for (const key of Object.keys(recipe.cost)) {
                    const count = currentUser.inventory.filter(i => i.rarity === key).length;
                    if (count < recipe.cost[key]) return false;
                }
                return true;
            }

            function showCrafts() {
                const recipesHtml = CRAFT_RECIPES.map(r => {
                    const canCraft = checkCraftAvailability(r);
                    return `
                        <div class="item-row" style="cursor:${canCraft ? 'pointer' : 'default'}; opacity:${canCraft ? '1' : '0.5'};">
                            <div style="flex:1;">
                                <div class="fw-bold text-sm">${r.name}</div>
                                <div class="text-xs text-muted">${r.description}</div>
                            </div>
                            <button class="btn btn-sm ${canCraft ? 'btn-success' : 'btn-secondary'}" ${canCraft ? '' : 'disabled'} onclick="craftItem('${r.id}')">Крафт</button>
                        </div>
                    `;
                }).join('');
                openModal(`
                    <h3>🔧 Крафты</h3>
                    <div class="mt-8">${recipesHtml}</div>
                    <button class="btn btn-secondary mt-16" onclick="closeModal()">Закрыть</button>
                `);
            }

            async function craftItem(recipeId) {
                const recipe = CRAFT_RECIPES.find(r => r.id === recipeId);
                if (!recipe) return;
                if (!checkCraftAvailability(recipe)) {
                    showError('Недостаточно предметов для крафта');
                    return;
                }
                try {
                    const result = await performAction('craft', { recipe_id: recipeId });
                    await loadState();
                    updateMainUI();
                    renderInventory();
                    closeModal();
                    // result может содержать информацию о созданном предмете
                    if (result.item) {
                        openModal(`
                            <h3>🔧 Крафт успешен!</h3>
                            <div class="text-center mt-8">
                                <div style="font-size:60px;">${result.item.icon}</div>
                                <p class="fw-bold mt-8 ${result.item.rarity}">${result.item.name}</p>
                                <span class="badge badge-${result.item.rarity} mt-8">${getRarityLabel(result.item.rarity)}</span>
                            </div>
                            <button class="btn mt-16" onclick="closeModal()">Забрать</button>
                        `);
                    } else {
                        showError('Крафт выполнен, но предмет не получен');
                    }
                } catch (e) {
                    showError(e.message);
                }
            }

            // ========== Market ==========
            function renderMarket() {
                if (!currentState) return;
                const listings = currentState.market || [];
                let html = '';
                if (listings.length === 0) {
                    html = '<div class="empty-state"><div class="icon">📦</div>Рынок пуст</div>';
                } else {
                    listings.forEach(l => {
                        const info = getItemInfo(l.item_id);
                        const isOwn = l.seller_id === currentUser.id;
                        html += `
                            <div class="market-row">
                                <div class="item-icon">${info.icon}</div>
                                <div style="flex:1;">
                                    <div class="fw-bold text-sm ${l.rarity}">${info.name}</div>
                                    <span class="badge badge-${l.rarity}">${getRarityLabel(l.rarity)}</span>
                                    <div class="text-xs text-muted mt-8">Продавец: ${l.seller_nick}</div>
                                </div>
                                <div class="flex-col gap-6">
                                    <span class="price-tag">${l.price}💰</span>
                                    ${isOwn
                                        ? `<button class="btn btn-xs btn-secondary" onclick="cancelListing(${l.uid})">Снять</button>`
                                        : `<button class="btn btn-xs btn-success" onclick="buyFromMarket(${l.uid})">Купить</button>`
                                    }
                                </div>
                            </div>
                        `;
                    });
                }
                document.getElementById('main-content').innerHTML = `
                    <h3 class="mb-8">📦 Рынок</h3>
                    <div class="scroll-y" style="max-height:55vh;">${html}</div>
                `;
            }

            async function buyFromMarket(listingUid) {
                try {
                    await performAction('buy_market', { listing_uid: listingUid });
                    await loadState();
                    updateMainUI();
                    renderMarket();
                    renderInventory();
                } catch (e) {
                    showError(e.message);
                }
            }

            async function cancelListing(listingUid) {
                try {
                    await performAction('cancel_listing', { listing_uid: listingUid });
                    await loadState();
                    updateMainUI();
                    renderMarket();
                    renderInventory();
                } catch (e) {
                    showError(e.message);
                }
            }

            // ========== Chat ==========
            function renderChat() {
                if (!currentState) return;
                const messages = currentState.chat || [];
                let msgsHtml = '';
                if (messages.length === 0) {
                    msgsHtml = '<div class="empty-state"><div class="icon">💬</div>Нет сообщений</div>';
                } else {
                    messages.forEach(m => {
                        const isOwn = m.sender_nick === currentUser.nickname;
                        msgsHtml += `
                            <div class="chat-message ${isOwn ? 'own' : 'other'}">
                                <div class="sender">${m.sender_nick}</div>
                                <div>${m.text}</div>
                                <div class="time">${new Date(m.timestamp * 1000).toLocaleTimeString()}</div>
                            </div>
                        `;
                    });
                }
                document.getElementById('main-content').innerHTML = `
                    <h3 class="mb-8">💬 Чат</h3>
                    <div class="scroll-y" id="chat-messages" style="max-height:40vh;">${msgsHtml}</div>
                    <div class="flex-row gap-6 mt-8">
                        <input type="text" id="chat-input" placeholder="Сообщение..." style="flex:1;">
                        <button class="btn btn-sm" onclick="sendChatFromInput()">📨</button>
                    </div>
                `;
                const chatDiv = document.getElementById('chat-messages');
                if (chatDiv) chatDiv.scrollTop = chatDiv.scrollHeight;
            }

            async function sendChatFromInput() {
                const input = document.getElementById('chat-input');
                if (!input || !input.value.trim()) return;
                const text = input.value.trim();
                try {
                    await performAction('send_chat', { text, is_private: false });
                    await loadState();
                    renderChat();
                } catch (e) {
                    showError(e.message);
                }
                input.value = '';
            }

            // ========== Settings ==========
            function renderSettings() {
                if (!currentState) return;
                const user = currentState.user;
                const stats = user.stats || {};
                const warnings = user.warnings || [];
                const warningsHtml = warnings.length > 0
                    ? `<div class="glass mt-8" style="padding:10px;border-left:3px solid var(--orange);">
                        <div class="fw-bold text-sm">⚠️ Предупреждения:</div>
                        ${warnings.map(w => `<div class="text-xs text-muted">${w.reason || 'Нет причины'}</div>`).join('')}
                       </div>`
                    : '';
                document.getElementById('main-content').innerHTML = `
                    <h3 class="mb-8">⚙️ Настройки</h3>
                    <div class="glass" style="padding:14px;">
                        <div class="stat-row"><span class="text-muted">Ник:</span><span class="fw-bold">${user.nickname}</span></div>
                        <div class="stat-row"><span class="text-muted">Баланс:</span><span class="price-tag">${user.balance} монет</span></div>
                        <div class="stat-row"><span class="text-muted">Сервер:</span><span>${user.server}</span></div>
                    </div>
                    ${warningsHtml}
                    <div class="glass mt-8" style="padding:14px;">
                        <div class="stat-row"><span>🔊 Звук</span><div class="toggle-switch ${user.sound_enabled ? 'active' : ''}" onclick="toggleSound()"></div></div>
                        <div class="stat-row"><span>🔔 Уведомления</span><div class="toggle-switch ${user.notifications_enabled ? 'active' : ''}" onclick="toggleNotifications()"></div></div>
                    </div>
                    <div class="glass mt-8" style="padding:14px;">
                        <div class="fw-bold mb-8">📊 Статистика</div>
                        <div class="stat-row"><span class="text-muted">Открыто кейсов:</span><span>${stats.openedCases || 0}</span></div>
                        <div class="stat-row"><span class="text-muted">Получено предметов:</span><span>${stats.itemsObtained || 0}</span></div>
                        <div class="stat-row"><span class="text-muted">Потрачено:</span><span>${stats.spent || 0} монет</span></div>
                        <div class="stat-row"><span class="text-muted">Заработано:</span><span>${stats.earned || 0} монет</span></div>
                    </div>
                    <div class="glass mt-8" style="padding:14px;">
                        <div class="fw-bold mb-8">🎫 Поддержка</div>
                        <button class="btn btn-sm btn-secondary" onclick="showSupportForm()">Создать тикет</button>
                    </div>
                    <div class="flex-col gap-8 mt-8">
                        <button class="btn btn-secondary" onclick="showDonateModal()">💎 Пополнить баланс</button>
                        <button class="btn btn-danger" onclick="exitServer()">🚪 Выйти из сервера</button>
                    </div>
                `;
            }

            async function toggleSound() {
                if (!currentUser) return;
                const newValue = !currentUser.sound_enabled;
                try {
                    await performAction('update_settings', { sound_enabled: newValue });
                    await loadState();
                    renderSettings();
                } catch (e) {
                    showError(e.message);
                }
            }

            async function toggleNotifications() {
                if (!currentUser) return;
                const newValue = !currentUser.notifications_enabled;
                try {
                    await performAction('update_settings', { notifications_enabled: newValue });
                    await loadState();
                    renderSettings();
                } catch (e) {
                    showError(e.message);
                }
            }

            function showSupportForm() {
                openModal(`
                    <h3>🎫 Поддержка</h3>
                    <input type="text" id="ticket-subject" class="mt-8" placeholder="Тема">
                    <textarea id="ticket-message" class="mt-8" placeholder="Опишите проблему..." rows="4"></textarea>
                    <button class="btn mt-16" onclick="submitTicket()">Отправить</button>
                    <button class="btn btn-secondary mt-8" onclick="closeModal()">Отмена</button>
                `);
            }

            async function submitTicket() {
                const subject = document.getElementById('ticket-subject')?.value.trim() || 'Без темы';
                const message = document.getElementById('ticket-message')?.value.trim() || 'Без описания';
                try {
                    await performAction('create_ticket', { subject, message });
                    closeModal();
                    openModal(`<h3>✅ Тикет отправлен</h3><p class="text-center text-muted">Спасибо за обращение!</p><button class="btn mt-8" onclick="closeModal()">ОК</button>`);
                } catch (e) {
                    showError(e.message);
                }
            }

            // ========== Donate (заглушка) ==========
            function showDonateModal() {
                openModal(`
                    <h3>💎 Пополнение баланса</h3>
                    <p class="text-xs text-muted text-center mt-8">Оплата через звёзды Telegram</p>
                    <div class="mt-8">
                        <div class="item-row">
                            <div style="flex:1;"><div class="fw-bold">10 ⭐ = 500 монет</div></div>
                            <button class="btn btn-xs btn-secondary">Купить</button>
                        </div>
                        <div class="item-row">
                            <div style="flex:1;"><div class="fw-bold">50 ⭐ = 3000 монет</div></div>
                            <button class="btn btn-xs btn-secondary">Купить</button>
                        </div>
                        <div class="item-row">
                            <div style="flex:1;"><div class="fw-bold">100 ⭐ = 10000 монет</div></div>
                            <button class="btn btn-xs btn-secondary">Купить</button>
                        </div>
                    </div>
                    <button class="btn btn-secondary mt-16" onclick="closeModal()">Закрыть</button>
                `);
            }

            // ========== Server Exit ==========
            async function exitServer() {
                // Просто возвращаемся к выбору сервера, сервер не меняем
                showScreen('screen-servers');
                await loadServers();
                renderServers();
            }

            // ========== Navigation ==========
            function renderMainTab(tab) {
                currentTab = tab;
                switch (tab) {
                    case 'cases': renderCases(); break;
                    case 'inventory': renderInventory(); break;
                    case 'market': renderMarket(); break;
                    case 'chat': renderChat(); break;
                    case 'settings': renderSettings(); break;
                }
            }

            document.getElementById('main-tabs').addEventListener('click', function(e) {
                const btn = e.target.closest('.tab-btn');
                if (!btn) return;
                const tab = btn.dataset.tab;
                if (!tab) return;
                document.querySelectorAll('#main-tabs .tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderMainTab(tab);
            });

            document.getElementById('modal-overlay').addEventListener('click', function(e) {
                if (e.target === this && !caseOpeningInProgress) closeModal();
            });

            document.getElementById('btn-logout').addEventListener('click', function() {
                // Логаут не предусмотрен API, просто обновляем страницу
                location.reload();
            });

            document.getElementById('main-balance').addEventListener('click', function() {
                showDonateModal();
            });

            // Глобальные функции для вызова из HTML onclick
            window.selectServer = selectServer;
            window.showCaseDetails = showCaseDetails;
            window.openCaseById = openCaseById;
            window.sellInvItem = sellInvItem;
            window.confirmSell = confirmSell;
            window.listInvItem = listInvItem;
            window.confirmList = confirmList;
            window.showCrafts = showCrafts;
            window.craftItem = craftItem;
            window.toggleFilters = toggleFilters;
            window.buyFromMarket = buyFromMarket;
            window.cancelListing = cancelListing;
            window.sendChatFromInput = sendChatFromInput;
            window.toggleSound = toggleSound;
            window.toggleNotifications = toggleNotifications;
            window.showSupportForm = showSupportForm;
            window.submitTicket = submitTicket;
            window.showDonateModal = showDonateModal;
            window.closeModal = closeModal;
            window.exitServer = exitServer;

            // ========== Initialization ==========
            async function init() {
                try {
                    // Регистрируем пользователя (создаст, если не существует)
                    await registerUser();
                    // Загружаем полное состояние
                    await loadState();
                    // Показываем экран выбора сервера
                    showScreen('screen-servers');
                    await renderServers();
                } catch (e) {
                    console.error('Init error:', e);
                    document.body.innerHTML = `
                        <div style="display:flex;justify-content:center;align-items:center;height:100vh;color:white;flex-direction:column;gap:12px;">
                            <h2>Ошибка подключения к серверу</h2>
                            <p>${e.message}</p>
                            <button onclick="location.reload()" style="padding:10px 20px;background:#7c3aed;color:white;border:none;border-radius:8px;cursor:pointer;">Повторить</button>
                        </div>
                    `;
                }
            }

            init();
        })();
    </script>
</body>
</html>
