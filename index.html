            function craftItem(recipeId) {
                if (!currentUser || !currentServer) return;
                const recipe = CRAFT_RECIPES.find(r => r.id === recipeId);
                if (!recipe) return;
                const costKeys = Object.keys(recipe.cost);
                let canCraft = true;
                for (const key of costKeys) {
                    const count = currentUser.inventory.filter(i => i.rarity === key).length;
                    if (count < recipe.cost[key]) { canCraft = false; break; }
                }
                if (!canCraft) {
                    openModal(
                        `<h3>🔧 Недостаточно предметов</h3><p class="text-center text-muted">${recipe.description}</p><button class="btn mt-8" onclick="closeModal()">ОК</button>`
                        );
                    return;
                }
                for (const key of costKeys) {
                    let toRemove = recipe.cost[key];
                    const items = currentUser.inventory.filter(i => i.rarity === key);
                    for (const it of items) {
                        if (toRemove <= 0) break;
                        removeFromInventory(currentUser, it.uid);
                        toRemove--;
                    }
                }
                const resultItem = getRandomItemByRarity(recipe.resultRarity);
                if (resultItem) {
                    addToInventory(currentUser, resultItem);
                    currentUser.stats.itemsObtained++;
                }
                saveData();
                sendToBot({ type: 'craft', server: currentServer.name, nick: currentUser.nick, recipe: recipeId, result: resultItem
                        ? resultItem.name : 'None' });
                updateMainUI();
                renderInventory();
                openModal(
                    `<h3>🔧 Крафт успешен!</h3><div class="text-center mt-8"><div style="font-size:60px;">${resultItem?resultItem.icon:'❓'}</div><p class="fw-bold mt-8 ${resultItem?resultItem.rarity:''}">${resultItem?resultItem.name:'Неизвестно'}</p><span class="badge badge-${resultItem?resultItem.rarity:'common'} mt-8">${RARITY_LABELS[resultItem?resultItem.rarity:'common']}</span></div><button class="btn mt-16" onclick="closeModal()">Забрать</button>`
                    );
            }

            function openCase(caseData) {
                if (!currentUser || !currentServer) return;
                if (currentUser.balance < caseData.price) {
                    openModal(
                        `<h3>💰 Недостаточно средств</h3><p class="text-center">Нужно ${caseData.price} монет, у вас ${currentUser.balance}</p><button class="btn mt-8" onclick="closeModal()">ОК</button>`
                        );
                    return;
                }
                currentUser.balance -= caseData.price;
                currentUser.stats.spent += caseData.price;
                currentUser.stats.openedCases++;
                saveData();
                const item = rollCaseItem(caseData);
                if (item) {
                    addToInventory(currentUser, item);
                    currentUser.stats.itemsObtained++;
                    saveData();
                    sendToBot({ type: 'case_open', server: currentServer.name, nick: currentUser.nick, case: caseData.name,
                        item: item.name, rarity: item.rarity });
                    pendingCaseOpen = { caseData, item };
                    caseOpeningInProgress = true;
                    showCaseAnimation(caseData, item);
                } else {
                    saveData();
                    updateMainUI();
                    renderCases();
                }
            }

            function showCaseAnimation(caseData, item) {
                const html = `
              <div class="case-animation-container" id="case-anim">
                <div class="case-box" id="case-box-anim">${caseData.icon}</div>
                <div class="reveal-item" id="reveal-item-anim">${item.icon}</div>
              </div>
              <p class="text-center text-muted" id="case-anim-text">Открываем...</p>
            `;
                openModal(html);
                const caseBox = document.getElementById('case-box-anim');
                const revealItem = document.getElementById('reveal-item-anim');
                const animText = document.getElementById('case-anim-text');
                setTimeout(() => {
                    caseBox.style.display = 'none';
                    revealItem.style.display = 'block';
                    animText.innerHTML =
                        `<span class="fw-bold ${item.rarity}">${item.name}</span><br><span class="badge badge-${item.rarity} mt-8">${RARITY_LABELS[item.rarity]}</span>`;
                    caseOpeningInProgress = false;
                    updateMainUI();
                    renderCases();
                }, 1200);
            }

            function renderServers() {
                if (!currentUser) return;
                serversGreeting.textContent = `Игрок: ${currentUser.nick}`;
                let html = '';
                SERVER_NAMES.forEach(name => {
                    const server = getServer(name);
                    if (!server) return;
                    const isOnline = server.isOnline !== false;
                    html += `
                <div class="server-card" onclick="selectServer('${name}')">
                  <div>
                    <div class="fw-bold" style="font-size:16px;">${name}</div>
                    <div class="text-xs text-muted mt-8">Пароль админа: ${SERVER_PASSWORDS[name]}</div>
                  </div>
                  <div class="server-online">
                    <span class="dot ${isOnline?'':'dot-offline'}"></span>
                    <span>${isOnline?server.online:'Откл.'}</span>
                  </div>
                </div>
              `;
                });
                serversList.innerHTML = html;
            }

            function selectServer(name) {
                const server = getServer(name);
                if (!server) return;
                if (server.isOnline === false) {
                    openModal(
                        `<h3>🚫 Сервер отключён</h3><p class="text-center text-muted">Сервер ${name} временно недоступен.</p><button class="btn mt-8" onclick="closeModal()">ОК</button>`
                        );
                    return;
                }
                const rulesHtml = `
              <h3>📋 Правила сервера ${name}</h3>
              <div class="text-sm mt-8" style="line-height:1.7;">
                <p>1. Запрещены оскорбления и токсичное поведение.</p>
                <p>2. Запрещено использование читов и эксплойтов.</p>
                <p>3. Запрещена реклама сторонних сервисов.</p>
                <p>4. Запрещён обман игроков на рынке.</p>
                <p>5. Уважайте других участников.</p>
                <p class="mt-8 text-muted">Нарушение правил ведёт к предупреждениям, муту или бану.</p>
              </div>
              <button class="btn mt-16" onclick="acceptServerRules('${name}')">✅ Принять правила</button>
              <button class="btn btn-secondary mt-8" onclick="closeModal()">Отмена</button>
            `;
                openModal(rulesHtml);
            }

            function acceptServerRules(name) {
                const server = getServer(name);
                if (!server || !currentUser) return;
                if (server.isOnline === false) {
                    closeModal();
                    openModal(
                        `<h3>🚫 Сервер отключён</h3><p class="text-center text-muted">Сервер ${name} временно недоступен.</p><button class="btn mt-8" onclick="closeModal()">ОК</button>`
                        );
                    return;
                }
                if (currentUser.isBanned) {
                    closeModal();
                    openModal(
                        `<h3>🚫 Вы забанены</h3><p class="text-center text-muted">Причина: ${currentUser.banReason||'нет'}</p><button class="btn mt-8" onclick="closeModal()">ОК</button>`
                        );
                    return;
                }
                currentServer = server;
                currentServer.name = name;
                isAdminMode = false;
                adminLevel = 0;
                const ownerCheck = isOwner();
                const adminCheck = isAdminOfServer(currentUser, name);
                if (ownerCheck) adminLevel = 5;
                else if (adminCheck > 0) adminLevel = adminCheck;
                chatTab = 'general';
                chatRecipient = null;
                closeModal();
                showScreen('screen-main');
                updateMainUI();
                renderCases();
                sendToBot({ type: 'server_join', server: name, nick: currentUser.nick });
            }

            function exitServer() {
                currentServer = null;
                isAdminMode = false;
                adminLevel = 0;
                chatTab = 'general';
                chatRecipient = null;
                showScreen('screen-servers');
                renderServers();
                sendToBot({ type: 'server_exit', nick: currentUser ? currentUser.nick : 'Unknown' });
            }

            function updateMainUI() {
                if (!currentUser || !currentServer) return;
                mainNick.textContent = currentUser.nick;
                mainServerBadge.textContent = currentServer.name;
                mainBalance.textContent = '💰 ' + currentUser.balance;
                const server = getServer(currentServer.name);
                if (server) {
                    currentServer = server;
                    currentServer.name = currentServer.name;
                }
            }

            function renderCases() {
                if (!currentUser || !currentServer) return;
                updateMainUI();
                let html = '';
                CASES_DATA.forEach(cs => {
                    const chancesStr = Object.keys(cs.chances).filter(k => cs.chances[k] > 0).map(k =>
                        `${RARITY_LABELS[k]}: ${Math.round(cs.chances[k]*100)}%`).join(' | ');
                    html += `
                <div class="case-card" onclick="showCaseDetails('${cs.id}')" style="border-color:${cs.color}44;">
                  <div class="case-icon">${cs.icon}</div>
                  <div class="fw-bold">${cs.name}</div>
                  <div class="price mt-8">${cs.price} монет</div>
                  <div class="text-xs text-muted mt-8">${chancesStr}</div>
                </div>
              `;
                });
                mainContent.innerHTML = `
              <h3 class="mb-8">🎁 Кейсы</h3>
              <div class="case-grid">${html}</div>
            `;
            }

            function showCaseDetails(caseId) {
                const cs = CASES_DATA.find(c => c.id === caseId);
                if (!cs) return;
                const itemsList = Object.keys(cs.chances).filter(k => cs.chances[k] > 0).map(r => {
                    return `<div class="text-sm ${r}">${RARITY_LABELS[r]}: ${Math.round(cs.chances[r]*100)}%</div>`;
                }).join('');
                openModal(`
              <h3>${cs.icon} ${cs.name}</h3>
              <p class="text-center price-tag">${cs.price} монет</p>
              <div class="mt-8 text-sm">${itemsList}</div>
              <p class="text-xs text-muted mt-8 text-center">Возможные предметы соответствующих редкостей</p>
              <button class="btn mt-16" onclick="openCaseById('${cs.id}')">🔓 Открыть за ${cs.price}</button>
              <button class="btn btn-secondary mt-8" onclick="closeModal()">Закрыть</button>
            `);
            }

            function openCaseById(caseId) {
                const cs = CASES_DATA.find(c => c.id === caseId);
                if (!cs) return;
                closeModal();
                openCase(cs);
            }

            function renderInventory() {
                if (!currentUser || !currentServer) return;
                updateMainUI();
                const inv = getInventoryItems(currentUser);
                const searchTerm = (document.getElementById('inv-search')?.value || '').toLowerCase();
                const activeFilters = [];
                document.querySelectorAll('.inv-filter-checkbox:checked').forEach(cb => activeFilters.push(cb.value));
                let filtered = inv;
                if (searchTerm) {
                    filtered = filtered.filter(item => {
                        const info = getItemInfoByInvItem(item);
                        return info.name.toLowerCase().includes(searchTerm);
                    });
                }
                if (activeFilters.length > 0) {
                    filtered = filtered.filter(item => activeFilters.includes(item.rarity));
                }
                let itemsHtml = '';
                if (filtered.length === 0) {
                    itemsHtml = `<div class="empty-state"><div class="icon">🎒</div>Нет предметов</div>`;
                } else {
                    filtered.forEach(invItem => {
                        const info = getItemInfoByInvItem(invItem);
                        const sellPrice = Math.floor(estimateItemPrice(info) * (currentServer.settings
                            .sellMultiplier || 0.5));
                        itemsHtml += `
                  <div class="item-row">
                    <div class="item-icon">${info.icon}</div>
                    <div style="flex:1;">
                      <div class="fw-bold text-sm ${info.rarity}">${info.name}</div>
                      <span class="badge badge-${info.rarity}">${RARITY_LABELS[info.rarity]}</span>
                      <div class="text-xs text-muted mt-8">${new Date(invItem.obtainedAt).toLocaleDateString()}</div>
                    </div>
                    <div class="flex-col gap-6">
                      <button class="btn btn-sm btn-success" onclick="sellInvItem(${invItem.uid})">💰 ${sellPrice}</button>
                      <button class="btn btn-sm btn-secondary" onclick="listInvItem(${invItem.uid})">📦 Рынок</button>
                    </div>
                  </div>
                `;
                    });
                }
                const filtersHtml = `
              <div class="flex-row gap-6 mb-8">
                <label class="text-sm"><input type="checkbox" class="inv-filter-checkbox" value="common"> Обычные</label>
                <label class="text-sm"><input type="checkbox" class="inv-filter-checkbox" value="rare"> Редкие</label>
                <label class="text-sm"><input type="checkbox" class="inv-filter-checkbox" value="epic"> Эпические</label>
                <label class="text-sm"><input type="checkbox" class="inv-filter-checkbox" value="legendary"> Легендарные</label>
                <label class="text-sm"><input type="checkbox" class="inv-filter-checkbox" value="mythic"> Мифические</label>
              </div>
            `;
                mainContent.innerHTML = `
              <h3 class="mb-8">🎒 Инвентарь</h3>
              <div class="flex-row gap-8 mb-8">
                <input type="text" id="inv-search" placeholder="Поиск..." oninput="renderInventory()" style="flex:1;">
                <button class="btn btn-sm btn-secondary" onclick="toggleFilters()">🔍 Фильтры</button>
              </div>
              <div class="filter-section" id="inv-filters">${filtersHtml}</div>
              <div class="flex-row gap-8 mb-8">
                <button class="btn btn-sm btn-secondary" onclick="showCrafts()">🔧 Крафты</button>
              </div>
              <div class="scroll-y" style="max-height:50vh;">${itemsHtml}</div>
            `;
                const savedFilterState = window._filterState || false;
                if (savedFilterState) {
                    document.getElementById('inv-filters').classList.add('active');
                }
            }

            function toggleFilters() {
                const el = document.getElementById('inv-filters');
                if (el) {
                    el.classList.toggle('active');
                    window._filterState = el.classList.contains('active');
                }
            }

            function sellInvItem(uid) {
                if (!currentUser) return;
                const invItem = currentUser.inventory.find(i => i.uid === uid);
                if (!invItem) return;
                const info = getItemInfoByInvItem(invItem);
                const sellPrice = Math.floor(estimateItemPrice(info) * (currentServer.settings.sellMultiplier || 0.5));
                openModal(`
              <h3>💰 Продажа</h3>
              <p class="text-center mt-8">Продать <span class="fw-bold ${info.rarity}">${info.name}</span> за ${sellPrice} монет?</p>
              <button class="btn btn-success mt-16" onclick="confirmSell(${uid})">Продать</button>
              <button class="btn btn-secondary mt-8" onclick="closeModal()">Отмена</button>
            `);
            }

            function confirmSell(uid) {
                closeModal();
                sellItemFromInventory(uid);
            }

            function listInvItem(uid) {
                if (!currentUser) return;
                const invItem = currentUser.inventory.find(i => i.uid === uid);
                if (!invItem) return;
                const info = getItemInfoByInvItem(invItem);
                openModal(`
              <h3>📦 Выставить на рынок</h3>
              <p class="text-center mt-8">${info.icon} <span class="fw-bold ${info.rarity}">${info.name}</span></p>
              <input type="number" id="market-price" class="mt-8" placeholder="Цена" min="1" value="${Math.floor(estimateItemPrice(info)*1.5)}">
              <button class="btn mt-16" onclick="confirmList(${uid})">Выставить</button>
              <button class="btn btn-secondary mt-8" onclick="closeModal()">Отмена</button>
            `);
            }

            function confirmList(uid) {
                const priceInput = document.getElementById('market-price');
                const price = parseInt(priceInput?.value || '0');
                if (price < 1) return;
                closeModal();
                listItemOnMarket(uid, price);
            }

            function showCrafts() {
                const recipesHtml = CRAFT_RECIPES.map(r => {
                    const canCraft = checkCraftAvailability(r);
                    return `
                <div class="item-row" style="cursor:${canCraft?'pointer':'default'};opacity:${canCraft?'1':'0.5'};">
                  <div style="flex:1;">
                    <div class="fw-bold text-sm">${r.name}</div>
                    <div class="text-xs text-muted">${r.description}</div>
                  </div>
                  <button class="btn btn-sm ${canCraft?'btn-success':'btn-secondary'}" ${canCraft?'':'disabled'} onclick="craftItem('${r.id}')">Крафт</button>
                </div>
              `;
                }).join('');
                openModal(`
              <h3>🔧 Крафты</h3>
              <div class="mt-8">${recipesHtml}</div>
              <button class="btn btn-secondary mt-16" onclick="closeModal()">Закрыть</button>
            `);
            }

            function checkCraftAvailability(recipe) {
                if (!currentUser) return false;
                for (const key of Object.keys(recipe.cost)) {
                    const count = currentUser.inventory.filter(i => i.rarity === key).length;
                    if (count < recipe.cost[key]) return false;
                }
                return true;
            }

            function renderMarket() {
                if (!currentUser || !currentServer) return;
                updateMainUI();
                const listings = currentServer.market || [];
                let html = '';
                if (listings.length === 0) {
                    html = `<div class="empty-state"><div class="icon">📦</div>Рынок пуст</div>`;
                } else {
                    listings.forEach(l => {
                        const info = getItemById(l.itemId);
                        const isOwn = l.sellerId === currentUser.id;
                        html += `
                  <div class="market-row">
                    <div class="item-icon">${info?info.icon:'❓'}</div>
                    <div style="flex:1;">
                      <div class="fw-bold text-sm ${info?info.rarity:'common'}">${info?info.name:'Неизвестно'}</div>
                      <span class="badge badge-${info?info.rarity:'common'}">${RARITY_LABELS[info?info.rarity:'common']}</span>
                      <div class="text-xs text-muted mt-8">Продавец: ${l.sellerNick}</div>
                    </div>
                    <div class="flex-col gap-6">
                      <span class="price-tag">${l.price}💰</span>
                      ${isOwn?
                        `<button class="btn btn-xs btn-secondary" onclick="removeMarketListing(${l.uid})">Снять</button>`:
                        `<button class="btn btn-xs btn-success" onclick="buyFromMarket(${l.uid})">Купить</button>`
                      }
                    </div>
                  </div>
                `;
                    });
                }
                mainContent.innerHTML = `
              <h3 class="mb-8">📦 Рынок</h3>
              <p class="text-xs text-muted mb-8">Общий рынок сервера ${currentServer.name}</p>
              <div class="scroll-y" style="max-height:55vh;">${html}</div>
            `;
            }

            function renderChat() {
                if (!currentUser || !currentServer) return;
                updateMainUI();
                const isPrivate = chatTab === 'private';
                const recipient = chatRecipient;
                let messages = [];
                if (isPrivate && recipient) {
                    messages = getServerChat(currentServer, true, recipient.id);
                } else {
                    messages = getServerChat(currentServer, false, null);
                }
                let msgsHtml = '';
                if (messages.length === 0) {
                    msgsHtml = `<div class="empty-state"><div class="icon">💬</div>Нет сообщений</div>`;
                } else {
                    messages.forEach(m => {
                        const isOwn = m.senderId === currentUser.id;
                        msgsHtml += `
                  <div class="chat-message ${isOwn?'own':'other'}">
                    <div class="sender">${m.senderNick}</div>
                    <div>${m.text}</div>
                    <div class="time">${new Date(m.timestamp).toLocaleTimeString()}</div>
                  </div>
                `;
                    });
                }
                const usersList = appData.users.filter(u => u.id !== currentUser.id && !u.isBanned).map(u =>
                    `<option value="${u.id}">${u.nick}</option>`).join('');
                const chatHeader = isPrivate ?
                    `<div class="flex-row gap-8 mb-8">
                <button class="btn btn-xs btn-secondary" onclick="switchChatTab('general')">← Общий</button>
                <span class="fw-bold text-sm">ЛС: ${recipient?recipient.nick:'Выберите'}</span>
              </div>` :
                    `<div class="flex-row gap-8 mb-8">
                <button class="btn btn-xs btn-secondary" onclick="switchChatTab('private')">💬 ЛС</button>
                <span class="fw-bold text-sm">Общий чат</span>
              </div>`;
                const inputHtml = isPrivate ?
                    `<div class="flex-row gap-6 mt-8">
                <select id="chat-recipient-select" class="w-100">${usersList}</select>
                <input type="text" id="chat-input" placeholder="Сообщение..." style="flex:2;">
                <button class="btn btn-sm" onclick="sendChatFromInput()">📨</button>
              </div>` :
                    `<div class="flex-row gap-6 mt-8">
                <input type="text" id="chat-input" placeholder="Сообщение..." style="flex:1;">
                <button class="btn btn-sm" onclick="sendChatFromInput()">📨</button>
              </div>`;
                mainContent.innerHTML = `
              <h3 class="mb-8">💬 Чат</h3>
              ${chatHeader}
              <div class="scroll-y" id="chat-messages" style="max-height:40vh;">${msgsHtml}</div>
              ${inputHtml}
            `;
                const chatDiv = document.getElementById('chat-messages');
                if (chatDiv) chatDiv.scrollTop = chatDiv.scrollHeight;
            }

            function switchChatTab(tab) {
                chatTab = tab;
                if (tab === 'general') chatRecipient = null;
                renderChat();
            }

            function sendChatFromInput() {
                const input = document.getElementById('chat-input');
                if (!input || !input.value.trim()) return;
                const text = input.value.trim();
                if (chatTab === 'private') {
                    const select = document.getElementById('chat-recipient-select');
                    if (select) {
                        const recipientId = parseInt(select.value);
                        const recipient = getUserById(recipientId);
                        if (recipient) {
                            chatRecipient = recipient;
                            sendChatMessage(text, recipientId);
                            input.value = '';
                            renderChat();
                            return;
                        }
                    }
                    if (chatRecipient) {
                        sendChatMessage(text, chatRecipient.id);
                        input.value = '';
                        renderChat();
                    } else {
                        openModal(
                            `<h3>💬 Выберите собеседника</h3><button class="btn mt-8" onclick="closeModal()">ОК</button>`
                            );
                    }
                } else {
                    sendChatMessage(text, null);
                    input.value = '';
                    renderChat();
                }
            }

            function renderSettings() {
                if (!currentUser || !currentServer) return;
                updateMainUI();
                const adminLvl = isAdminOfServer(currentUser, currentServer.name);
                const isOwnerUser = isOwner();
                const adminSection = (adminLvl > 0 || isOwnerUser) ?
                    `<button class="btn btn-sm btn-secondary" onclick="openAdminPanel()">🛠️ Админ-панель (Уровень ${adminLvl||(isOwnerUser?5:0)})</button>` :
                    '';
                const warningsHtml = currentUser.warnings && currentUser.warnings.length > 0 ?
                    `<div class="glass mt-8" style="padding:10px;border-left:3px solid var(--orange);">
                <div class="fw-bold text-sm">⚠️ Предупреждения:</div>
                ${currentUser.warnings.map(w=>`<div class="text-xs text-muted">${w.reason} (${new Date(w.date).toLocaleDateString()})</div>`).join('')}
              </div>` : '';
                mainContent.innerHTML = `
              <h3 class="mb-8">⚙️ Настройки</h3>
              <div class="glass" style="padding:14px;">
                <div class="stat-row"><span class="text-muted">Ник:</span><span class="fw-bold">${currentUser.nick}</span></div>
                <div class="stat-row"><span class="text-muted">Баланс:</span><span class="price-tag">${currentUser.balance} монет</span></div>
                <div class="stat-row"><span class="text-muted">Сервер:</span><span>${currentServer.name}</span></div>
              </div>
              ${warningsHtml}
              <div class="glass mt-8" style="padding:14px;">
                <div class="stat-row"><span>🔊 Звук</span><div class="toggle-switch ${currentUser.soundEnabled?'active':''}" onclick="toggleSound()"></div></div>
                <div class="stat-row"><span>🔔 Уведомления</span><div class="toggle-switch ${currentUser.notificationsEnabled?'active':''}" onclick="toggleNotifications()"></div></div>
              </div>
              <div class="glass mt-8" style="padding:14px;">
                <div class="fw-bold mb-8">📊 Статистика</div>
                <div class="stat-row"><span class="text-muted">Открыто кейсов:</span><span>${currentUser.stats.openedCases||0}</span></div>
                <div class="stat-row"><span class="text-muted">Получено предметов:</span><span>${currentUser.stats.itemsObtained||0}</span></div>
                <div class="stat-row"><span class="text-muted">Потрачено:</span><span>${currentUser.stats.spent||0} монет</span></div>
                <div class="stat-row"><span class="text-muted">Заработано:</span><span>${currentUser.stats.earned||0} монет</span></div>
              </div>
              <div class="glass mt-8" style="padding:14px;">
                <div class="fw-bold mb-8">🎫 Поддержка</div>
                <button class="btn btn-sm btn-secondary" onclick="showSupportForm()">Создать тикет</button>
              </div>
              <div class="flex-col gap-8 mt-8">
                ${adminSection}
                <button class="btn btn-secondary" onclick="showDonateModal()">💎 Пополнить баланс</button>
                <button class="btn btn-danger" onclick="exitServer()">🚪 Выйти из сервера</button>
                <button class="btn btn-secondary" onclick="logoutUser()">🔒 Выйти из аккаунта</button>
              </div>
            `;
            }

            function toggleSound() {
                if (!currentUser) return;
                currentUser.soundEnabled = !currentUser.soundEnabled;
                saveData();
                renderSettings();
            }

            function toggleNotifications() {
                if (!currentUser) return;
                currentUser.notificationsEnabled = !currentUser.notificationsEnabled;
                saveData();
                renderSettings();
            }

            function showSupportForm() {
                openModal(`
              <h3>🎫 Поддержка</h3>
              <input type="text" id="ticket-subject" class="mt-8" placeholder="Тема">
              <textarea id="ticket-message" class="mt-8" placeholder="Опишите проблему..." rows="4"></textarea>
              <button class="btn mt-16" onclick="submitTicket()">Отправить</button>
              <button class="btn btn-secondary mt-8" onclick="closeModal()">Отмена</button>
            `);
            }

            function submitTicket() {
                const subject = document.getElementById('ticket-subject')?.value.trim() || 'Без темы';
                const message = document.getElementById('ticket-message')?.value.trim() || 'Без описания';
                if (!currentUser || !currentServer) return;
                const ticket = addTicket(currentUser.id, currentServer.name, subject, message);
                sendToBot({ type: 'ticket', server: currentServer.name, nick: currentUser.nick, subject, message,
                    ticketId: ticket.id });
                closeModal();
                openModal(`<h3>✅ Тикет отправлен</h3><p class="text-center text-muted">ID: ${ticket.id}</p><button class="btn mt-8" onclick="closeModal()">ОК</button>`);
            }

            function showDonateModal() {
                const packsHtml = DONATE_PACKS.map(p => `
              <div class="item-row" style="cursor:pointer;" onclick="donatePack('${p.id}')">
                <div style="flex:1;">
                  <div class="fw-bold">${p.stars} ⭐ = ${p.coins} монет</div>
                </div>
                <button class="btn btn-xs btn-secondary">Купить</button>
              </div>
            `).join('');
                openModal(`
              <h3>💎 Пополнение баланса</h3>
              <p class="text-xs text-muted text-center mt-8">Оплата через звёзды Telegram</p>
              <div class="mt-8">${packsHtml}</div>
              <button class="btn btn-secondary mt-16" onclick="closeModal()">Закрыть</button>
            `);
            }

            function donatePack(packId) {
                const pack = DONATE_PACKS.find(p => p.id === packId);
                if (!pack) return;
                sendToBot({ type: 'donate', pack: packId, stars: pack.stars, coins: pack.coins, nick: currentUser ? currentUser
                        .nick : 'Unknown' });
                closeModal();
                openModal(
                    `<h3>⭐ Оплата</h3><p class="text-center text-muted">Отправляем запрос на оплату ${pack.stars} звёзд...<br>Ссылка: https://t.me/storm_cases_bot?start=${packId}</p><button class="btn mt-8" onclick="closeModal()">ОК</button>`
                    );
            }

            function openAdminPanel() {
                if (!currentUser || !currentServer) return;
                const lvl = isAdminOfServer(currentUser, currentServer.name);
                const owner = isOwner();
                if (lvl <= 0 && !owner) return;
                adminLevel = owner ? 5 : lvl;
                isAdminMode = true;
                renderAdminPanel();
            }

            function renderAdminPanel() {
                if (!isAdminMode) return;
                const owner = isOwner();
                const lvl = adminLevel;
                let tabs = ['players', 'logs', 'give', 'tickets', 'chat', 'servers', 'economy'];
                if (owner || lvl >= 5) tabs.push('admins');
                const tabsHtml = tabs.map(t => {
                    const labels = { players: '👥 Игроки', logs: '📋 Логи', give: '🎁 Выдать', tickets: '🎫 Тикеты',
                        chat: '💬 Чат', servers: '🖥️ Серверы', economy: '💰 Экономика', admins: '👑 Админы' };
                    return `<button class="tab-btn ${t==='players'?'active':''}" data-atab="${t}" onclick="switchAdminTab('${t}')">${labels[t]||t}</button>`;
                }).join('');
                mainContent.innerHTML = `
              <div class="flex-row gap-8 mb-8">
                <button class="btn btn-xs btn-secondary" onclick="closeAdminPanel()">← Назад</button>
                <span class="fw-bold">🛠️ Админ-панель (Уровень ${lvl})</span>
              </div>
              <div class="tab-bar" style="flex-wrap:wrap;">${tabsHtml}</div>
              <div id="admin-content" class="scroll-y" style="max-height:55vh;"></div>
            `;
                renderAdminTab('players');
            }

            function switchAdminTab(tab) {
                document.querySelectorAll('[data-atab]').forEach(b => b.classList.remove('active'));
                document.querySelector(`[data-atab="${tab}"]`)?.classList.add('active');
                renderAdminTab(tab);
            }

            function closeAdminPanel() {
                isAdminMode = false;
                adminLevel = 0;
                renderSettings();
            }

            function renderAdminTab(tab) {
                if (!isAdminMode) return;
                const container = document.getElementById('admin-content');
                if (!container) return;
                const owner = isOwner();
                const lvl = adminLevel;
                const server = currentServer;
                const serverName = currentServer.name;
                const canManageAdmins = owner || lvl >= 5;
                let html = '';
                switch (tab) {
                    case 'players':
                        const users = appData.users.filter(u => u.servers && u.servers[serverName] !== undefined || true);
                        html =
                            `<h4 class="mb-8">Игроки на сервере ${serverName}</h4>${appData.users.map(u=>{
                          const isAdmin=isAdminOfServer(u,serverName);
                          return `<div class="item-row">
                            <div style="flex:1;">
                              <div class="fw-bold text-sm">${u.nick} ${isAdmin>0?'<span class="admin-badge">ADMIN</span>':''}</div>
                              <div class="text-xs text-muted">Баланс: ${u.balance} | Предметов: ${u.inventory.length} | Предупреждения: ${u.warnings.length}</div>
                              ${u.isBanned?'<span class="badge badge-common">🔨 Забанен</span>':''}
                              ${u.isMuted&&Date.now()<(u.muteUntil||0)?'<span class="badge badge-common">🔇 Замучен</span>':''}
                            </div>
                            <div class="flex-row gap-6">
                              <button class="btn btn-xs btn-secondary" onclick="adminAction('warn',${u.id})">⚠️</button>
                              <button class="btn btn-xs btn-secondary" onclick="adminAction('mute',${u.id})">🔇</button>
                              <button class="btn btn-xs btn-danger" onclick="adminAction('ban',${u.id})">🔨</button>
                              <button class="btn btn-xs btn-secondary" onclick="adminAction('unmute',${u.id})">✅</button>
                            </div>
                          </div>`}).join('')}`;
                        break;
                    case 'logs':
                        html =
                            `<h4 class="mb-8">Логи действий</h4>${appData.logs.filter(l=>l.server===serverName).slice(-50).reverse().map(l=>`<div class="text-xs text-muted mb-8">[${new Date(l.timestamp).toLocaleString()}] ${l.adminNick}: ${l.action} - ${l.details}</div>`).join('')||'<div class="empty-state">Нет логов</div>'}`;
                        break;
                    case 'give':
                        html = `
                  <h4 class="mb-8">Выдать монеты или предмет</h4>
                  <input type="text" id="give-nick" class="mb-8" placeholder="Ник игрока">
                  <input type="number" id="give-coins" class="mb-8" placeholder="Количество монет" min="0">
                  <div class="flex-row gap-8 mb-8">
                    <select id="give-item-rarity" class="mb-8" style="flex:1;">
                      <option value="">— Предмет (необязательно) —</option>
                      ${RARITIES.map(r=>`<option value="${r}">${RARITY_LABELS[r]}</option>`).join('')}
                    </select>
                  </div>
                  <button class="btn" onclick="adminGiveItem()">Выдать</button>
                `;
                        break;
                    case 'tickets':
                        html =
                            `<h4 class="mb-8">Тикеты</h4>${appData.tickets.filter(t=>t.serverName===serverName).map(t=>`<div class="item-row">
                  <div style="flex:1;">
                    <div class="fw-bold text-sm">#${t.id} ${t.subject}</div>
                    <div class="text-xs text-muted">${t.message}</div>
                    <div class="text-xs text-muted">От: ${getUserById(t.userId)?.nick||'Неизв.'} | ${new Date(t.createdAt).toLocaleString()}</div>
                    <span class="badge badge-${t.status==='open'?'epic':'common'}">${t.status==='open'?'Открыт':'Решён'}</span>
                  </div>
                  <div class="flex-row gap-6">
                    <button class="btn btn-xs btn-success" onclick="resolveTicket(${t.id})">✅</button>
                    <button class="btn btn-xs btn-danger" onclick="deleteTicket(${t.id})">🗑️</button>
                  </div>
                </div>`).join('')||'<div class="empty-state">Нет тикетов</div>'}`;
                        break;
                    case 'chat':
                        html = `
                  <h4 class="mb-8">Управление чатом</h4>
                  <p class="text-xs text-muted mb-8">Сообщений в общем чате: ${server.chat.filter(m=>!m.isPrivate).length}</p>
                  <button class="btn btn-danger" onclick="clearServerChat()">🗑️ Очистить общий чат</button>
                `;
                        break;
                    case 'servers':
                        html = `
                  <h4 class="mb-8">Управление серверами</h4>
                  ${SERVER_NAMES.map(sn=>{
                    const s=getServer(sn);
                    return `<div class="item-row">
                      <div style="flex:1;">
                        <div class="fw-bold">${sn}</div>
                        <div class="text-xs text-muted">Онлайн: ${s.online} | Статус: ${s.isOnline!==false?'🟢':'🔴'}</div>
                      </div>
                      <div class="flex-row gap-6">
                        <button class="btn btn-xs btn-secondary" onclick="adminServerToggle('${sn}')">${s.isOnline!==false?'Отключить':'Включить'}</button>
                        <button class="btn btn-xs btn-secondary" onclick="adminServerRestart('${sn}')">🔄</button>
                      </div>
                    </div>`}).join('')}
                `;
                        break;
                    case 'economy':
                        html = `
                  <h4 class="mb-8">Экономика сервера</h4>
                  <div class="flex-col gap-8">
                    <label class="text-sm">Начальный баланс: <span class="price-tag">${server.settings.startBalance}</span></label>
                    <input type="number" id="eco-start-balance" value="${server.settings.startBalance}" min="0">
                    <label class="text-sm">Множитель продажи: <span class="price-tag">${server.settings.sellMultiplier}</span></label>
                    <input type="number" id="eco-sell-mult" value="${server.settings.sellMultiplier}" min="0.1" step="0.1">
                    <button class="btn" onclick="adminSaveEconomy()">Сохранить</button>
                  </div>
                `;
                        break;
                    case 'admins':
                        if (!canManageAdmins) {
                            html = '<div class="empty-state">Нет доступа</div>';
                            break;
                        }
                        const admins = server.admins || [];
                        html = `
                  <h4 class="mb-8">Администраторы сервера</h4>
                  ${admins.map(a=>`<div class="item-row">
                    <div style="flex:1;">
                      <div class="fw-bold text-sm">${getUserById(a.userId)?.nick||'Неизв.'}</div>
                      <div class="text-xs text-muted">Уровень: ${a.level}</div>
                    </div>
                    <button class="btn btn-xs btn-danger" onclick="removeAdmin(${a.userId})">Удалить</button>
                  </div>`).join('')||'<div class="empty-state">Нет админов</div>'}
                  <div class="flex-row gap-8 mt-8">
                    <input type="text" id="admin-nick" placeholder="Ник нового админа" style="flex:1;">
                    <input type="number" id="admin-level" placeholder="Уровень" min="1" max="4" value="1" style="width:70px;">
                  </div>
                  <button class="btn mt-8" onclick="addAdmin()">Добавить</button>
                `;
                        break;
                    default:
                        html = '<div class="empty-state">Выберите вкладку</div>';
                }
                container.innerHTML = html;
            }

            function adminAction(action, userId) {
                const target = getUserById(userId);
                if (!target || !currentServer) return;
                const server = currentServer;
                switch (action) {
                    case 'warn':
                        const reason = prompt('Причина предупреждения:') || 'Нарушение правил';
                        target.warnings.push({ reason, date: Date.now(), by: currentUser.nick });
                        addLog(currentServer.name, 'warn', `${target.nick} предупреждён: ${reason}`);
                        sendToBot({ type: 'admin_warn', server: currentServer.name, target: target.nick, reason });
                        break;
                    case 'mute':
                        target.isMuted = true;
                        target.muteUntil = Date.now() + 3600000;
                        addLog(currentServer.name, 'mute', `${target.nick} замучен на 1 час`);
                        sendToBot({ type: 'admin_mute', server: currentServer.name, target: target.nick });
                        break;
                    case 'unmute':
                        target.isMuted = false;
                        target.muteUntil = null;
                        addLog(currentServer.name, 'unmute', `${target.nick} размучен`);
                        break;
                    case 'ban':
                        const banReason = prompt('Причина бана:') || 'Нарушение правил';
                        target.isBanned = true;
                        target.banReason = banReason;
                        addLog(currentServer.name, 'ban', `${target.nick} забанен: ${banReason}`);
                        sendToBot({ type: 'admin_ban', server: currentServer.name, target: target.nick, reason: banReason });
                        break;
                    case 'unban':
                        target.isBanned = false;
                        target.banReason = null;
                        addLog(currentServer.name, 'unban', `${target.nick} разбанен`);
                        break;
                }
                saveData();
                renderAdminTab('players');
            }

            function adminGiveItem() {
                const nick = document.getElementById('give-nick')?.value.trim();
                const coins = parseInt(document.getElementById('give-coins')?.value || '0');
                const rarity = document.getElementById('give-item-rarity')?.value;
                if (!nick) return;
                const target = getUserByNick(nick);
                if (!target) {
                    openModal(`<h3>❌ Игрок не найден</h3><button class="btn mt-8" onclick="closeModal()">ОК</button>`);
                    return;
                }
                if (coins > 0) {
                    target.balance += coins;
                    addLog(currentServer.name, 'give_coins', `${target.nick} +${coins} монет`);
                    sendToBot({ type: 'admin_give_coins', server: currentServer.name, target: target.nick, amount: coins });
                }
                if (rarity) {
                    const item = getRandomItemByRarity(rarity);
                    if (item) {
                        addToInventory(target, item);
                        addLog(currentServer.name, 'give_item', `${target.nick} получил ${item.name}`);
                        sendToBot({ type: 'admin_give_item', server: currentServer.name, target: target.nick, item: item
                                .name });
                    }
                }
                saveData();
                renderAdminTab('give');
                openModal(
                    `<h3>✅ Выдано</h3><p class="text-center text-muted">${coins>0?coins+' монет ':''}${rarity?'предмет '+RARITY_LABELS[rarity]:''} для ${target.nick}</p><button class="btn mt-8" onclick="closeModal()">ОК</button>`
                    );
            }

            function resolveTicket(id) {
                const ticket = appData.tickets.find(t => t.id === id);
                if (ticket) ticket.status = 'resolved';
                saveData();
                renderAdminTab('tickets');
            }

            function deleteTicket(id) {
                appData.tickets = appData.tickets.filter(t => t.id !== id);
                saveData();
                renderAdminTab('tickets');
            }

            function clearServerChat() {
                if (!currentServer) return;
                currentServer.chat = currentServer.chat.filter(m => m.isPrivate);
                addLog(currentServer.name, 'clear_chat', 'Общий чат очищен');
                saveData();
                renderAdminTab('chat');
            }

            function adminServerToggle(name) {
                const server = getServer(name);
                if (!server) return;
                server.isOnline = server.isOnline === false ? true : false;
                if (server.isOnline) server.online = Math.floor(Math.random() * 100) + 1;
                addLog(currentServer.name, 'server_toggle', `${name}: ${server.isOnline?'включен':'отключён'}`);
                saveData();
                renderAdminTab('servers');
            }

            function adminServerRestart(name) {
                const server = getServer(name);
                if (!server) return;
                server.online = Math.floor(Math.random() * 100) + 1;
                addLog(currentServer.name, 'server_restart', `${name} перезапущен`);
                saveData();
                renderAdminTab('servers');
            }

            function adminSaveEconomy() {
                const startBal = parseInt(document.getElementById('eco-start-balance')?.value || '1000');
                const mult = parseFloat(document.getElementById('eco-sell-mult')?.value || '0.5');
                if (!currentServer) return;
                currentServer.settings.startBalance = startBal;
                currentServer.settings.sellMultiplier = mult;
                addLog(currentServer.name, 'economy', `Баланс: ${startBal}, множитель: ${mult}`);
                saveData();
                renderAdminTab('economy');
                openModal(`<h3>✅ Сохранено</h3><button class="btn mt-8" onclick="closeModal()">ОК</button>`);
            }

            function addAdmin() {
                const nick = document.getElementById('admin-nick')?.value.trim();
                const level = parseInt(document.getElementById('admin-level')?.value || '1');
                if (!nick || level < 1 || level > 4) return;
                const target = getUserByNick(nick);
                if (!target || !currentServer) return;
                if (!currentServer.admins) currentServer.admins = [];
                if (currentServer.admins.find(a => a.userId === target.id)) {
                    openModal(`<h3>❌ Уже админ</h3><button class="btn mt-8" onclick="closeModal()">ОК</button>`);
                    return;
                }
                currentServer.admins.push({ userId: target.id, level: level, addedBy: currentUser.id });
                addLog(currentServer.name, 'add_admin', `${target.nick} назначен админом уровня ${level}`);
                saveData();
                renderAdminTab('admins');
            }

            function removeAdmin(userId) {
                if (!currentServer) return;
                currentServer.admins = (currentServer.admins || []).filter(a => a.userId !== userId);
                addLog(currentServer.name, 'remove_admin', `Админ ${userId} удалён`);
                saveData();
                renderAdminTab('admins');
            }

            function renderMainTab(tab) {
                currentTab = tab;
                switch (tab) {
                    case 'cases':
                        renderCases();
                        break;
                    case 'inventory':
                        renderInventory();
                        break;
                    case 'market':
                        renderMarket();
                        break;
                    case 'chat':
                        renderChat();
                        break;
                    case 'settings':
                        renderSettings();
                        break;
                    default:
                        renderCases();
                }
            }

            mainTabs.addEventListener('click', function(e) {
                const btn = e.target.closest('.tab-btn');
                if (!btn) return;
                const tab = btn.dataset.tab;
                if (!tab) return;
                mainTabs.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderMainTab(tab);
            });

            document.getElementById('btn-login').addEventListener('click', function() {
                const nick = document.getElementById('auth-nick').value.trim();
                const password = document.getElementById('auth-password').value;
                const result = loginUser(nick, password);
                if (result.error) {
                    openModal(`<h3>❌ Ошибка</h3><p class="text-center">${result.error}</p><button class="btn mt-8" onclick="closeModal()">ОК</button>`);
                } else {
                    currentUser = result.user;
                    showScreen('screen-servers');
                    renderServers();
                }
            });

            document.getElementById('btn-register').addEventListener('click', function() {
                const nick = document.getElementById('auth-nick').value.trim();
                const password = document.getElementById('auth-password').value;
                const result = registerUser(nick, password);
                if (result.error) {
                    openModal(`<h3>❌ Ошибка</h3><p class="text-center">${result.error}</p><button class="btn mt-8" onclick="closeModal()">ОК</button>`);
                } else {
                    currentUser = result.user;
                    showScreen('screen-servers');
                    renderServers();
                }
            });

            document.getElementById('btn-logout').addEventListener('click', function() {
                logoutUser();
            });

            document.getElementById('main-balance').addEventListener('click', function() {
                showDonateModal();
            });

            window.selectServer = selectServer;
            window.acceptServerRules = acceptServerRules;
            window.showCaseDetails = showCaseDetails;
            window.openCaseById = openCaseById;
            window.sellInvItem = sellInvItem;
            window.confirmSell = confirmSell;
            window.listInvItem = listInvItem;
            window.confirmList = confirmList;
            window.showCrafts = showCrafts;
            window.craftItem = craftItem;
            window.toggleFilters = toggleFilters;
            window.buyFromMarket = buyFromMarket;
            window.removeMarketListing = removeMarketListing;
            window.switchChatTab = switchChatTab;
            window.sendChatFromInput = sendChatFromInput;
            window.toggleSound = toggleSound;
            window.toggleNotifications = toggleNotifications;
            window.showSupportForm = showSupportForm;
            window.submitTicket = submitTicket;
            window.showDonateModal = showDonateModal;
            window.donatePack = donatePack;
            window.openAdminPanel = openAdminPanel;
            window.closeAdminPanel = closeAdminPanel;
            window.switchAdminTab = switchAdminTab;
            window.adminAction = adminAction;
            window.adminGiveItem = adminGiveItem;
            window.resolveTicket = resolveTicket;
            window.deleteTicket = deleteTicket;
            window.clearServerChat = clearServerChat;
            window.adminServerToggle = adminServerToggle;
            window.adminServerRestart = adminServerRestart;
            window.adminSaveEconomy = adminSaveEconomy;
            window.addAdmin = addAdmin;
            window.removeAdmin = removeAdmin;
            window.closeModal = closeModal;
            window.exitServer = exitServer;
            window.logoutUser = logoutUser;

            function init() {
                const savedUser = getCurrentUser();
                if (savedUser) {
                    currentUser = savedUser;
                    showScreen('screen-servers');
                    renderServers();
                } else {
                    showScreen('screen-auth');
                }
                if (isOwner()) {
                    console.log('Owner detected!');
                }
            }

            init();
            saveData();
        })();
    </script>
</body>
</html>
