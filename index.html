<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STORM CASES</title>
    <style>
        :root {
            --bg: #08080f;
            --bg2: #0e0e18;
            --card: rgba(255, 255, 255, 0.04);
            --card-hover: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.08);
            --glass: rgba(20, 20, 35, 0.75);
            --text: #e8e8f0;
            --text2: #9a9ab0;
            --accent: #7c3aed;
            --accent2: #a855f7;
            --gold: #ffd700;
            --green: #22c55e;
            --red: #ef4444;
            --orange: #f97316;
            --c-common: #9e9e9e;
            --c-rare: #4fc3f7;
            --c-epic: #ab47bc;
            --c-legendary: #ffd700;
            --c-mythic: #ff4081;
            --radius: 14px;
            --maxw: 420px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html,
        body {
            height: 100%;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at 50% 0%, #1a1a2e 0%, #08080f 60%);
        }
        #app {
            width: 100%;
            max-width: var(--maxw);
            height: 100vh;
            max-height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            background: var(--bg);
            border-radius: 0;
            box-shadow: var(--shadow);
        }
        @media(min-width:421px) {
            #app {
                border-radius: 20px;
                height: 90vh;
                max-height: 780px;
            }
        }
        .screen {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px;
            animation: fadeIn 0.3s ease;
            background: var(--bg);
        }
        .screen.active {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            10%,
            30%,
            50%,
            70%,
            90% {
                transform: translateX(-8px);
            }
            20%,
            40%,
            60%,
            80% {
                transform: translateX(8px);
            }
        }
        @keyframes spinReveal {
            0% {
                transform: rotate(0deg) scale(0.5);
                opacity: 0;
            }
            50% {
                transform: rotate(180deg) scale(1.1);
                opacity: 1;
            }
            100% {
                transform: rotate(360deg) scale(1);
            }
        }
        @keyframes glow {
            0%,
            100% {
                box-shadow: 0 0 15px rgba(124, 58, 237, 0.5);
            }
            50% {
                box-shadow: 0 0 35px rgba(168, 85, 247, 0.8);
            }
        }
        .shake {
            animation: shake 0.5s ease;
        }
        .spin-reveal {
            animation: spinReveal 0.8s ease forwards;
        }
        .glass {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 16px;
            transition: var(--transition);
            cursor: pointer;
        }
        .card:hover {
            background: var(--card-hover);
            transform: translateY(-2px);
        }
        .card:active {
            transform: scale(0.97);
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.3px;
            background: var(--accent);
            color: #fff;
            width: 100%;
            text-align: center;
            user-select: none;
        }
        .btn:hover {
            background: var(--accent2);
            transform: translateY(-1px);
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .btn-danger {
            background: var(--red);
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-success {
            background: var(--green);
        }
        .btn-success:hover {
            background: #16a34a;
        }
        .btn-sm {
            padding: 7px 12px;
            font-size: 12px;
            width: auto;
            border-radius: 7px;
        }
        .btn-xs {
            padding: 5px 9px;
            font-size: 11px;
            width: auto;
            border-radius: 6px;
        }
        input,
        textarea,
        select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
            font-family: inherit;
        }
        input:focus,
        textarea:focus,
        select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
        }
        input::placeholder,
        textarea::placeholder {
            color: #555;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            width: 100%;
            max-width: 380px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: var(--shadow);
            animation: fadeIn 0.3s ease;
        }
        .modal h3 {
            margin-bottom: 14px;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            color: var(--text);
        }
        .modal .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .modal .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .modal {
            position: relative;
        }
        .tab-bar {
            display: flex;
            gap: 6px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 12px;
            flex-wrap: nowrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .tab-btn {
            padding: 9px 14px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text2);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .tab-btn.active {
            background: var(--accent);
            color: #fff;
        }
        .tab-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.06);
        }
        .rarity-common {
            color: var(--c-common);
        }
        .rarity-rare {
            color: var(--c-rare);
        }
        .rarity-epic {
            color: var(--c-epic);
        }
        .rarity-legendary {
            color: var(--c-legendary);
        }
        .rarity-mythic {
            color: var(--c-mythic);
            text-shadow: 0 0 10px rgba(255, 64, 129, 0.6);
        }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .badge-common {
            background: rgba(158, 158, 158, 0.2);
            color: var(--c-common);
        }
        .badge-rare {
            background: rgba(79, 195, 247, 0.2);
            color: var(--c-rare);
        }
        .badge-epic {
            background: rgba(171, 71, 188, 0.25);
            color: var(--c-epic);
        }
        .badge-legendary {
            background: rgba(255, 215, 0, 0.2);
            color: var(--c-legendary);
        }
        .badge-mythic {
            background: rgba(255, 64, 129, 0.25);
            color: var(--c-mythic);
            animation: glow 2s infinite;
        }
        .item-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 6px;
            transition: var(--transition);
            cursor: pointer;
        }
        .item-row:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .item-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.05);
        }
        .chat-message {
            padding: 8px 12px;
            border-radius: 12px;
            margin-bottom: 6px;
            max-width: 80%;
            word-wrap: break-word;
            font-size: 13px;
            line-height: 1.4;
        }
        .chat-message.own {
            margin-left: auto;
            background: var(--accent);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .chat-message.other {
            margin-right: auto;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }
        .chat-message .sender {
            font-size: 11px;
            font-weight: 700;
            opacity: 0.7;
            margin-bottom: 2px;
        }
        .chat-message .time {
            font-size: 10px;
            opacity: 0.5;
            text-align: right;
            margin-top: 3px;
        }
        .scroll-y {
            overflow-y: auto;
            flex: 1;
            min-height: 0;
            -webkit-overflow-scrolling: touch;
        }
        .flex-col {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .flex-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mt-12 {
            margin-top: 12px;
        }
        .mt-16 {
            margin-top: 16px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .mb-12 {
            margin-bottom: 12px;
        }
        .text-center {
            text-align: center;
        }
        .text-sm {
            font-size: 12px;
        }
        .text-xs {
            font-size: 11px;
        }
        .text-muted {
            color: var(--text2);
        }
        .fw-bold {
            font-weight: 700;
        }
        .w-100 {
            width: 100%;
        }
        .gap-6 {
            gap: 6px;
        }
        .gap-8 {
            gap: 8px;
        }
        .gap-10 {
            gap: 10px;
        }
        .hidden {
            display: none !important;
        }
        .server-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            margin-bottom: 8px;
            border-radius: var(--radius);
            background: var(--card);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: var(--transition);
        }
        .server-card:hover {
            background: var(--card-hover);
            transform: translateX(4px);
        }
        .server-online {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            color: var(--green);
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            display: inline-block;
        }
        .dot-offline {
            background: var(--red);
        }
        .case-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .case-card {
            padding: 14px;
            text-align: center;
            border-radius: var(--radius);
            background: var(--card);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .case-card:hover {
            background: var(--card-hover);
            transform: translateY(-3px);
        }
        .case-card .case-icon {
            font-size: 40px;
            margin-bottom: 8px;
            animation: pulse 2s infinite;
        }
        .case-card .price {
            font-weight: 700;
            color: var(--gold);
            font-size: 14px;
        }
        .admin-badge {
            background: var(--accent);
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .warn-badge {
            background: var(--orange);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
        }
        .filter-section {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            display: none;
        }
        .filter-section.active {
            display: block;
            animation: fadeIn 0.2s ease;
        }
        .market-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 6px;
        }
        .case-animation-container {
            text-align: center;
            padding: 30px 10px;
            position: relative;
        }
        .case-animation-container .case-box {
            font-size: 80px;
            animation: shake 0.5s infinite;
        }
        .case-animation-container .reveal-item {
            font-size: 60px;
            display: none;
            animation: spinReveal 0.8s ease forwards;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stat-row:last-child {
            border-bottom: none;
        }
        .toggle-switch {
            width: 48px;
            height: 26px;
            border-radius: 13px;
            background: rgba(255, 255, 255, 0.15);
            cursor: pointer;
            position: relative;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .toggle-switch.active {
            background: var(--accent);
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fff;
            transition: var(--transition);
        }
        .toggle-switch.active::after {
            left: 25px;
        }
        .admin-tab-content {
            display: none;
        }
        .admin-tab-content.active {
            display: block;
            animation: fadeIn 0.2s ease;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }
        .price-tag {
            color: var(--gold);
            font-weight: 700;
        }
        .empty-state {
            text-align: center;
            padding: 30px 15px;
            color: var(--text2);
            font-size: 14px;
        }
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 10px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Auth Screen -->
        <div class="screen active" id="screen-auth">
            <div class="flex-col" style="justify-content:center;height:100%;max-width:360px;margin:0 auto;width:100%;">
                <div class="text-center mb-12">
                    <div style="font-size:60px;margin-bottom:8px;">🎁</div>
                    <h1 style="font-size:28px;font-weight:800;letter-spacing:2px;background:linear-gradient(135deg,#a855f7,#7c3aed,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">STORM CASES</h1>
                    <p class="text-muted text-sm mt-8">Открывай кейсы, собирай коллекцию, торгуй на рынке</p>
                </div>
                <div class="glass" style="padding:20px;">
                    <div class="flex-col gap-8">
                        <input type="text" id="auth-nick" placeholder="Никнейм" autocomplete="off">
                        <input type="password" id="auth-password" placeholder="Пароль" autocomplete="off">
                        <button class="btn" id="btn-login">Войти</button>
                        <button class="btn btn-secondary" id="btn-register">Создать аккаунт</button>
                        <p class="text-xs text-muted text-center mt-8">Данные хранятся локально в вашем браузере</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Servers Screen -->
        <div class="screen" id="screen-servers">
            <div class="flex-col" style="height:100%;">
                <div class="text-center mb-12">
                    <h2 style="font-size:22px;font-weight:700;">Выбор сервера</h2>
                    <p class="text-muted text-sm mt-8" id="servers-greeting"></p>
                </div>
                <div class="scroll-y flex-col gap-8" style="flex:1;">
                    <div id="servers-list"></div>
                </div>
                <button class="btn btn-secondary mt-8" id="btn-logout">Выйти из аккаунта</button>
            </div>
        </div>

        <!-- Main Screen -->
        <div class="screen" id="screen-main">
            <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0 10px;border-bottom:1px solid var(--border);margin-bottom:10px;flex-wrap:wrap;gap:6px;">
                <div class="flex-row gap-8">
                    <span class="fw-bold" id="main-nick">Игрок</span>
                    <span class="badge badge-common" id="main-server-badge">Server</span>
                </div>
                <div class="flex-row gap-8">
                    <span class="price-tag" id="main-balance" style="cursor:pointer;" title="Нажмите для пополнения">💰 0</span>
                </div>
            </div>
            <div class="tab-bar" id="main-tabs">
                <button class="tab-btn active" data-tab="cases">🎁 Кейсы</button>
                <button class="tab-btn" data-tab="inventory">🎒 Инвентарь</button>
                <button class="tab-btn" data-tab="market">📦 Рынок</button>
                <button class="tab-btn" data-tab="chat">💬 Чат</button>
                <button class="tab-btn" data-tab="settings">⚙️</button>
            </div>
            <div class="scroll-y" style="flex:1;" id="main-content"></div>
        </div>
    </div>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal-content"></div>
    </div>

    <script>
        (function() {
            const STORAGE_KEY = 'storm_data';
            const OWNER_TG_ID = 8601398572;
            const SERVER_NAMES = ['Alpha', 'Beta', 'Gamma', 'Delta', 'Epsilon'];
            const SERVER_PASSWORDS = { Alpha: 'alpha123', Beta: 'beta123', Gamma: 'gamma123', Delta: 'delta123',
                Epsilon: 'epsilon123' };
            const RARITIES = ['common', 'rare', 'epic', 'legendary', 'mythic'];
            const RARITY_COLORS = { common: '#9e9e9e', rare: '#4fc3f7', epic: '#ab47bc', legendary: '#ffd700',
                mythic: '#ff4081' };
            const RARITY_LABELS = { common: 'Обычный', rare: 'Редкий', epic: 'Эпический', legendary: 'Легендарный',
                mythic: 'Мифический' };

            const ITEMS_DATA = {
                common: [
                    { id: 'c1', name: 'Потрёпанный нож', icon: '🔪', rarity: 'common' },
                    { id: 'c2', name: 'Старый пистолет', icon: '🔫', rarity: 'common' },
                    { id: 'c3', name: 'Ржавый ключ', icon: '🗝️', rarity: 'common' },
                    { id: 'c4', name: 'Треснувшая маска', icon: '🎭', rarity: 'common' },
                    { id: 'c5', name: 'Пыльная перчатка', icon: '🧤', rarity: 'common' },
                    { id: 'c6', name: 'Сломанный прицел', icon: '🎯', rarity: 'common' },
                    { id: 'c7', name: 'Грязная повязка', icon: '🩹', rarity: 'common' },
                    { id: 'c8', name: 'Дешёвый брелок', icon: '🔑', rarity: 'common' },
                    { id: 'c9', name: 'Изношенный чехол', icon: '📱', rarity: 'common' },
                    { id: 'c10', name: 'Старая монета', icon: '🪙', rarity: 'common' },

                for (const rarity of RARITIES) {

                    if (roll <= cumulative) {
                        return getRandomItemByRarity(rarity);

            function hashPassword(pw) {
                let hash = 0;
                for (let i = 0; i < pw.length; i++) {
                    const char = pw.charCodeAt(i);

                    hash |= 0;
                }
                return 'h_' + Math.abs(hash).toString(36);
            }

                const seller = getUserById(listing.sellerId);
                currentUser.balance -= listing.price;
                currentUser.stats.spent += listing.price;
                const invItem = { uid: generateUid(), itemId: listing.itemId, rarity: listing.rarity,
                    obtainedAt: Date.now() };
                currentUser.inventory.push(invItem);
                const idx = currentServer.market.indexOf(listing);
