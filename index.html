<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>STORM CASES</title>
<style>
:root{--bg:#0a0a0f;--glass:rgba(255,255,255,.05);--border:rgba(255,255,255,.1);--accent:#6c5ce7;--gold:#ffd700;--red:#ef4444;--green:#10b981;--purple:#a855f7;--mythic:#f0f}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0f;color:#fff;min-height:100vh;display:flex;justify-content:center;user-select:none;overflow-x:hidden}
#app{width:100%;max-width:420px;min-height:100vh;padding-bottom:90px;position:relative;background:#0a0a0f}
.header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;margin:12px;background:var(--glass);border:1px solid var(--border);border-radius:16px;backdrop-filter:blur(10px)}
.logo{font-size:20px;font-weight:800;background:linear-gradient(135deg,#6c5ce7,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-right{display:flex;align-items:center;gap:8px}
.server-badge{font-size:12px;color:#6b6b7b}
.balance-btn{display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--glass);border:1px solid var(--border);border-radius:20px;cursor:pointer;font-weight:700;color:#fff}
#balance{color:var(--gold)}
.content{padding:0 16px}
.tab-content{display:none}
.tab-content.active{display:block}
.case-card,.item-card{background:var(--glass);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.case-card{flex-direction:column;cursor:pointer;transition:all .3s}
.case-card:active{transform:scale(.97)}
.case-header{display:flex;align-items:center;gap:16px;width:100%}
.case-icon{font-size:48px}
.case-name{font-size:18px;font-weight:700}
.case-price{color:var(--gold);font-weight:700}
.case-prob{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.item-icon{font-size:40px}
.item-info{flex:1}
.item-name{font-weight:700;font-size:14px}
.item-price{color:var(--gold);font-size:13px}
.item-type{font-size:11px;color:#6b6b7b}
.btn{padding:10px 14px;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;border:none;transition:all .3s;white-space:nowrap}
.btn:active{transform:scale(.95)}
.btn-sell{background:rgba(239,68,68,.2);color:var(--red)}
.btn-list{background:rgba(245,158,11,.2);color:#f59e0b}
.btn-buy{background:rgba(16,185,129,.2);color:var(--green)}
.btn-craft{background:rgba(168,85,247,.2);color:var(--purple)}
.btn-primary{background:linear-gradient(135deg,#6c5ce7,#a855f7);color:#fff;width:100%;padding:14px;font-size:16px}
.btn-secondary{background:var(--glass);color:#fff;width:100%;padding:14px;border:1px solid var(--border)}
.btn-remove{background:rgba(239,68,68,.2);color:var(--red)}
.settings-section{background:var(--glass);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.settings-title{font-size:16px;font-weight:700;margin-bottom:12px}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.settings-row:last-child{border-bottom:none}
.switch{width:50px;height:25px;background:#333;border-radius:25px;position:relative;cursor:pointer;transition:all .3s}
.switch.active{background:var(--accent)}
.switch::after{content:'';width:21px;height:21px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:all .3s}
.switch.active::after{left:27px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;padding:8px;z-index:40}
.nav-container{max-width:420px;margin:0 auto;display:flex;justify-content:space-around;background:rgba(26,26,46,.95);border:1px solid var(--border);border-radius:20px;padding:8px;backdrop-filter:blur(20px)}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;background:none;border:none;cursor:pointer;color:#6b6b7b;transition:all .3s;position:relative}
.nav-btn.active{color:var(--accent)}
.nav-icon{font-size:22px}
.nav-label{font-size:10px;font-weight:600}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-overlay{position:absolute;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(5px)}
.modal-content{position:relative;background:rgba(26,26,46,.95);border:1px solid var(--border);border-radius:20px;padding:24px;width:100%;max-width:380px;max-height:80vh;overflow-y:auto}
.opening-overlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center}
.opening-case{font-size:100px;animation:shake .8s infinite}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-5deg)}40%{transform:translateX(10px) rotate(5deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.opening-spin{font-size:100px;animation:spin 1s forwards}
@keyframes spin{0%{transform:rotate(0) scale(1)}100%{transform:rotate(360deg) scale(0)}}
.item-reveal{text-align:center;animation:reveal .8s}
@keyframes reveal{0%{transform:scale(0);opacity:0}50%{transform:scale(1.3);opacity:1}100%{transform:scale(1);opacity:1}}
.toasts{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:100;width:calc(100% - 40px);max-width:380px}
.toast{padding:12px 16px;border-radius:12px;font-weight:600;text-align:center;margin-bottom:8px}
.hidden{display:none!important}
.form-input{width:100%;padding:14px;border-radius:12px;background:var(--glass);border:1px solid var(--border);color:#fff;font-size:16px;margin-bottom:12px;outline:none}
.form-input:focus{border-color:var(--accent)}
textarea.form-input{min-height:100px;resize:vertical;font-family:inherit}
.legendary-section{margin-bottom:20px}
.section-title{font-size:18px;font-weight:700;margin-bottom:12px}
.chat-tabs{display:flex;gap:8px;margin-bottom:8px}
.chat-tab{padding:6px 12px;border-radius:12px;background:var(--glass);cursor:pointer;font-size:12px}
.chat-tab.active{background:var(--accent)}
.chat-messages{display:flex;flex-direction:column;gap:8px;max-height:400px;overflow-y:auto;margin-bottom:12px}
.chat-msg{display:flex;flex-direction:column;max-width:80%;align-self:flex-start}
.chat-msg.my-msg{align-self:flex-end;align-items:flex-end}
.chat-bubble{padding:8px 12px;border-radius:16px;background:rgba(255,255,255,.1)}
.my-msg .chat-bubble{background:var(--accent)}
.chat-user{font-size:12px;color:#6b6b7b;margin-bottom:2px}
.chat-text{font-size:14px;word-break:break-word}
.chat-time{font-size:10px;color:#6b6b7b;margin-top:2px}
.mythic{color:var(--mythic)}
</style>
</head>
<body>
<div id="app">
<header class="header">
<div class="logo">⚡ STORM CASES</div>
<div class="header-right">
<span class="server-badge" id="server-name">Сервер: -</span>
<button class="balance-btn" onclick="showDonate()"><span>💰</span><span id="balance">500</span><span>+</span></button>
</div>
</header>
<main class="content">
<div id="tab-cases" class="tab-content active"><div id="cases-list"></div></div>
<div id="tab-market" class="tab-content"><div id="market-list"></div></div>
<div id="tab-inventory" class="tab-content"><div id="inventory-list"></div></div>
<div id="tab-chat" class="tab-content">
<div class="chat-tabs">
<button class="chat-tab active" id="chat-tab-general" onclick="setChatMode('general')">💬 Общий</button>
<button class="chat-tab" id="chat-tab-private" onclick="setChatMode('private')">📩 ЛС</button>
</div>
<div id="chat-list"></div>
</div>
<div id="tab-settings" class="tab-content"><div id="settings-list"></div></div>
</main>
<nav class="bottom-nav">
<div class="nav-container">
<button class="nav-btn active" data-tab="cases" onclick="switchTab('cases')"><span class="nav-icon">📦</span><span class="nav-label">Кейсы</span></button>
<button class="nav-btn" data-tab="market" onclick="switchTab('market')"><span class="nav-icon">📊</span><span class="nav-label">Рынок</span></button>
<button class="nav-btn" data-tab="inventory" onclick="switchTab('inventory')"><span class="nav-icon">🎒</span><span class="nav-label">Инвентарь</span></button>
<button class="nav-btn" data-tab="chat" onclick="switchTab('chat')"><span class="nav-icon">💬</span><span class="nav-label">Чат</span></button>
<button class="nav-btn" data-tab="settings" onclick="switchTab('settings')"><span class="nav-icon">⚙️</span><span class="nav-label">Настройки</span></button>
</div>
</nav>
<div id="toasts" class="toasts"></div>
</div>
<script>
const ITEMS=[{id:1,name:'Glock-18',type:'Пистолет',rarity:'common',price:30,icon:'🔫'},{id:2,name:'USP-S',type:'Пистолет',rarity:'common',price:35,icon:'🔫'},{id:3,name:'P250',type:'Пистолет',rarity:'common',price:45,icon:'🔫'},{id:4,name:'MAC-10',type:'ПП',rarity:'common',price:50,icon:'🔫'},{id:5,name:'MP9',type:'ПП',rarity:'common',price:60,icon:'🔫'},{id:6,name:'UMP-45',type:'ПП',rarity:'common',price:70,icon:'🔫'},{id:7,name:'MP7',type:'ПП',rarity:'common',price:75,icon:'🔫'},{id:8,name:'Nova',type:'Дробовик',rarity:'common',price:65,icon:'🔫'},{id:9,name:'MAG-7',type:'Дробовик',rarity:'common',price:85,icon:'🔫'},{id:10,name:'Sawed-Off',type:'Дробовик',rarity:'common',price:65,icon:'🔫'},{id:11,name:'Tec-9',type:'Пистолет',rarity:'rare',price:55,icon:'🔫'},{id:12,name:'Desert Eagle',type:'Пистолет',rarity:'rare',price:250,icon:'🔫'},{id:13,name:'P90',type:'ПП',rarity:'rare',price:210,icon:'🔫'},{id:14,name:'Galil AR',type:'Винтовка',rarity:'rare',price:190,icon:'🔫'},{id:15,name:'FAMAS',type:'Винтовка',rarity:'rare',price:200,icon:'🔫'},{id:16,name:'SSG 08',type:'Снайперская',rarity:'rare',price:280,icon:'🔫'},{id:17,name:'Sport Gloves',type:'Перчатки',rarity:'rare',price:150,icon:'🧤'},{id:18,name:'AK-47',type:'Винтовка',rarity:'epic',price:180,icon:'🔫'},{id:19,name:'M4A4',type:'Винтовка',rarity:'epic',price:220,icon:'🔫'},{id:20,name:'M4A1-S',type:'Винтовка',rarity:'epic',price:250,icon:'🔫'},{id:21,name:'AWP',type:'Снайперская',rarity:'legendary',price:450,icon:'🔫'},{id:22,name:'SCAR-20',type:'Снайперская',rarity:'legendary',price:480,icon:'🔫'},{id:23,name:'Butterfly Knife',type:'Нож',rarity:'legendary',price:600,icon:'🗡️'},{id:24,name:'Karambit',type:'Нож',rarity:'legendary',price:1200,icon:'🗡️'},{id:25,name:'Gut Knife',type:'Нож',rarity:'legendary',price:1100,icon:'🗡️'},{id:26,name:'Specialist Gloves',type:'Перчатки',rarity:'legendary',price:550,icon:'🧤'},{id:27,name:'Moto Gloves',type:'Перчатки',rarity:'legendary',price:1600,icon:'🧤'},{id:28,name:'Pandora Gloves',type:'Перчатки',rarity:'legendary',price:1800,icon:'🧤'},{id:29,name:'Dragon Lore',type:'Скин',rarity:'legendary',price:2500,icon:'🐉'},{id:30,name:'Howl',type:'Скин',rarity:'legendary',price:3000,icon:'🐺'},{id:36,name:'Мифический AWP',type:'Снайперская',rarity:'mythic',price:15000,icon:'💥'},{id:37,name:'Мифический Керамбит',type:'Нож',rarity:'mythic',price:20000,icon:'🔪'},{id:38,name:'Мифические Перчатки',type:'Перчатки',rarity:'mythic',price:18000,icon:'🔥'}];
const CASES=[{id:0,name:'Обычный кейс',price:80,icon:'📦',prob:{common:85,rare:15}},{id:1,name:'Редкий кейс',price:280,icon:'🎁',prob:{rare:80,epic:20}},{id:2,name:'Легендарный кейс',price:650,icon:'💎',prob:{epic:85,legendary:15}},{id:3,name:'Ножевой кейс',price:1000,icon:'🗡️',prob:{rare:50,epic:35,legendary:15}},{id:4,name:'Премиум кейс',price:1500,icon:'👑',prob:{epic:60,legendary:40}},{id:5,name:'Мифический кейс',price:3000,icon:'🌟',prob:{legendary:90,mythic:10}}];
const CRAFT_RECIPES=[{id:1,resultId:18,name:'AK-47',ingredients:[{id:1,qty:5},{id:6,qty:3}]},{id:2,resultId:21,name:'AWP',ingredients:[{id:16,qty:3},{id:22,qty:2}]},{id:3,resultId:23,name:'Butterfly Knife',ingredients:[{id:24,qty:1},{id:25,qty:1}]},{id:4,resultId:27,name:'Moto Gloves',ingredients:[{id:17,qty:2},{id:26,qty:1}]},{id:5,resultId:36,name:'Мифический AWP',ingredients:[{id:29,qty:2},{id:21,qty:5}]},{id:6,resultId:37,name:'Мифический Керамбит',ingredients:[{id:24,qty:3},{id:25,qty:3}]},{id:7,resultId:38,name:'Мифические Перчатки',ingredients:[{id:27,qty:2},{id:28,qty:2}]}];
const SERVERS=[{id:'alpha',name:'Alpha',maxPlayers:100,playersOnline:Math.floor(Math.random()*100)},{id:'beta',name:'Beta',maxPlayers:100,playersOnline:Math.floor(Math.random()*100)},{id:'gamma',name:'Gamma',maxPlayers:100,playersOnline:Math.floor(Math.random()*100)},{id:'delta',name:'Delta',maxPlayers:100,playersOnline:Math.floor(Math.random()*100)},{id:'epsilon',name:'Epsilon',maxPlayers:100,playersOnline:Math.floor(Math.random()*100)}];
const ADMIN_PASSWORDS={alpha:{admin:'alpha123'},beta:{admin:'beta123'},gamma:{admin:'gamma123'},delta:{admin:'delta123'},epsilon:{admin:'epsilon123'}};
let state={balance:500,inventory:[],market:[],stats:{casesOpened:0,itemsReceived:0,totalSpent:0,totalEarned:0},sound:true,notifications:true,currentServer:null,chatMessages:[],privateMessages:{},warnings:0,muted:false,banned:false,username:null,password:null,userId:null};
let inventoryFilter='all',inventorySearch='',currentChatMode='general',activePrivateChat=null;
function save(){try{localStorage.setItem('storm_data',JSON.stringify(state))}catch(e){}}
function load(){try{const d=localStorage.getItem('storm_data');if(d){const p=JSON.parse(d);state={...state,...p};if(!state.chatMessages)state.chatMessages=[];if(!state.privateMessages)state.privateMessages={}}}catch(e){}}
function updateBalance(){document.getElementById('balance').textContent=state.balance}
function showToast(msg,type='info'){const t=document.createElement('div');t.className='toast';t.style.background=type==='success'?'rgba(16,185,129,.9)':type==='error'?'rgba(239,68,68,.9)':'rgba(108,92,231,.9)';t.textContent=msg;document.getElementById('toasts').appendChild(t);setTimeout(()=>t.remove(),3000)}
function switchTab(tab){document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));document.getElementById('tab-'+tab).classList.add('active');document.querySelectorAll('.nav-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.tab===tab));if(tab==='cases')renderCases();if(tab==='market')renderMarket();if(tab==='inventory')renderInventory();if(tab==='chat')renderChat();if(tab==='settings')renderSettings()}
function sendToBot(data){if(window.Telegram?.WebApp){try{window.Telegram.WebApp.sendData(JSON.stringify(data))}catch(e){}}}
function showRegistration(){const modal=document.createElement('div');modal.className='modal';modal.innerHTML=`<div class="modal-overlay" onclick="this.parentElement.remove()"></div><div class="modal-content"><h2 style="text-align:center;margin-bottom:16px">👤 Регистрация</h2><input id="reg-username" class="form-input" placeholder="Придумайте ник"><input id="reg-password" type="password" class="form-input" placeholder="Придумайте пароль"><button class="btn btn-primary" onclick="registerAccount()">Создать аккаунт</button><p style="text-align:center;margin-top:8px;font-size:12px">Уже есть аккаунт? <span style="color:var(--accent);cursor:pointer" onclick="showLogin()">Войти</span></p></div>`;document.body.appendChild(modal)}
function showLogin(){const modal=document.createElement('div');modal.className='modal';modal.innerHTML=`<div class="modal-overlay" onclick="this.parentElement.remove()"></div><div class="modal-content"><h2 style="text-align:center;margin-bottom:16px">🔐 Вход</h2><input id="login-username" class="form-input" placeholder="Ник"><input id="login-password" type="password" class="form-input" placeholder="Пароль"><button class="btn btn-primary" onclick="loginAccount()">Войти</button></div>`;document.body.appendChild(modal)}
function registerAccount(){const u=document.getElementById('reg-username').value.trim(),p=document.getElementById('reg-password').value.trim();if(!u||!p){showToast('Заполните все поля!','error');return}state.username=u;state.password=p;state.userId=Math.floor(Math.random()*100000)+1;save();document.querySelector('.modal').remove();showToast('✅ Аккаунт создан!','success');initServerSelection()}
function loginAccount(){const u=document.getElementById('login-username').value.trim(),p=document.getElementById('login-password').value.trim();if(state.username===u&&state.password===p){document.querySelector('.modal').remove();showToast('✅ Добро пожаловать, '+u+'!','success');initServerSelection()}else{showToast('Неверный логин или пароль','error')}}
function initServerSelection(){if(!state.username){showRegistration();return}if(!state.currentServer){const modal=document.createElement('div');modal.className='modal';modal.innerHTML=`<div class="modal-overlay"></div><div class="modal-content"><h2 style="text-align:center;margin-bottom:16px">🌍 Выбор сервера</h2>${SERVERS.map(s=>`<div class="item-card" style="cursor:pointer" onclick="selectServer('${s.id}')"><div class="item-info"><div class="item-name">${s.name}</div><div class="item-type">Онлайн: ${s.playersOnline}/${s.maxPlayers}</div></div></div>`).join('')}</div>`;document.body.appendChild(modal)}else{document.getElementById('server-name').textContent=state.currentServer.toUpperCase();showServerRules()}}
function selectServer(id){state.currentServer=id;save();document.querySelector('.modal').remove();document.getElementById('server-name').textContent=id.toUpperCase();showServerRules()}
function showServerRules(){const modal=document.createElement('div');modal.className='modal';modal.innerHTML=`<div class="modal-overlay" onclick="this.parentElement.remove()"></div><div class="modal-content"><h2 style="text-align:center;margin-bottom:16px">📜 Правила сервера ${state.currentServer.toUpperCase()}</h2><div style="font-size:13px;color:#ccc;line-height:1.5"><p>1. Запрещены оскорбления.</p><p>2. Запрещён спам.</p><p>3. Запрещено мошенничество.</p><p>4. Администрация всегда права.</p><p>5. 1 предупреждение - ограничения, 2 - запрет торговли, 3 - бан на 7 дней.</p></div><button class="btn btn-primary" onclick="this.parentElement.remove()">Принять</button></div>`;document.body.appendChild(modal)}
function exitServer(){state.currentServer=null;save();document.getElementById('server-name').textContent='Сервер: -';showToast('Вы вышли из сервера','info');initServerSelection()}
function renderCases(){const c=document.getElementById('cases-list');c.innerHTML='<div class="section-title">📦 Кейсы</div>';CASES.forEach(caseObj=>{const div=document.createElement('div');div.className='case-card';div.innerHTML=`<div class="case-header"><span class="case-icon">${caseObj.icon}</span><div><div class="case-name">${caseObj.name}</div><div class="case-price">💰 ${caseObj.price}</div></div></div><div class="case-prob">${Object.entries(caseObj.prob).map(([r,ch])=>`<span class="filter-btn" style="cursor:default">${r}: ${ch}%</span>`).join('')}</div>`;div.onclick=()=>showCaseDetails(caseObj);c.appendChild(div)})}
function showCaseDetails(caseObj){const modal=document.createElement('div');modal.className='modal';const possibleItems=ITEMS.filter(i=>Object.keys(caseObj.prob).includes(i.rarity));const itemsHtml=possibleItems.map(item=>`<div class="item-card" style="cursor:default"><span class="item-icon">${item.icon}</span><div class="item-info"><div class="item-name">${item.name}</div><div class="item-type">${item.type} | ${item.rarity}</div></div><div class="item-price">💰 ${item.price??'?'}</div></div>`).join('');modal.innerHTML=`<div class="modal-overlay" onclick="this.parentElement.remove()"></div><div class="modal-content"><h2 style="text-align:center;margin-bottom:16px">${caseObj.icon} ${caseObj.name}</h2><p style="text-align:center;color:#6b6b7b;margin-bottom:12px">Возможные предметы:</p>${itemsHtml||'<p style="text-align:center">Нет предметов</p>'}<div style="margin-top:16px"><button class="btn btn-primary" onclick="openCaseAnimation(${caseObj.id})">Открыть за 💰 ${caseObj.price}</button><button class="btn btn-secondary" style="margin-top:8px" onclick="this.closest('.modal').remove()">Закрыть</button></div></div>`;document.body.appendChild(modal)}
function openCaseAnimation(caseId){const caseObj=CASES.find(c=>c.id===caseId);if(!caseObj)return;if(state.balance<caseObj.price){showToast('Недостаточно монет!','error');return}state.balance-=caseObj.price;state.stats.totalSpent+=caseObj.price;state.stats.casesOpened++;updateBalance();save();const overlay=document.createElement('div');overlay.className='opening-overlay';overlay.innerHTML=`<div class="opening-case" id="opening-anim">${caseObj.icon}</div>`;document.body.appendChild(overlay);setTimeout(()=>{const anim=document.getElementById('opening-anim');if(anim)anim.className='opening-spin'},1000);setTimeout(()=>{const item=getRandomItem(caseObj);state.inventory.push({...item,qty:1});state.stats.itemsReceived++;save();const overlayEl=document.querySelector('.opening-overlay');if(overlayEl){overlayEl.innerHTML=`<div class="item-reveal"><div style="font-size:100px;margin-bottom:16px">${item.icon}</div><h2>${item.name}</h2><p style="color:#6b6b7b">${item.type}</p><p style="color:#ffd700;font-size:20px">💰 ${item.price??'?'}</p></div>`}sendToBot({action:'case_opened',caseId:caseObj.id,itemId:item.id,price:caseObj.price})},2000);setTimeout(()=>{const overlayEl=document.querySelector('.opening-overlay');if(overlayEl)overlayEl.remove();showToast('🎉 Предмет получен!','success')},3500)}
function getRandomItem(caseObj){const rand=Math.random()*100;let cum=0;for(const [rarity,chance] of Object.entries(caseObj.prob)){cum+=chance;if(rand<=cum){const pool=ITEMS.filter(i=>i.rarity===rarity);if(pool.length)return pool[Math.floor(Math.random()*pool.length)]}}return ITEMS[0]}
function renderInventory(){const c=document.getElementById('inventory-list');c.innerHTML='';c.innerHTML=`<div class="search-bar"><input class="search-input" placeholder="🔍 Поиск..." value="${inventorySearch}" oninput="inventorySearch=this.value;renderInventory()"></div><div class="filters">${['all','common','rare','epic','legendary','mythic'].map(f=>`<button class="filter-btn ${inventoryFilter===f?'active':''}" onclick="inventoryFilter='${f}';renderInventory()">${f==='all'?'Все':f}</button>`).join('')}</div><button class="btn btn-craft" style="width:100%;margin-bottom:12px" onclick="showCrafts()">🛠️ Крафты</button>`;let items=state.inventory.filter(item=>{if(inventoryFilter!=='all'&&item.rarity!==inventoryFilter)return false;if(inventorySearch&&!item.name.toLowerCase().includes(inventorySearch.toLowerCase()))return false;return true});if(!items.length){c.innerHTML+='<div style="text-align:center;padding:40px;color:#6b6b7b"><div style="font-size:64px">🎒</div><p>Ничего не найдено</p></div>';return}items.forEach(item=>{const realIndex=state.inventory.indexOf(item);const div=document.createElement('div');div.className='item-card';div.innerHTML=`<span class="item-icon">${item.icon}</span><div class="item-info"><div class="item-name ${item.rarity==='mythic'?'mythic':''}">${item.name} ${item.qty>1?'(x'+item.qty+')':''}</div><div class="item-price">💰 ${item.price??'?'}</div><div class="item-type">${item.type} | ${item.rarity}</div></div><div style="display:flex;flex-direction:column;gap:6px"><button class="btn btn-sell" onclick="sellItem(${realIndex})">Продать</button><button class="btn btn-list" onclick="openSellModal(${realIndex})">Выставить</button></div>`;c.appendChild(div)})}
function showCrafts(){const modal=document.createElement('div');modal.className='modal';modal.innerHTML=`<div class="modal-overlay" onclick="this.parentElement.remove()"></div><div class="modal-content"><h2 style="text-align:center;margin-bottom:16px">🛠️ Крафты</h2>${CRAFT_RECIPES.map(recipe=>{const result=ITEMS.find(i=>i.id===recipe.resultId);const ingredientsText=recipe.ingredients.map(ing=>{const ingItem=ITEMS.find(i=>i.id===ing.id);return `${ingItem.icon} ${ingItem.name} x${ing.qty}`}).join(' + ');const canCraft=recipe.ingredients.every(ing=>{const count=state.inventory.filter(i=>i.id===ing.id).reduce((sum,i)=>sum+(i.qty||1),0);return count>=ing.qty});return `<div class="item-card"><div class="item-info"><div class="item-name ${result.rarity==='mythic'?'mythic':''}">${result.icon} ${result.name}</div><div class="item-type">${ingredientsText}</div></div><button class="btn btn-craft" ${canCraft?'':'disabled style="opacity:.5"'} onclick="craftItem(${recipe.id})">Скрафтить</button></div>`}).join('')}<button class="btn btn-secondary" style="margin-top:12px" onclick="this.closest('.modal').remove()">Закрыть</button></div>`;document.body.appendChild(modal)}
function craftItem(recipeId){const recipe=CRAFT_RECIPES.find(r=>r.id===recipeId);if(!recipe)return;const canCraft=recipe.ingredients.every(ing=>{const count=state.inventory.filter(i=>i.id===ing.id).reduce((sum,i)=>sum+(i.qty||1),0);return count>=ing.qty});if(!canCraft){showToast('Недостаточно материалов!','error');return}recipe.ingredients.forEach(ing=>{let remaining=ing.qty;for(let i=state.inventory.length-1;i>=0&&remaining>0;i--){if(state.inventory[i].id===ing.id){const item=state.inventory[i];const qty=item.qty||1;if(qty<=remaining){remaining-=qty;state.inventory.splice(i,1)}else{item.qty-=remaining;remaining=0}}}});const resultItem=ITEMS.find(i=>i.id===recipe.resultId);state.inventory.push({...resultItem,qty:1});state.stats.itemsReceived++;save();document.querySelector('.modal').remove();renderInventory();showToast(`✅ Скрафчено: ${resultItem.name}!`,'success');sendToBot({action:'craft',recipeId:recipe.id,resultId:resultItem.id})}
function sellItem(index){const item=state.inventory[index];if(item.price===null||item.price===undefined){showToast('Нельзя продать этот предмет!','error');return}const price=Math.floor(item.price*.6);showConfirmModal(item.icon,`Продать ${item.name}?`,`+💰 ${price}`,()=>{state.inventory.splice(index,1);state.balance+=price;state.stats.totalEarned+=price;updateBalance();save();renderInventory();showToast('✅ +💰 '+price,'success');sendToBot({action:'sell',itemId:item.id,price:price})})}
function openSellModal(index){const item=state.inventory[index];if(item.price===null||item.price===undefined){showToast('Нельзя выставить этот предмет!','error');return}const modal=document.createElement('div');modal.className='modal';modal.innerHTML=`<div class="modal-overlay" onclick="this.parentElement.remove()"></div><div class="modal-content"><h2 style="text-align:center;margin-bottom:16px">📊 Выставить на рынок</h2><p style="text-align:center;margin-bottom:16px">${item.icon} ${item.name}</p><input id="sell-price" type="number" class="form-input" value="${item.price}" placeholder="Цена"><button class="btn btn-primary" style="margin-bottom:8px" onclick="confirmSell(${index})">Выставить</button><button class="btn btn-secondary" onclick="this.closest('.modal').remove()">Отмена</button></div>`;document.body.appendChild(modal)}
function confirmSell(index){const price=parseInt(document.getElementById('sell-price').value);if(!price||price<1){showToast('Введите цену!','error');return}const item=state.inventory[index];state.inventory.splice(index,1);state.market.push({id:Date.now(),item:item,seller:'Вы',price:price});document.querySelector('.modal').remove();save();renderInventory();showToast('✅ Выставлено за 💰 '+price,'success');sendToBot({action:'list_market',itemId:item.id,price:price})}
function renderMarket(){const c=document.getElementById('market-list');c.innerHTML='';if(!state.market.length){c.innerHTML='<div style="text-align:center;padding:40px;color:#6b6b7b"><div style="font-size:64px">📊</div><p>Рынок пуст</p></div>';return}state.market.forEach((listing,index)=>{const div=document.createElement('div');div.className='item-card';div.innerHTML=`<span class="item-icon">${listing.item.icon}</span><div class="item-info"><div class="item-name ${listing.item.rarity==='mythic'?'mythic':''}">${listing.item.name}</div><div class="item-price">💰 ${listing.price}</div><div class="item-type">${listing.seller}</div></div>${listing.seller==='Вы'?'<button class="btn btn-remove" onclick="removeListing('+index+')">Снять</button>':'<button class="btn btn-buy" onclick="buyItem('+index+')">Купить</button>'}`;c.appendChild(div)})}
function buyItem(index){const listing=state.market[index];if(state.balance<listing.price){showToast('Недостаточно монет!','error');return}showConfirmModal(listing.item.icon,`Купить ${listing.item.name}?`,`-💰 ${listing.price}`,()=>{state.balance-=listing.price;state.inventory.push({...listing.item,qty:1});state.market.splice(index,1);updateBalance();save();renderMarket();showToast('✅ Куплено!','success');sendToBot({action:'buy_market',listingId:listing.id,price:listing.price})})}
function removeListing(index){const listing=state.market[index];state.inventory.push({...listing.item,qty:1});state.market.splice(index,1);save();renderMarket();showToast('✅ Снято','success');sendToBot({action:'remove_listing',listingId:listing.id})}
function setChatMode(mode){currentChatMode=mode;document.getElementById('chat-tab-general').classList.toggle('active',mode==='general');document.getElementById('chat-tab-private').classList.toggle('active',mode==='private');renderChat()}
function renderChat(){const c=document.getElementById('chat-list');c.innerHTML='';if(currentChatMode==='general'){c.innerHTML=`<div class="chat-messages" id="chat-messages">${state.chatMessages.map(msg=>{const isMy=msg.user===state.username;return `<div class="chat-msg ${isMy?'my-msg':'other-msg'}"><div class="chat-user">${msg.user}</div><div class="chat-bubble">${msg.text}</div><div class="chat-time">${msg.time}</div></div>`}).join('')}</div><div style="display:flex;gap:8px"><input id="chat-input" class="form-input" placeholder="Сообщение..." style="flex:1;margin-bottom:0"><button class="btn btn-primary" style="width:auto;padding:12px" onclick="sendChatMessage()">➤</button></div>`;const container=document.getElementById('chat-messages');if(container)container.scrollTop=container.scrollHeight}else{c.innerHTML=`<div style="margin-bottom:8px"><input id="private-recipient" class="form-input" placeholder="Ник собеседника"><button class="btn btn-secondary" onclick="openPrivateChat()">Открыть ЛС</button></div><div id="private-chat-area">${activePrivateChat?renderPrivateMessages(activePrivateChat):'<p style="text-align:center;color:#6b6b7b">Выберите собеседника</p>'}</div>`}}
function renderPrivateMessages(recipient){const msgs=state.privateMessages[recipient]||[];return `<div class="chat-messages">${msgs.map(msg=>{const isMy=msg.from===state.username;return `<div class="chat-msg ${isMy?'my-msg':'other-msg'}"><div class="chat-user">${msg.from}</div><div class="chat-bubble">${msg.text}</div><div class="chat-time">${msg.time}</div></div>`}).join('')}</div><div style="display:flex;gap:8px"><input id="private-input" class="form-input" placeholder="Сообщение..." style="flex:1;margin-bottom:0"><button class="btn btn-primary" style="width:auto;padding:12px" onclick="sendPrivateMessage('${recipient}')">➤</button></div>`}
function openPrivateChat(){const recipient=document.getElementById('private-recipient').value.trim();if(!recipient){showToast('Введите ник!','error');return}activePrivateChat=recipient;document.getElementById('private-chat-area').innerHTML=renderPrivateMessages(recipient)}
function sendChatMessage(){const input=document.getElementById('chat-input');const text=input.value.trim();if(!text)return;const msg={user:state.username||'Вы',text:text,time:new Date().toLocaleTimeString()};state.chatMessages.push(msg);save();input.value='';renderChat();const container=document.getElementById('chat-messages');if(container)container.scrollTop=container.scrollHeight;sendToBot({action:'chat_message',message:text,server:state.currentServer})}
function sendPrivateMessage(recipient){const input=document.getElementById('private-input');const text=input.value.trim();if(!text)return;if(!state.privateMessages[recipient])state.privateMessages[recipient]=[];state.privateMessages[recipient].push({from:state.username||'Вы',text:text,time:new Date().toLocaleTimeString()});save();document.getElementById('private-chat-area').innerHTML=renderPrivateMessages(recipient)}
function renderSettings(){const c=document.getElementById('settings-list');c.innerHTML=`<div class="settings-section"><h3 class="settings-title">👤 Профиль</h3><div class="settings-row"><span>Ник</span><span>${state.username||'Гость'}</span></div><div class="settings-row"><span>Баланс</span><span style="color:#ffd700">💰 ${state.balance}</span></div><div class="settings-row"><span>Сервер</span><span>${state.currentServer?state.currentServer.toUpperCase():'Не выбран'}</span></div></div><div class="settings-section"><h3 class="settings-title">⚙️ Настройки</h3><div class="settings-row"><span>🔊 Звук</span><div class="switch ${state.sound?'active':''}" onclick="state.sound=!state.sound;save();renderSettings()"></div></div><div class="settings-row"><span>🔔 Уведомления</span><div class="switch ${state.notifications?'active':''}" onclick="state.notifications=!state.notifications;save();renderSettings()"></div></div></div><div class="settings-section"><h3 class="settings-title">📊 Статистика</h3><div class="settings-row"><span>Кейсов открыто</span><span>${state.stats.casesOpened}</span></div><div class="settings-row"><span>Предметов</span><span>${state.inventory.length}</span></div><div class="settings-row"><span>Потрачено</span><span style="color:#ef4444">-💰 ${state.stats.totalSpent}</span></div><div class="settings-row"><span>Заработано</span><span style="color:#10b981">+💰 ${state.stats.totalEarned}</span></div></div><div class="settings-section"><h3 class="settings-title">📞 Поддержка</h3><button class="btn btn-primary" onclick="showSupportForm()">💬 Написать в поддержку</button></div><div class="settings-section"><h3 class="settings-title">🚪 Сервер</h3><button class="btn btn-primary" onclick="exitServer()">Выйти из сервера</button></div>${state.warnings>0?`<div class="settings-section"><h3 class="settings-title">⚠️ Предупреждения</h3><div class="settings-row"><span>Количество</span><span>${state.warnings}/3</span></div></div>`:''}`}
function showSupportForm(){const modal=document.createElement('div');modal.className='modal';modal.innerHTML=`<div class="modal-overlay" onclick="this.parentElement.remove()"></div><div class="modal-content"><h2 style="text-align:center;margin-bottom:16px">📞 Поддержка</h2><input id="support-subject" class="form-input" placeholder="Тема"><textarea id="support-message" class="form-input" placeholder="Сообщение..."></textarea><button class="btn btn-primary" style="margin-bottom:8px" onclick="sendSupportMessage()">📤 Отправить</button><button class="btn btn-secondary" onclick="this.closest('.modal').remove()">Отмена</button></div>`;document.body.appendChild(modal)}
function sendSupportMessage(){const subject=document.getElementById('support-subject').value.trim(),message=document.getElementById('support-message').value.trim();if(!subject||!message){showToast('Заполните все поля!','error');return}sendToBot({action:'support',subject,message});document.querySelector('.modal').remove();showToast('✅ Отправлено!','success')}
function showDonate(){const modal=document.createElement('div');modal.className='modal';modal.innerHTML=`<div class="modal-overlay" onclick="this.parentElement.remove()"></div><div class="modal-content"><h2 style="text-align:center;margin-bottom:16px">⭐ Пополнение</h2><button class="btn btn-primary" style="margin-bottom:8px" onclick="donate(10)">10 ⭐ = 💰 500</button><button class="btn btn-primary" style="margin-bottom:8px" onclick="donate(50)">50 ⭐ = 💰 3000</button><button class="btn btn-primary" style="margin-bottom:8px" onclick="donate(100)">100 ⭐ = 💰 10000</button><button class="btn btn-secondary" onclick="this.closest('.modal').remove()">Закрыть</button></div>`;document.body.appendChild(modal)}
function donate(stars){document.querySelector('.modal').remove();if(window.Telegram?.WebApp){window.Telegram.WebApp.openTelegramLink('https://t.me/storm_cases_bot?start=donate_'+stars)}}
function showConfirmModal(icon,text,priceText,callback){const modal=document.createElement('div');modal.className='modal';modal.innerHTML=`<div class="modal-overlay" onclick="this.parentElement.remove()"></div><div class="modal-content" style="text-align:center"><div style="font-size:60px;margin-bottom:16px">${icon}</div><p style="margin-bottom:8px">${text}</p><p style="color:#ffd700;font-size:20px;font-weight:700;margin-bottom:16px">${priceText}</p><button class="btn btn-primary" style="margin-bottom:8px" id="confirm-btn">Подтвердить</button><button class="btn btn-secondary" onclick="this.closest('.modal').remove()">Отмена</button></div>`;document.body.appendChild(modal);document.getElementById('confirm-btn').onclick=()=>{modal.remove();callback()}}
load();updateBalance();if(!state.username){showRegistration()}else if(!state.currentServer){initServerSelection()}else{document.getElementById('server-name').textContent=state.currentServer.toUpperCase();renderCases()}
</script>
  <!-- Модальное окно входа админа -->
<div id="admin-login-modal" class="modal hidden">
    <div class="modal-overlay" onclick="closeAdminLogin()"></div>
    <div class="modal-content" style="max-width:400px">
        <h2 style="text-align:center;margin-bottom:16px">🔐 Вход для администратора</h2>
        <input id="admin-password" type="password" class="form-input" placeholder="Пароль администратора">
        <button class="btn btn-primary" onclick="adminLogin()">Войти</button>
        <button class="btn btn-secondary" style="margin-top:8px" onclick="closeAdminLogin()">Отмена</button>
    </div>
</div>

<!-- Главное окно админ-панели -->
<div id="admin-panel" class="modal hidden">
    <div class="modal-overlay" onclick="closeAdminPanel()"></div>
    <div class="modal-content" style="max-width:95%; width:95%; max-height:90vh; overflow-y:auto">
        <h2 style="text-align:center;margin-bottom:16px">🔧 Админ-панель</h2>
        <!-- Вкладки -->
        <div class="admin-tabs">
            <button class="admin-tab active" data-tab="players">👥 Игроки</button>
            <button class="admin-tab" data-tab="logs">📜 Логи</button>
            <button class="admin-tab" data-tab="give">🎁 Выдать</button>
            <button class="admin-tab" data-tab="tickets">📞 Поддержка</button>
            <button class="admin-tab" data-tab="chat">💬 Чат</button>
            <button class="admin-tab" data-tab="servers">🌍 Серверы</button>
            <button class="admin-tab" data-tab="economy">💰 Экономика</button>
        </div>
        <div id="admin-content"></div>
        <button class="btn btn-secondary" style="margin-top:16px" onclick="closeAdminPanel()">Закрыть</button>
    </div>
</div>

<!-- Модальное окно для действий с игроком (мут/бан/предупреждение) -->
<div id="player-action-modal" class="modal hidden">
    <div class="modal-overlay" onclick="closePlayerAction()"></div>
    <div class="modal-content" style="max-width:400px">
        <h3 id="player-action-title" style="text-align:center;margin-bottom:16px">Действие с игроком</h3>
        <div class="form-group">
            <label class="form-label">Причина (обязательно)</label>
            <input id="player-action-reason" class="form-input" placeholder="Причина">
        </div>
        <div class="form-group">
            <label class="form-label">Длительность (для мута/бана, в часах)</label>
            <input id="player-action-duration" type="number" class="form-input" placeholder="Например, 24">
        </div>
        <button class="btn btn-danger" onclick="executePlayerAction()">Выполнить</button>
        <button class="btn btn-secondary" style="margin-top:8px" onclick="closePlayerAction()">Отмена</button>
    </div>
</div>

<!-- Модальное окно для выдачи предметов/денег -->
<div id="give-modal" class="modal hidden">
    <div class="modal-overlay" onclick="closeGiveModal()"></div>
    <div class="modal-content" style="max-width:400px">
        <h3 style="text-align:center;margin-bottom:16px">🎁 Выдать игроку</h3>
        <div class="form-group">
            <label class="form-label">Ник или ID игрока</label>
            <input id="give-target" class="form-input" placeholder="Введите ник или ID">
        </div>
        <div class="form-group">
            <label class="form-label">Тип выдачи</label>
            <select id="give-type" class="form-input" onchange="toggleGiveFields()">
                <option value="coins">Монеты</option>
                <option value="item">Предмет</option>
            </select>
        </div>
        <div id="give-coins-field" class="form-group">
            <label class="form-label">Количество монет</label>
            <input id="give-coins" type="number" class="form-input" placeholder="Сумма">
        </div>
        <div id="give-item-field" class="form-group hidden">
            <label class="form-label">Предмет</label>
            <select id="give-item" class="form-input">
                <!-- Заполняется из JS -->
            </select>
        </div>
        <button class="btn btn-primary" onclick="executeGive()">Выдать</button>
        <button class="btn btn-secondary" style="margin-top:8px" onclick="closeGiveModal()">Отмена</button>
    </div>
</div>
