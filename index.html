<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STORM CASES</title>
    <style>
        :root {
            --bg: #08080f;
            --bg2: #0e0e18;
            --card: rgba(255, 255, 255, 0.04);
            --card-hover: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.08);
            --glass: rgba(20, 20, 35, 0.75);
            --text: #e8e8f0;
            --text2: #9a9ab0;
            --accent: #7c3aed;
            --accent2: #a855f7;
            --gold: #ffd700;
            --green: #22c55e;
            --red: #ef4444;
            --orange: #f97316;
            --c-common: #9e9e9e;
            --c-rare: #4fc3f7;
            --c-epic: #ab47bc;
            --c-legendary: #ffd700;
            --c-mythic: #ff4081;
            --radius: 14px;
            --maxw: 420px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            height: 100%;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at 50% 0%, #1a1a2e 0%, #08080f 60%);
        }
        #app {
            width: 100%;
            max-width: var(--maxw);
            height: 100vh;
            max-height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            background: var(--bg);
            border-radius: 0;
            box-shadow: var(--shadow);
        }
        @media(min-width:421px) {
            #app {
                border-radius: 20px;
                height: 90vh;
                max-height: 780px;
            }
        }
        .screen {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px;
            animation: fadeIn 0.3s ease;
            background: var(--bg);
        }
        .screen.active {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-8px); }
            20%, 40%, 60%, 80% { transform: translateX(8px); }
        }
        @keyframes spinReveal {
            0% { transform: rotate(0deg) scale(0.5); opacity: 0; }
            50% { transform: rotate(180deg) scale(1.1); opacity: 1; }
            100% { transform: rotate(360deg) scale(1); }
        }
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 15px rgba(124, 58, 237, 0.5); }
            50% { box-shadow: 0 0 35px rgba(168, 85, 247, 0.8); }
        }
        .shake { animation: shake 0.5s ease; }
        .spin-reveal { animation: spinReveal 0.8s ease forwards; }
        .glass {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 16px;
            transition: var(--transition);
            cursor: pointer;
        }
        .card:hover { background: var(--card-hover); transform: translateY(-2px); }
        .card:active { transform: scale(0.97); }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.3px;
            background: var(--accent);
            color: #fff;
            width: 100%;
            text-align: center;
            user-select: none;
        }
        .btn:hover { background: var(--accent2); transform: translateY(-1px); }
        .btn:active { transform: scale(0.96); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.15); }
        .btn-danger { background: var(--red); }
        .btn-danger:hover { background: #dc2626; }
        .btn-success { background: var(--green); }
        .btn-success:hover { background: #16a34a; }
        .btn-sm { padding: 7px 12px; font-size: 12px; width: auto; border-radius: 7px; }
        .btn-xs { padding: 5px 9px; font-size: 11px; width: auto; border-radius: 6px; }
        input, textarea, select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
            font-family: inherit;
        }
        input:focus, textarea:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
        }
        input::placeholder, textarea::placeholder { color: #555; }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            width: 100%;
            max-width: 380px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: var(--shadow);
            animation: fadeIn 0.3s ease;
            position: relative;
        }
        .modal h3 { margin-bottom: 14px; font-size: 18px; font-weight: 700; text-align: center; }
        .modal .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .modal .close-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .tab-bar {
            display: flex;
            gap: 6px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 12px;
            flex-wrap: nowrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .tab-btn {
            padding: 9px 14px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text2);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .tab-btn.active { background: var(--accent); color: #fff; }
        .tab-btn:hover:not(.active) { background: rgba(255, 255, 255, 0.06); }
        .rarity-common { color: var(--c-common); }
        .rarity-rare { color: var(--c-rare); }
        .rarity-epic { color: var(--c-epic); }
        .rarity-legendary { color: var(--c-legendary); }
        .rarity-mythic { color: var(--c-mythic); text-shadow: 0 0 10px rgba(255, 64, 129, 0.6); }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .badge-common { background: rgba(158, 158, 158, 0.2); color: var(--c-common); }
        .badge-rare { background: rgba(79, 195, 247, 0.2); color: var(--c-rare); }
        .badge-epic { background: rgba(171, 71, 188, 0.25); color: var(--c-epic); }
        .badge-legendary { background: rgba(255, 215, 0, 0.2); color: var(--c-legendary); }
        .badge-mythic { background: rgba(255, 64, 129, 0.25); color: var(--c-mythic); animation: glow 2s infinite; }
        .item-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 6px;
            transition: var(--transition);
            cursor: pointer;
        }
        .item-row:hover { background: rgba(255, 255, 255, 0.06); }
        .item-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.05);
        }
        .chat-message {
            padding: 8px 12px;
            border-radius: 12px;
            margin-bottom: 6px;
            max-width: 80%;
            word-wrap: break-word;
            font-size: 13px;
            line-height: 1.4;
        }
        .chat-message.own {
            margin-left: auto;
            background: var(--accent);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .chat-message.other {
            margin-right: auto;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }
        .chat-message .sender { font-size: 11px; font-weight: 700; opacity: 0.7; margin-bottom: 2px; }
        .chat-message .time { font-size: 10px; opacity: 0.5; text-align: right; margin-top: 3px; }
        .scroll-y {
            overflow-y: auto;
            flex: 1;
            min-height: 0;
            -webkit-overflow-scrolling: touch;
        }
        .flex-col { display: flex; flex-direction: column; gap: 8px; }
        .flex-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .mt-8 { margin-top: 8px; }
        .mt-12 { margin-top: 12px; }
        .mt-16 { margin-top: 16px; }
        .mb-8 { margin-bottom: 8px; }
        .mb-12 { margin-bottom: 12px; }
        .text-center { text-align: center; }
        .text-sm { font-size: 12px; }
        .text-xs { font-size: 11px; }
        .text-muted { color: var(--text2); }
        .fw-bold { font-weight: 700; }
        .w-100 { width: 100%; }
        .gap-6 { gap: 6px; }
        .gap-8 { gap: 8px; }
        .gap-10 { gap: 10px; }
        .hidden { display: none !important; }
        .server-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            margin-bottom: 8px;
            border-radius: var(--radius);
            background: var(--card);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: var(--transition);
        }
        .server-card:hover { background: var(--card-hover); transform: translateX(4px); }
        .server-online {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            color: var(--green);
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            display: inline-block;
        }
        .dot-offline { background: var(--red); }
        .case-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .case-card {
            padding: 14px;
            text-align: center;
            border-radius: var(--radius);
            background: var(--card);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .case-card:hover { background: var(--card-hover); transform: translateY(-3px); }
        .case-card .case-icon { font-size: 40px; margin-bottom: 8px; animation: pulse 2s infinite; }
        .case-card .price { font-weight: 700; color: var(--gold); font-size: 14px; }
        .admin-badge {
            background: var(--accent);
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .warn-badge {
            background: var(--orange);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
        }
        .filter-section {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            display: none;
        }
        .filter-section.active { display: block; animation: fadeIn 0.2s ease; }
        .market-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 6px;
        }
        .case-animation-container {
            text-align: center;
            padding: 30px 10px;
            position: relative;
        }
        .case-animation-container .case-box {
            font-size: 80px;
            animation: shake 0.5s infinite;
        }
        .case-animation-container .reveal-item {
            font-size: 60px;
            display: none;
            animation: spinReveal 0.8s ease forwards;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stat-row:last-child { border-bottom: none; }
        .toggle-switch {
            width: 48px;
            height: 26px;
            border-radius: 13px;
            background: rgba(255, 255, 255, 0.15);
            cursor: pointer;
            position: relative;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .toggle-switch.active { background: var(--accent); }
        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fff;
            transition: var(--transition);
        }
        .toggle-switch.active::after { left: 25px; }
        .admin-tab-content { display: none; }
        .admin-tab-content.active { display: block; animation: fadeIn 0.2s ease; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 2px; }
        .price-tag { color: var(--gold); font-weight: 700; }
        .empty-state {
            text-align: center;
            padding: 30px 15px;
            color: var(--text2);
            font-size: 14px;
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 10px; opacity: 0.5; }
    </style>
</head>
<body>
    <div id="app">
        <!-- Loading Screen -->
        <div class="screen active" id="screen-loading">
            <div class="flex-col" style="justify-content:center;height:100%;align-items:center;">
                <div style="font-size:60px;animation:pulse 1s infinite;">🎁</div>
                <h2 class="mt-8">STORM CASES</h2>
                <p class="text-muted mt-8">Загрузка...</p>
            </div>
        </div>

        <!-- Servers Screen -->
        <div class="screen" id="screen-servers">
            <div class="flex-col" style="height:100%;">
                <div class="text-center mb-12">
                    <h2 style="font-size:22px;font-weight:700;">Выбор сервера</h2>
                    <p class="text-muted text-sm mt-8" id="servers-greeting"></p>
                </div>
                <div class="scroll-y flex-col gap-8" style="flex:1;">
                    <div id="servers-list"></div>
                </div>
                <button class="btn btn-secondary mt-8" onclick="location.reload()">🔄 Перезагрузить</button>
            </div>
        </div>

        <!-- Main Screen -->
        <div class="screen" id="screen-main">
            <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0 10px;border-bottom:1px solid var(--border);margin-bottom:10px;flex-wrap:wrap;gap:6px;">
                <div class="flex-row gap-8">
                    <span class="fw-bold" id="main-nick">Игрок</span>
                    <span class="badge badge-common" id="main-server-badge">Server</span>
                </div>
                <div class="flex-row gap-8">
                    <span class="price-tag" id="main-balance" style="cursor:pointer;" title="Нажмите для пополнения">💰 0</span>
                </div>
            </div>
            <div class="tab-bar" id="main-tabs">
                <button class="tab-btn active" data-tab="cases">🎁 Кейсы</button>
                <button class="tab-btn" data-tab="inventory">🎒 Инвентарь</button>
                <button class="tab-btn" data-tab="market">📦 Рынок</button>
                <button class="tab-btn" data-tab="chat">💬 Чат</button>
                <button class="tab-btn" data-tab="settings">⚙️</button>
            </div>
            <div class="scroll-y" style="flex:1;" id="main-content"></div>
        </div>
    </div>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal-content"></div>
    </div>

    <script>
        const API_URL = "http://localhost:8000";
        const tg = window.Telegram?.WebApp;
        const initData = tg?.initData || "";

        let currentUser = null;
        let currentServer = null;
        let currentTab = 'cases';
        let isAdminMode = false;
        let adminLevel = 0;
        let chatTab = 'general';
        let chatRecipient = null;
        let caseOpeningInProgress = false;
        let gameState = null;
        let allItems = {};
        let allCases = [];
        let allServers = [];
        let filterState = false;

        const RARITY_LABELS = {
            common: 'Обычный', rare: 'Редкий', epic: 'Эпический', legendary: 'Легендарный', mythic: 'Мифический'
        };
        const RARITIES = ['common', 'rare', 'epic', 'legendary', 'mythic'];

        const CRAFT_RECIPES = [
            { id: 'craft_rare', name: 'Крафт: Редкий предмет', resultRarity: 'rare', cost: { common: 5 }, description: '5 обычных предметов → 1 редкий' },
            { id: 'craft_legendary', name: 'Крафт: Легендарный предмет', resultRarity: 'legendary', cost: { epic: 3 }, description: '3 эпических предмета → 1 легендарный' },
            { id: 'craft_mythic', name: 'Крафт: Мифический предмет', resultRarity: 'mythic', cost: { legendary: 3 }, description: '3 легендарных предмета → 1 мифический' },
        ];

        const screenLoading = document.getElementById('screen-loading');
        const screenServers = document.getElementById('screen-servers');
        const screenMain = document.getElementById('screen-main');
        const modalOverlay = document.getElementById('modal-overlay');
        const modalContent = document.getElementById('modal-content');
        const mainContent = document.getElementById('main-content');
        const mainNick = document.getElementById('main-nick');
        const mainServerBadge = document.getElementById('main-server-badge');
        const mainBalance = document.getElementById('main-balance');
        const mainTabs = document.getElementById('main-tabs');
        const serversList = document.getElementById('servers-list');
        const serversGreeting = document.getElementById('servers-greeting');

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            modalContent.innerHTML = '';
            caseOpeningInProgress = false;
        }

        function openModal(html) {
            modalContent.innerHTML = html;
            modalOverlay.classList.add('active');
        }

        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay && !caseOpeningInProgress) closeModal();
        });

        async function apiCall(url, method = 'GET', body = null) {
            const headers = {
                'X-Telegram-Init-Data': initData,
                'Content-Type': 'application/json'
            };
            try {
                const response = await fetch(API_URL + url, {
                    method,
                    headers,
                    body: body ? JSON.stringify(body) : null
                });
                if (!response.ok) {
                    const error = await response.text();
                    throw new Error(error);
                }
                return response.json();
            } catch (e) {
                console.error('API Error:', e);
                throw e;
            }
        }

        async function loadGameState() {
            try {
                gameState = await apiCall('/api/state');
                currentUser = gameState.user;
                currentServer = gameState.user.server;
                allItems = gameState.items || {};
                allCases = gameState.cases || [];
                allServers = gameState.servers || [];
                
                adminLevel = isOwner() ? 5 : 0;
                
                updateMainUI();
                renderCases();
            } catch (e) {
                try {
                    const reg = await apiCall('/api/register', 'POST');
                    currentUser = reg.user;
                    await loadGameState();
                } catch (regError) {
                    showScreen('screen-loading');
                    openModal(`<h3>❌ Ошибка подключения</h3><p class="text-center">${e.message}</p><button class="btn mt-8" onclick="closeModal()">ОК</button>`);
                }
            }
        }

        async function loadServers() {
            try {
                const data = await apiCall('/api/servers');
                allServers = data.servers || [];
                renderServers();
            } catch (e) {
                console.error('Error loading servers:', e);
            }
        }

        function isOwner() {
            try {
                const user = JSON.parse(new URLSearchParams(initData).get('user') || '{}');
                return user.id === 8601398572;
            } catch {
                return false;
            }
        }

        function updateMainUI() {
            if (!currentUser) return;
            mainNick.textContent = currentUser.nickname;
            mainServerBadge.textContent = currentUser.server;
            mainBalance.textContent = '💰 ' + currentUser.balance;
        }

        function getItemById(id) {
            for (const rarity in allItems) {
                const item = allItems[rarity]?.find(i => i.id === id);
                if (item) return item;
            }
            return null;
        }

        function estimateItemPrice(rarity) {
            const base = { common: 50, rare: 150, epic: 400, legendary: 1000, mythic: 3000 };
            return base[rarity] || 50;
        }

        // ---------- Cases ----------
        function renderCases() {
            if (!currentUser) return;
            updateMainUI();
            let html = '';
            allCases.forEach(cs => {
                const chancesStr = Object.keys(cs.chances).filter(k => cs.chances[k] > 0).map(k => 
                    `${RARITY_LABELS[k]}: ${Math.round(cs.chances[k]*100)}%`).join(' | ');
                html += `
                    <div class="case-card" onclick="showCaseDetails('${cs.id}')" style="border-color:${cs.color || '#7c3aed'}44;">
                        <div class="case-icon">${cs.icon}</div>
                        <div class="fw-bold">${cs.name}</div>
                        <div class="price mt-8">${cs.price} монет</div>
                        <div class="text-xs text-muted mt-8">${chancesStr}</div>
                    </div>
                `;
            });
            mainContent.innerHTML = `
                <h3 class="mb-8">🎁 Кейсы</h3>
                <div class="case-grid">${html}</div>
            `;
        }

        function showCaseDetails(caseId) {
            const cs = allCases.find(c => c.id === caseId);
            if (!cs) return;
            const itemsList = Object.keys(cs.chances).filter(k => cs.chances[k] > 0).map(r => {
                return `<div class="text-sm ${r}">${RARITY_LABELS[r]}: ${Math.round(cs.chances[r]*100)}%</div>`;
            }).join('');
            openModal(`
                <button class="close-btn" onclick="closeModal()">✕</button>
                <h3>${cs.icon} ${cs.name}</h3>
                <p class="text-center price-tag">${cs.price} монет</p>
                <div class="mt-8 text-sm">${itemsList}</div>
                <p class="text-xs text-muted mt-8 text-center">Возможные предметы соответствующих редкостей</p>
                <button class="btn mt-16" onclick="openCaseById('${cs.id}')">🔓 Открыть за ${cs.price}</button>
                <button class="btn btn-secondary mt-8" onclick="closeModal()">Закрыть</button>
            `);
        }

        async function openCaseById(caseId) {
            const cs = allCases.find(c => c.id === caseId);
            if (!cs) return;
            closeModal();
            try {
                caseOpeningInProgress = true;
                openModal(`
                    <div class="case-animation-container">
                        <div class="case-box">${cs.icon}</div>
                    </div>
                    <p class="text-center text-muted">Открываем...</p>
                `);
                
                const result = await apiCall('/api/action', 'POST', {
                    type: 'open_case',
                    case_id: caseId
                });
                
                currentUser.balance = result.new_balance;
                
                setTimeout(() => {
                    caseOpeningInProgress = false;
                    openModal(`
                        <button class="close-btn" onclick="closeModal()">✕</button>
                        <h3>🎉 Вы получили!</h3>
                        <div class="text-center mt-8">
                            <div style="font-size:60px;">${result.item.icon}</div>
                            <p class="fw-bold mt-8 ${result.item.rarity}">${result.item.name}</p>
                            <span class="badge badge-${result.item.rarity} mt-8">${RARITY_LABELS[result.item.rarity]}</span>
                        </div>
                        <button class="btn mt-16" onclick="closeModal();renderCases();">Забрать</button>
                    `);
                    updateMainUI();
                }, 1200);
            } catch (e) {
                caseOpeningInProgress = false;
                closeModal();
                openModal(`<h3>❌ Ошибка</h3><p class="text-center">${e.message}</p><button class="btn mt-8" onclick="closeModal()">ОК</button>`);
            }
        }

        // ---------- Inventory ----------
        function renderInventory() {
            if (!currentUser) return;
            updateMainUI();
            const inv = currentUser.inventory || [];
            const searchTerm = (document.getElementById('inv-search')?.value || '').toLowerCase();
            const activeFilters = [];
            document.querySelectorAll('.inv-filter-checkbox:checked').forEach(cb => activeFilters.push(cb.value));
            
            let filtered = inv;
            if (searchTerm) {
                filtered = filtered.filter(item => {
                    const info = getItemById(item.item_id);
                    return info?.name?.toLowerCase().includes(searchTerm);
                });
            }
            if (activeFilters.length > 0) {
                filtered = filtered.filter(item => activeFilters.includes(item.rarity));
            }
            
            let itemsHtml = '';
            if (filtered.length === 0) {
                itemsHtml = `<div class="empty-state"><div class="icon">🎒</div>Нет предметов</div>`;
            } else {
                filtered.forEach(invItem => {
                    const info = getItemById(invItem.item_id);
                    const sellPrice = Math.floor(estimateItemPrice(invItem.rarity) * 0.5);
                    itemsHtml += `
                        <div class="item-row">
                            <div class="item-icon">${info ? info.icon : '❓'}</div>
                            <div style="flex:1;">
                                <div class="fw-bold text-sm ${invItem.rarity}">${info ? info.name : 'Неизвестно'}</div>
                                <span class="badge badge-${invItem.rarity}">${RARITY_LABELS[invItem.rarity]}</span>
                                <div class="text-xs text-muted mt-8">${new Date(invItem.obtained_at).toLocaleDateString()}</div>
                            </div>
                            <div class="flex-col gap-6">
                                <button class="btn btn-sm btn-success" onclick="sellInvItem(${invItem.uid})">💰 ${sellPrice}</button>
                                <button class="btn btn-sm btn-secondary" onclick="listInvItem(${invItem.uid})">📦 Рынок</button>
                            </div>
                        </div>
                    `;
                });
            }
            
            mainContent.innerHTML = `
                <h3 class="mb-8">🎒 Инвентарь</h3>
                <div class="flex-row gap-8 mb-8">
                    <input type="text" id="inv-search" placeholder="Поиск..." oninput="renderInventory()" style="flex:1;">
                    <button class="btn btn-sm btn-secondary" onclick="toggleFilters()">🔍 Фильтры</button>
                </div>
                <div class="filter-section ${filterState ? 'active' : ''}" id="inv-filters">
                    <div class="flex-row gap-6 mb-8">
                        ${RARITIES.map(r => `<label class="text-sm"><input type="checkbox" class="inv-filter-checkbox" value="${r}"> ${RARITY_LABELS[r]}</label>`).join('')}
                    </div>
                </div>
                <div class="flex-row gap-8 mb-8">
                    <button class="btn btn-sm btn-secondary" onclick="showCrafts()">🔧 Крафты</button>
                </div>
                <div class="scroll-y" style="max-height:50vh;">${itemsHtml}</div>
            `;
        }

        function toggleFilters() {
            filterState = !filterState;
            const el = document.getElementById('inv-filters');
            if (el) el.classList.toggle('active');
        }

        function sellInvItem(uid) {
            const invItem = currentUser.inventory.find(i => i.uid === uid);
            if (!invItem) return;
            const info = getItemById(invItem.item_id);
            const sellPrice = Math.floor(estimateItemPrice(invItem.rarity) * 0.5);
            openModal(`
                <button class="close-btn" onclick="closeModal()">✕</button>
                <h3>💰 Продажа</h3>
                <p class="text-center mt-8">Продать <span class="fw-bold ${invItem.rarity}">${info ? info.name : 'Предмет'}</span> за ${sellPrice} монет?</p>
                <button class="btn btn-success mt-16" onclick="confirmSell(${uid})">Продать</button>
                <button class="btn btn-secondary mt-8" onclick="closeModal()">Отмена</button>
            `);
        }

        async function confirmSell(uid) {
            closeModal();
            try {
                const result = await apiCall('/api/action', 'POST', {
                    type: 'sell_item',
                    uid: uid
                });
                currentUser.balance = result.new_balance;
                currentUser.inventory = result.inventory;
                updateMainUI();
                renderInventory();
            } catch (e) {
                openModal(`<h3>❌ Ошибка</h3><p class="text-center">${e.message}</p><button class="btn mt-8" onclick="closeModal()">ОК</button>`);
            }
        }

        function listInvItem(uid) {
            const invItem = currentUser.inventory.find(i => i.uid === uid);
            if (!invItem) return;
            const info = getItemById(invItem.item_id);
            openModal(`
                <button class="close-btn" onclick="closeModal()">✕</button>
                <h3>📦 Выставить на рынок</h3>
                <p class="text-center mt-8">${info ? info.icon : '❓'} <span class="fw-bold ${invItem.rarity}">${info ? info.name : 'Предмет'}</span></p>
                <input type="number" id="market-price" class="mt-8" placeholder="Цена" min="1" value="${Math.floor(estimateItemPrice(invItem.rarity)*1.5)}">
                <button class="btn mt-16" onclick="confirmList(${uid})">Выставить</button>
                <button class="btn btn-secondary mt-8" onclick="closeModal()">Отмена</button>
            `);
        }

        async function confirmList(uid) {
            const priceInput = document.getElementById('market-price');
            const price = parseInt(priceInput?.value || '0');
            if (price < 1) return;
            closeModal();
            try {
                const result = await apiCall('/api/action', 'POST', {
                    type: 'list_market',
                    uid: uid,
                    price: price
                });
                currentUser.inventory = result.inventory;
                renderInventory();
            } catch (e) {
                openModal(`<h3>❌ Ошибка</h3><p class="text-center">${e.message}</p><button class="btn mt-8" onclick="closeModal()">ОК</button>`);
            }
        }

        function showCrafts() {
            const recipesHtml = CRAFT_RECIPES.map(r => {
                const canCraft = checkCraftAvailability(r);
                return `
                    <div class="item-row" style="cursor:${canCraft ? 'pointer' : 'default'};opacity:${canCraft ? '1' : '0.5'};">
                        <div style="flex:1;">
                            <div class="fw-bold text-sm">${r.name}</div>
                            <div class="text-xs text-muted">${r.description}</div>
                        </div>
                        <button class="btn btn-sm ${canCraft ? 'btn-success' : 'btn-secondary'}" ${canCraft ? '' : 'disabled'} onclick="craftItem('${r.id}')">Крафт</button>
                    </div>
                `;
            }).join('');
            openModal(`
                <button class="close-btn" onclick="closeModal()">✕</button>
                <h3>🔧 Крафты</h3>
                <div class="mt-8">${recipesHtml}</div>
                <button class="btn btn-secondary mt-16" onclick="closeModal()">Закрыть</button>
            `);
        }

        function checkCraftAvailability(recipe) {
            if (!currentUser || !currentUser.inventory) return false;
            for (const key of Object.keys(recipe.cost)) {
                const count = currentUser.inventory.filter(i => i.rarity === key).length;
                if (count < recipe.cost[key]) return false;
            }
            return true;
        }

        async function craftItem(recipeId) {
            const recipe = CRAFT_RECIPES.find(r => r.id === recipeId);
            if (!recipe) return;
            closeModal();
            try {
                // Отправляем на сервер
                const result = await apiCall('/api/action', 'POST', {
                    type: 'craft',
                    recipe_id: recipeId
                });
                currentUser.inventory = result.inventory;
                openModal(`
                    <button class="close-btn" onclick="closeModal()">✕</button>
                    <h3>🔧 Крафт успешен!</h3>
                    <div class="text-center mt-8">
                        <div style="font-size:60px;">${result.item.icon}</div>
                        <p class="fw-bold mt-8 ${result.item.rarity}">${result.item.name}</p>
                        <span class="badge badge-${result.item.rarity} mt-8">${RARITY_LABELS[result.item.rarity]}</span>
                    </div>
                    <button class="btn mt-16" onclick="closeModal();renderInventory();">Забрать</button>
                `);
            } catch (e) {
                openModal(`<h3>❌ Ошибка</h3><p class="text-center">${e.message}</p><button class="btn mt-8" onclick="closeModal()">ОК</button>`);
            }
        }

        // ---------- Market ----------
        function renderMarket() {
            if (!currentUser) return;
            updateMainUI();
            const listings = gameState.market || [];
            let html = '';
            if (listings.length === 0) {
                html = `<div class="empty-state"><div class="icon">📦</div>Рынок пуст</div>`;
            } else {
                listings.forEach(l => {
                    const info = getItemById(l.item_id);
                    const isOwn = l.seller_id === currentUser.telegram_id;
                    html += `
                        <div class="market-row">
                            <div class="item-icon">${info ? info.icon : '❓'}</div>
                            <div style="flex:1;">
                                <div class="fw-bold text-sm ${l.rarity}">${info ? info.name : 'Неизвестно'}</div>
                                <span class="badge badge-${l.rarity}">${RARITY_LABELS[l.rarity]}</span>
                                <div class="text-xs text-muted mt-8">Продавец: ${l.seller_nick}</div>
                            </div>
                            <div class="flex-col gap-6">
                                <span class="price-tag">${l.price}💰</span>
                                ${isOwn ? 
                                    `<button class="btn btn-xs btn-secondary" onclick="cancelListing(${l.uid})">Снять</button>` :
                                    `<button class="btn btn-xs btn-success" onclick="buyMarket(${l.uid})">Купить</button>`
                                }
                            </div>
                        </div>
                    `;
                });
            }
            mainContent.innerHTML = `
                <h3 class="mb-8">📦 Рынок</h3>
                <p class="text-xs text-muted mb-8">Общий рынок сервера ${currentUser.server}</p>
                <div class="scroll-y" style="max-height:55vh;">${html}</div>
            `;
        }

        async function buyMarket(listingUid) {
            try {
                const result = await apiCall('/api/action', 'POST', {
                    type: 'buy_market',
                    listing_uid: listingUid
                });
                currentUser.balance = result.new_balance;
                currentUser.inventory = result.inventory;
                await loadGameState();
                updateMainUI();
                renderMarket();
            } catch (e) {
                openModal(`<h3>❌ Ошибка</h3><p class="text-center">${e.message}</p><button class="btn mt-8" onclick="closeModal()">ОК</button>`);
            }
        }

        async function cancelListing(listingUid) {
            try {
                const result = await apiCall('/api/action', 'POST', {
                    type: 'cancel_listing',
                    listing_uid: listingUid
                });
                currentUser.inventory = result.inventory;
                await loadGameState();
                renderMarket();
            } catch (e) {
                openModal(`<h3>❌ Ошибка</h3><p class="text-center">${e.message}</p><button class="btn mt-8" onclick="closeModal()">ОК</button>`);
            }
        }

        // ---------- Chat ----------
        function renderChat() {
            if (!currentUser) return;
            updateMainUI();
            const isPrivate = chatTab === 'private';
            const messages = isPrivate ? (gameState.private_chat || []) : (gameState.chat || []);
            
            let msgsHtml = '';
            if (messages.length === 0) {
                msgsHtml = `<div class="empty-state"><div class="icon">💬</div>Нет сообщений</div>`;
            } else {
                messages.forEach(m => {
                    const isOwn = m.sender_id === currentUser.telegram_id;
                    msgsHtml += `
                        <div class="chat-message ${isOwn ? 'own' : 'other'}">
                            <div class="sender">${m.sender_nick}</div>
                            <div>${m.text}</div>
                            <div class="time">${new Date(m.timestamp * 1000).toLocaleTimeString()}</div>
                        </div>
                    `;
                });
            }
            
            const chatHeader = isPrivate ?
                `<div class="flex-row gap-8 mb-8">
                    <button class="btn btn-xs btn-secondary" onclick="switchChatTab('general')">← Общий</button>
                    <span class="fw-bold text-sm">Личные сообщения</span>
                </div>` :
                `<div class="flex-row gap-8 mb-8">
                    <button class="btn btn-xs btn-secondary" onclick="switchChatTab('private')">💬 ЛС</button>
                    <span class="fw-bold text-sm">Общий чат</span>
                </div>`;
            
            mainContent.innerHTML = `
                <h3 class="mb-8">💬 Чат</h3>
                ${chatHeader}
                <div class="scroll-y" id="chat-messages" style="max-height:40vh;">${msgsHtml}</div>
                <div class="flex-row gap-6 mt-8">
                    <input type="text" id="chat-input" placeholder="Сообщение..." style="flex:1;">
                    <button class="btn btn-sm" onclick="sendChatMessage()">📨</button>
                </div>
            `;
            const chatDiv = document.getElementById('chat-messages');
            if (chatDiv) chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        function switchChatTab(tab) {
            chatTab = tab;
            renderChat();
        }

        async function sendChatMessage() {
            const input = document.getElementById('chat-input');
            if (!input || !input.value.trim()) return;
            const text = input.value.trim();
            try {
                await apiCall('/api/action', 'POST', {
                    type: 'send_chat',
                    text: text,
                    is_private: chatTab === 'private'
                });
                input.value = '';
                await loadGameState();
                renderChat();
            } catch (e) {
                openModal(`<h3>❌ Ошибка</h3><p class="text-center">${e.message}</p><button class="btn mt-8" onclick="closeModal()">ОК</button>`);
            }
        }

        // ---------- Settings ----------
        function renderSettings() {
            if (!currentUser) return;
            updateMainUI();
            const adminLvl = isOwner() ? 5 : 0;
            const warningsHtml = currentUser.warnings && currentUser.warnings.length > 0 ?
                `<div class="glass mt-8" style="padding:10px;border-left:3px solid var(--orange);">
                    <div class="fw-bold text-sm">⚠️ Предупреждения:</div>
                    ${currentUser.warnings.map(w => `<div class="text-xs text-muted">${w.reason || w} (${new Date(w.date || Date.now()).toLocaleDateString()})</div>`).join('')}
                </div>` : '';
            
            mainContent.innerHTML = `
                <h3 class="mb-8">⚙️ Настройки</h3>
                <div class="glass" style="padding:14px;">
                    <div class="stat-row"><span class="text-muted">Ник:</span><span class="fw-bold">${currentUser.nickname}</span></div>
                    <div class="stat-row"><span class="text-muted">Баланс:</span><span class="price-tag">${currentUser.balance} монет</span></div>
                    <div class="stat-row"><span class="text-muted">Сервер:</span><span>${currentUser.server}</span></div>
                </div>
                ${warningsHtml}
                <div class="glass mt-8" style="padding:14px;">
                    <div class="stat-row"><span>🔊 Звук</span><div class="toggle-switch ${currentUser.sound_enabled ? 'active' : ''}" onclick="toggleSetting('sound_enabled')"></div></div>
                    <div class="stat-row"><span>🔔 Уведомления</span><div class="toggle-switch ${currentUser.notifications_enabled ? 'active' : ''}" onclick="toggleSetting('notifications_enabled')"></div></div>
                </div>
                <div class="glass mt-8" style="padding:14px;">
                    <div class="fw-bold mb-8">📊 Статистика</div>
                    <div class="stat-row"><span class="text-muted">Открыто кейсов:</span><span>${currentUser.stats?.openedCases || 0}</span></div>
                    <div class="stat-row"><span class="text-muted">Получено предметов:</span><span>${currentUser.stats?.itemsObtained || 0}</span></div>
                    <div class="stat-row"><span class="text-muted">Потрачено:</span><span>${currentUser.stats?.spent || 0} монет</span></div>
                    <div class="stat-row"><span class="text-muted">Заработано:</span><span>${currentUser.stats?.earned || 0} монет</span></div>
                </div>
                <div class="glass mt-8" style="padding:14px;">
                    <div class="fw-bold mb-8">🎫 Поддержка</div>
                    <button class="btn btn-sm btn-secondary" onclick="showSupportForm()">Создать тикет</button>
                </div>
                <div class="flex-col gap-8 mt-8">
                    ${adminLvl > 0 ? `<button class="btn btn-sm btn-secondary" onclick="openAdminPanel()">🛠️ Админ-панель (Уровень ${adminLvl})</button>` : ''}
                    <button class="btn btn-secondary" onclick="showDonateModal()">💎 Пополнить баланс</button>
                    <button class="btn btn-danger" onclick="location.reload()">🔄 Перезагрузить</button>
                </div>
            `;
        }

        async function toggleSetting(setting) {
            try {
                const result = await apiCall('/api/action', 'POST', {
                    type: 'update_settings',
                    [setting]: !currentUser[setting]
                });
                currentUser[setting] = result[setting];
                renderSettings();
            } catch (e) {
                console.error('Error toggling setting:', e);
            }
        }

        function showSupportForm() {
            openModal(`
                <button class="close-btn" onclick="closeModal()">✕</button>
                <h3>🎫 Поддержка</h3>
                <input type="text" id="ticket-subject" class="mt-8" placeholder="Тема">
                <textarea id="ticket-message" class="mt-8" placeholder="Опишите проблему..." rows="4"></textarea>
                <button class="btn mt-16" onclick="submitTicket()">Отправить</button>
                <button class="btn btn-secondary mt-8" onclick="closeModal()">Отмена</button>
            `);
        }

        async function submitTicket() {
            const subject = document.getElementById('ticket-subject')?.value.trim() || 'Без темы';
            const message = document.getElementById('ticket-message')?.value.trim() || 'Без описания';
            if (!message) return;
            try {
                const result = await apiCall('/api/action', 'POST', {
                    type: 'create_ticket',
                    subject: subject,
                    message: message
                });
                closeModal();
                openModal(`<h3>✅ Тикет отправлен</h3><p class="text-center text-muted">ID: ${result.ticket_id}</p><button class="btn mt-8" onclick="closeModal()">ОК</button>`);
            } catch (e) {
                openModal(`<h3>❌ Ошибка</h3><p class="text-center">${e.message}</p><button class="btn mt-8" onclick="closeModal()">ОК</button>`);
            }
        }

        function showDonateModal() {
            openModal(`
                <button class="close-btn" onclick="closeModal()">✕</button>
                <h3>💎 Пополнение баланса</h3>
                <p class="text-xs text-muted text-center mt-8">Оплата через звёзды Telegram</p>
                <div class="mt-8">
                    <div class="item-row" style="cursor:pointer;" onclick="donatePack('donate_10')">
                        <div style="flex:1;"><div class="fw-bold">10 ⭐ = 500 монет</div></div>
                        <button class="btn btn-xs btn-secondary">Купить</button>
                    </div>
                    <div class="item-row" style="cursor:pointer;" onclick="donatePack('donate_50')">
                        <div style="flex:1;"><div class="fw-bold">50 ⭐ = 3000 монет</div></div>
                        <button class="btn btn-xs btn-secondary">Купить</button>
                    </div>
                    <div class="item-row" style="cursor:pointer;" onclick="donatePack('donate_100')">
                        <div style="flex:1;"><div class="fw-bold">100 ⭐ = 10000 монет</div></div>
                        <button class="btn btn-xs btn-secondary">Купить</button>
                    </div>
                </div>
                <button class="btn btn-secondary mt-16" onclick="closeModal()">Закрыть</button>
            `);
        }

        function donatePack(packId) {
            if (tg) {
                tg.openTelegramLink(`https://t.me/storm_cases_bot?start=${packId}`);
            }
            closeModal();
        }

        // ---------- Admin Panel ----------
        function openAdminPanel() {
            if (!isOwner() && adminLevel === 0) return;
            isAdminMode = true;
            adminLevel = isOwner() ? 5 : adminLevel;
            renderAdminPanel();
        }

        function closeAdminPanel() {
            isAdminMode = false;
            adminLevel = isOwner() ? 5 : 0;
            renderSettings();
        }

        function renderAdminPanel() {
            if (!isAdminMode) return;
            const tabs = ['players', 'logs', 'give', 'tickets', 'chat', 'servers', 'economy'];
            if (isOwner()) tabs.push('admins');
            
            const tabsHtml = tabs.map(t => {
                const labels = { players: '👥 Игроки', logs: '📋 Логи', give: '🎁 Выдать', tickets: '🎫 Тикеты', chat: '💬 Чат', servers: '🖥️ Серверы', economy: '💰 Экономика', admins: '👑 Админы' };
                return `<button class="tab-btn ${t === 'players' ? 'active' : ''}" data-atab="${t}" onclick="switchAdminTab('${t}')">${labels[t] || t}</button>`;
            }).join('');
            
            mainContent.innerHTML = `
                <div class="flex-row gap-8 mb-8">
                    <button class="btn btn-xs btn-secondary" onclick="closeAdminPanel()">← Назад</button>
                    <span class="fw-bold">🛠️ Админ-панель (Уровень ${adminLevel})</span>
                </div>
                <div class="tab-bar" style="flex-wrap:wrap;">${tabsHtml}</div>
                <div id="admin-content" class="scroll-y" style="max-height:55vh;"></div>
            `;
            renderAdminTab('players');
        }

        function switchAdminTab(tab) {
            document.querySelectorAll('[data-atab]').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-atab="${tab}"]`)?.classList.add('active');
            renderAdminTab(tab);
        }

        function renderAdminTab(tab) {
            const container = document.getElementById('admin-content');
            if (!container) return;
            
            let html = '';
            switch (tab) {
                case 'players':
                    html = `<h4 class="mb-8">Игроки на сервере ${currentUser.server}</h4>
                        <div class="empty-state">Загрузка игроков...</div>`;
                    break;
                case 'logs':
                    html = `<h4 class="mb-8">Логи действий</h4>
                        <div class="empty-state">Нет логов</div>`;
                    break;
                case 'give':
                    html = `
                        <h4 class="mb-8">Выдать монеты или предмет</h4>
                        <input type="text" id="give-nick" class="mb-8" placeholder="Ник игрока">
                        <input type="number" id="give-coins" class="mb-8" placeholder="Количество монет" min="0">
                        <select id="give-item-rarity" class="mb-8">
                            <option value="">— Предмет (необязательно) —</option>
                            ${RARITIES.map(r => `<option value="${r}">${RARITY_LABELS[r]}</option>`).join('')}
                        </select>
                        <button class="btn" onclick="adminGiveItem()">Выдать</button>
                    `;
                    break;
                case 'tickets':
                    html = `<h4 class="mb-8">Тикеты</h4>
                        <div class="empty-state">Нет тикетов</div>`;
                    break;
                case 'chat':
                    html = `
                        <h4 class="mb-8">Управление чатом</h4>
                        <button class="btn btn-danger" onclick="clearServerChat()">🗑️ Очистить общий чат</button>
                    `;
                    break;
                case 'servers':
                    html = `<h4 class="mb-8">Управление серверами</h4>
                        <div class="empty-state">Загрузка серверов...</div>`;
                    break;
                case 'economy':
                    html = `
                        <h4 class="mb-8">Экономика сервера</h4>
                        <div class="flex-col gap-8">
                            <label class="text-sm">Начальный баланс:</label>
                            <input type="number" id="eco-start-balance" value="1000" min="0">
                            <label class="text-sm">Множитель продажи:</label>
                            <input type="number" id="eco-sell-mult" value="0.5" min="0.1" step="0.1">
                            <button class="btn" onclick="adminSaveEconomy()">Сохранить</button>
                        </div>
                    `;
                    break;
                case 'admins':
                    html = `<h4 class="mb-8">Администраторы сервера</h4>
                        <div class="empty-state">Нет админов</div>`;
                    break;
                default:
                    html = '<div class="empty-state">Выберите вкладку</div>';
            }
            container.innerHTML = html;
        }

        function adminGiveItem() {
            const nick = document.getElementById('give-nick')?.value.trim();
            const coins = parseInt(document.getElementById('give-coins')?.value || '0');
            const rarity = document.getElementById('give-item-rarity')?.value;
            if (!nick) return;
            
            // Отправляем на сервер (нужно добавить в main.py)
            openModal(`<h3>✅ Выдано</h3><p class="text-center text-muted">${coins > 0 ? coins + ' монет ' : ''}${rarity ? 'предмет ' + RARITY_LABELS[rarity] : ''} для ${nick}</p><button class="btn mt-8" onclick="closeModal()">ОК</button>`);
        }

        function clearServerChat() {
            openModal(`<h3>✅ Чат очищен</h3><button class="btn mt-8" onclick="closeModal()">ОК</button>`);
        }

        function adminSaveEconomy() {
            openModal(`<h3>✅ Сохранено</h3><button class="btn mt-8" onclick="closeModal()">ОК</button>`);
        }

        // ---------- Servers ----------
        function renderServers() {
            if (!currentUser) return;
            serversGreeting.textContent = `Игрок: ${currentUser.nickname}`;
            let html = '';
            allServers.forEach(server => {
                const isOnline = server.is_online !== false;
                html += `
                    <div class="server-card" onclick="selectServer('${server.server_name}')">
                        <div>
                            <div class="fw-bold" style="font-size:16px;">${server.server_name}</div>
                            <div class="text-xs text-muted mt-8">Стартовый баланс: ${server.start_balance}</div>
                        </div>
                        <div class="server-online">
                            <span class="dot ${isOnline ? '' : 'dot-offline'}"></span>
                            <span>${isOnline ? server.online : 'Откл.'}</span>
                        </div>
                    </div>
                `;
            });
            serversList.innerHTML = html;
        }

        async function selectServer(serverName) {
            try {
                const result = await apiCall('/api/action', 'POST', {
                    type: 'change_server',
                    server: serverName
                });
                currentUser.server = result.server;
                currentServer = result.server;
                await loadGameState();
                showScreen('screen-main');
            } catch (e) {
                openModal(`<h3>❌ Ошибка</h3><p class="text-center">${e.message}</p><button class="btn mt-8" onclick="closeModal()">ОК</button>`);
            }
        }

        // ---------- Event Listeners ----------
        mainTabs.addEventListener('click', function(e) {
            const btn = e.target.closest('.tab-btn');
            if (!btn) return;
            const tab = btn.dataset.tab;
            if (!tab) return;
            mainTabs.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentTab = tab;
            switch(tab) {
                case 'cases': renderCases(); break;
                case 'inventory': renderInventory(); break;
                case 'market': renderMarket(); break;
                case 'chat': renderChat(); break;
                case 'settings': renderSettings(); break;
            }
        });

        document.getElementById('main-balance').addEventListener('click', function() {
            showDonateModal();
        });

        // ---------- Window Functions ----------
        window.showCaseDetails = showCaseDetails;
        window.openCaseById = openCaseById;
        window.sellInvItem = sellInvItem;
        window.confirmSell = confirmSell;
        window.listInvItem = listInvItem;
        window.confirmList = confirmList;
        window.showCrafts = showCrafts;
        window.craftItem = craftItem;
        window.toggleFilters = toggleFilters;
        window.buyMarket = buyMarket;
        window.cancelListing = cancelListing;
        window.switchChatTab = switchChatTab;
        window.sendChatMessage = sendChatMessage;
        window.toggleSetting = toggleSetting;
        window.showSupportForm = showSupportForm;
        window.submitTicket = submitTicket;
        window.showDonateModal = showDonateModal;
        window.donatePack = donatePack;
        window.openAdminPanel = openAdminPanel;
        window.closeAdminPanel = closeAdminPanel;
        window.switchAdminTab = switchAdminTab;
        window.adminGiveItem = adminGiveItem;
        window.clearServerChat = clearServerChat;
        window.adminSaveEconomy = adminSaveEconomy;
        window.selectServer = selectServer;
        window.closeModal = closeModal;

        // ---------- Initialize ----------
        async function init() {
            await loadGameState();
            await loadServers();
        }

        init();
    </script>
</body>
</html>
