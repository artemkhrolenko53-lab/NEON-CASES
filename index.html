<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STORM CASES</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div id="app">
        <!-- Шапка -->
        <header class="header">
            <div class="logo">⚡ STORM CASES</div>
            <div class="header-right">
                <span class="server-badge" id="server-name">Сервер: -</span>
                <button class="balance-btn" onclick="showDonate()">
                    <span>💰</span><span id="balance">500</span><span>+</span>
                </button>
            </div>
        </header>

        <!-- Вкладки -->
        <main class="content">
            <div id="tab-cases" class="tab-content active"><div id="cases-list"></div></div>
            <div id="tab-market" class="tab-content"><div id="market-list"></div></div>
            <div id="tab-inventory" class="tab-content"><div id="inventory-list"></div></div>
            <div id="tab-chat" class="tab-content">
                <div class="chat-tabs">
                    <button class="chat-tab active" id="chat-tab-general" onclick="setChatMode('general')">💬 Общий</button>
                    <button class="chat-tab" id="chat-tab-private" onclick="setChatMode('private')">📩 ЛС</button>
                </div>
                <div id="chat-list"></div>
            </div>
            <div id="tab-settings" class="tab-content"><div id="settings-list"></div></div>
        </main>

        <!-- Нижняя навигация -->
        <nav class="bottom-nav">
            <div class="nav-container">
                <button class="nav-btn active" data-tab="cases" onclick="switchTab('cases')"><span class="nav-icon">📦</span><span class="nav-label">Кейсы</span></button>
                <button class="nav-btn" data-tab="market" onclick="switchTab('market')"><span class="nav-icon">📊</span><span class="nav-label">Рынок</span></button>
                <button class="nav-btn" data-tab="inventory" onclick="switchTab('inventory')"><span class="nav-icon">🎒</span><span class="nav-label">Инвентарь</span></button>
                <button class="nav-btn" data-tab="chat" onclick="switchTab('chat')"><span class="nav-icon">💬</span><span class="nav-label">Чат</span></button>
                <button class="nav-btn" data-tab="settings" onclick="switchTab('settings')"><span class="nav-icon">⚙️</span><span class="nav-label">Настройки</span></button>
            </div>
        </nav>

        <!-- Модальные окна -->
        <div id="case-modal" class="modal hidden">
            <div class="modal-overlay" onclick="closeCaseModal()"></div>
            <div class="modal-content" id="case-modal-content"></div>
        </div>

        <div id="opening-overlay" class="opening-overlay hidden">
            <div id="opening-animation"></div>
        </div>

        <div id="sell-modal" class="modal hidden">
            <div class="modal-overlay" onclick="closeSellModal()"></div>
            <div class="modal-content" id="sell-modal-content"></div>
        </div>

        <div id="donate-modal" class="modal hidden">
            <div class="modal-overlay" onclick="closeDonateModal()"></div>
            <div class="modal-content" id="donate-modal-content"></div>
        </div>

        <!-- Админ-панель -->
        <div id="admin-login-modal" class="modal hidden">
            <div class="modal-overlay" onclick="closeAdminLogin()"></div>
            <div class="modal-content">
                <h2 style="text-align:center;margin-bottom:16px">🔐 Вход для администратора</h2>
                <input id="admin-password" type="password" class="form-input" placeholder="Пароль администратора">
                <button class="btn btn-primary" onclick="adminLogin()">Войти</button>
                <button class="btn btn-secondary" style="margin-top:8px" onclick="closeAdminLogin()">Отмена</button>
            </div>
        </div>

        <div id="admin-panel" class="modal hidden">
            <div class="modal-overlay" onclick="closeAdminPanel()"></div>
            <div class="modal-content" style="max-width:95%; width:95%; max-height:90vh; overflow-y:auto">
                <h2 style="text-align:center;margin-bottom:16px">🔧 Админ-панель</h2>
                <div class="admin-tabs" id="admin-tabs">
                    <button class="admin-tab active" data-tab="players">👥 Игроки</button>
                    <button class="admin-tab" data-tab="logs">📜 Логи</button>
                    <button class="admin-tab" data-tab="give">🎁 Выдать</button>
                    <button class="admin-tab" data-tab="tickets">📞 Поддержка</button>
                    <button class="admin-tab" data-tab="chat">💬 Чат</button>
                    <button class="admin-tab" data-tab="servers">🌍 Серверы</button>
                    <button class="admin-tab" data-tab="economy">💰 Экономика</button>
                </div>
                <div id="admin-content"></div>
                <button class="btn btn-secondary" style="margin-top:16px" onclick="closeAdminPanel()">Закрыть</button>
            </div>
        </div>

        <!-- Модальное окно действия с игроком -->
        <div id="player-action-modal" class="modal hidden">
            <div class="modal-overlay" onclick="closePlayerAction()"></div>
            <div class="modal-content">
                <h3 id="player-action-title" style="text-align:center;margin-bottom:16px">Действие</h3>
                <div class="form-group">
                    <label class="form-label">Причина</label>
                    <input id="player-action-reason" class="form-input" placeholder="Причина">
                </div>
                <div class="form-group">
                    <label class="form-label">Длительность (часов)</label>
                    <input id="player-action-duration" type="number" class="form-input" placeholder="Например, 24">
                </div>
                <button class="btn btn-danger" onclick="executePlayerAction()">Выполнить</button>
                <button class="btn btn-secondary" style="margin-top:8px" onclick="closePlayerAction()">Отмена</button>
            </div>
        </div>

        <!-- Тосты -->
        <div id="toasts" class="toasts"></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
    <script src="js/AdminPanel.js"></script>
</body>
</html>
